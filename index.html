<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinControl Pro</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e5eaf1;--nav:#0b1220;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--nav);color:#cbd5e1;padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:20;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px}.logo{width:42px;height:42px;border-radius:13px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{color:#fff;font-size:18px}.brand small{display:block;font-size:9px;letter-spacing:1.5px;margin-top:2px}.nav-title{font-size:10px;color:#64748b;margin:14px 10px 6px;text-transform:uppercase}.nav{width:100%;display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:10px;color:#aebbd0;background:transparent;text-align:left;margin:2px 0}.nav:hover,.nav.active{background:#19263c;color:#fff}.nav .ico{width:20px;text-align:center}.main{margin-left:260px;min-width:0;flex:1}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top h1{font-size:20px;margin:0}.top p{font-size:12px;color:var(--muted);margin:3px 0 0}.top-actions{display:flex;gap:10px;align-items:center}.content{padding:28px;max-width:1500px;margin:auto}.page{display:none}.page.active{display:block}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 5px 22px #17203308}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:25px;font-weight:800;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.purple{color:var(--purple)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:23px}.toolbar p{margin:4px 0;color:var(--muted);font-size:13px}.btn{padding:10px 14px;border-radius:10px;font-weight:700;background:#eef2f7;color:#334155}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.small{padding:7px 9px;font-size:12px}.input{border:1px solid #d8e0ea;background:#fff;border-radius:10px;padding:10px 11px;width:100%;outline:0}.input:focus{border-color:#6b8cff;box-shadow:0 0 0 3px #dbe5ff}.filters{display:flex;gap:9px;flex-wrap:wrap}.filters .input{width:auto;min-width:150px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;padding:11px;text-align:left;white-space:nowrap}.table td{padding:12px 11px;border-top:1px solid #edf1f5;font-size:13px;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800}.paid{background:#dcfce7;color:#047857}.pending{background:#fef3c7;color:#a16207}.overdue{background:#fee2e2;color:#b91c1c}.partial{background:#dbeafe;color:#1d4ed8}.cancelled{background:#e5e7eb;color:#4b5563}.folder-grid,.service-grid,.person-grid,.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.folder-icon{width:45px;height:45px;border-radius:13px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:21px}.muted{color:var(--muted)}.smalltext{font-size:12px}.progress{height:8px;background:#e9eef5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.service-card h3{margin:7px 0 3px}.service-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;font-size:11px;color:var(--muted)}.service-meta b{display:block;color:var(--text);font-size:14px;margin-top:3px}.actions{display:flex;justify-content:flex-end;gap:3px}.empty{text-align:center;padding:45px 20px;color:#94a3b8}.modal{position:fixed;inset:0;background:#02081799;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modal-box{background:#fff;border-radius:18px;width:min(680px,100%);max-height:94vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}.modal-body{padding:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:13px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.full{grid-column:1/-1}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.chart{height:250px;display:flex;align-items:end;gap:12px;padding:20px 10px 0}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:5px}.bar{width:65%;background:#2563eb;border-radius:7px 7px 0 0;min-height:2px}.barcol small{font-size:10px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:100px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.day b{font-size:12px}.event{font-size:9px;border-radius:5px;padding:3px;margin-top:5px;overflow:hidden}.event.in{background:#dcfce7;color:#047857}.event.out{background:#fee2e2;color:#b91c1c}.notice{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px}.list{display:grid;gap:9px}.listrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1f5;font-size:13px}.mobile-menu{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.folder-grid,.service-grid,.person-grid,.account-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:block}.top{padding:0 15px}.content{padding:18px}.g4,.g3,.g2,.folder-grid,.service-grid,.person-grid,.account-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.calendar{grid-template-columns:repeat(2,1fr)}.top-actions .period{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">F</div><div><b>FinControl</b><small>PRO FINANCE</small></div></div>
 <div class="nav-title">Principal</div>
 <button class="nav active" data-page="overview"><span class="ico">⌂</span> Overview</button>
 <button class="nav" data-page="transactions"><span class="ico">↔</span> Movimentações</button>
 <button class="nav" data-page="receivables"><span class="ico">↓</span> A receber</button>
 <button class="nav" data-page="payables"><span class="ico">↑</span> A pagar</button>
 <div class="nav-title">Organização</div>
 <button class="nav" data-page="folders"><span class="ico">▣</span> Categorias / Pastas</button>
 <button class="nav" data-page="services"><span class="ico">◆</span> Serviços</button>
 <button class="nav" data-page="people"><span class="ico">♙</span> Clientes / Fornecedores</button>
 <div class="nav-title">Contas</div>
 <button class="nav" data-page="accounts"><span class="ico">▤</span> Caixas & Contas</button>
 <button class="nav" data-page="cards"><span class="ico">▱</span> Cartões</button>
 <div class="nav-title">Planejamento</div>
 <button class="nav" data-page="calendar"><span class="ico">□</span> Calendário</button>
 <button class="nav" data-page="goals"><span class="ico">◎</span> Metas</button>
 <button class="nav" data-page="reports"><span class="ico">▥</span> Relatórios</button>
 <button class="nav" data-page="settings"><span class="ico">⚙</span> Configurações</button>
</aside>

<main class="main">
<header class="top">
 <div style="display:flex;gap:10px;align-items:center"><button class="btn mobile-menu" id="menuBtn">☰</button><div><h1 id="pageTitle">Overview</h1><p id="pageSub">Sua visão financeira</p></div></div>
 <div class="top-actions"><select class="input period" id="period" style="width:auto"><option value="month">Este mês</option><option value="year">Este ano</option><option value="all">Todos</option></select><button class="btn primary" id="quickAdd">+ Novo lançamento</button></div>
</header>
<div class="content">

<section id="overview" class="page active"></section>
<section id="transactions" class="page"></section>
<section id="receivables" class="page"></section>
<section id="payables" class="page"></section>
<section id="folders" class="page"></section>
<section id="services" class="page"></section>
<section id="people" class="page"></section>
<section id="accounts" class="page"></section>
<section id="cards" class="page"></section>
<section id="calendar" class="page"></section>
<section id="goals" class="page"></section>
<section id="reports" class="page"></section>
<section id="settings" class="page"></section>

</div>
</main>
</div>

<!-- TRANSACTION MODAL -->
<div class="modal" id="txModal"><div class="modal-box"><div class="modal-head"><div><b id="txModalTitle">Novo lançamento</b><div class="smalltext muted">Entrada, saída, recebimento ou pagamento</div></div><button class="btn" data-close="txModal">✕</button></div>
<form id="txForm" class="modal-body"><input id="txId" type="hidden">
<div class="form-grid">
<div class="field"><label>Tipo</label><select id="txType" class="input"><option value="income">Entrada</option><option value="expense">Saída</option></select></div>
<div class="field"><label>Status</label><select id="txStatus" class="input"><option value="paid">Pago / Recebido</option><option value="pending">Pendente</option><option value="overdue">Vencido</option><option value="partial">Parcial</option><option value="cancelled">Cancelado</option></select></div>
<div class="field full"><label>Descrição *</label><input id="txDesc" class="input" required></div>
<div class="field"><label>Valor *</label><input id="txAmount" class="input" type="number" min="0" step=".01" required></div>
<div class="field"><label>Data *</label><input id="txDate" class="input" type="date" required></div>
<div class="field"><label>Categoria / Pasta</label><select id="txFolder" class="input"></select></div>
<div class="field"><label>Conta / Caixa</label><select id="txAccount" class="input"></select></div>
<div class="field full"><label>Cliente / Fornecedor</label><input id="txPerson" class="input"></div>
<div class="field full"><label>Observações</label><textarea id="txNotes" class="input" rows="3"></textarea></div>
</div><div class="modal-foot"><button type="button" class="btn" data-close="txModal">Cancelar</button><button class="btn primary">Salvar lançamento</button></div>
</form></div></div>

<!-- FOLDER MODAL -->
<div class="modal" id="folderModal"><div class="modal-box"><div class="modal-head"><b id="folderModalTitle">Nova pasta</b><button class="btn" data-close="folderModal">✕</button></div>
<form id="folderForm" class="modal-body"><input id="folderId" type="hidden"><div class="field"><label>Nome *</label><input id="folderName" class="input" required></div><div class="field"><label>Descrição</label><textarea id="folderDesc" class="input"></textarea></div><div class="field"><label>Tipo</label><select id="folderType" class="input"><option value="both">Entradas e saídas</option><option value="income">Receitas</option><option value="expense">Despesas</option></select></div><div class="modal-foot"><button type="button" class="btn" data-close="folderModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<!-- SERVICE MODAL -->
<div class="modal" id="serviceModal"><div class="modal-box"><div class="modal-head"><div><b id="serviceModalTitle">Novo serviço</b><div class="smalltext muted">Contrato e recebimentos</div></div><button class="btn" data-close="serviceModal">✕</button></div>
<form id="serviceForm" class="modal-body"><input id="serviceId" type="hidden"><div class="form-grid">
<div class="field"><label>Cliente *</label><input id="serviceClient" class="input" required></div><div class="field"><label>Nome do serviço *</label><input id="serviceName" class="input" required></div>
<div class="field"><label>Data inicial *</label><input id="serviceStart" type="date" class="input" required></div><div class="field"><label>Data final *</label><input id="serviceEnd" type="date" class="input" required></div>
<div class="field"><label>Valor total *</label><input id="serviceTotal" type="number" min="0" step=".01" class="input" required></div><div class="field"><label>Categoria / Pasta</label><select id="serviceFolder" class="input"></select></div>
<div class="field"><label>Modelo de cobrança</label><select id="serviceBilling" class="input"><option value="single">Pagamento único</option><option value="installments">Parcelado</option><option value="fixed">Datas fixas</option></select></div>
<div class="field" id="installmentFields"><label>Número de parcelas</label><input id="serviceN" type="number" min="1" class="input"></div>
<div class="field" id="installmentValueField"><label>Valor de cada parcela</label><input id="serviceV" type="number" min="0" step=".01" class="input"></div>
<div class="field" id="fixedFields"><label>Periodicidade</label><select id="serviceFreq" class="input"><option value="monthly">Mensal</option><option value="weekly">Semanal</option></select></div>
<div class="field" id="fixedDayField"><label>Dia fixo</label><input id="serviceDay" type="number" min="1" max="31" class="input"></div>
<div class="field" id="expectedField"><label>Quantidade prevista</label><input id="serviceExpected" type="number" min="1" class="input"></div>
<div class="field full"><label>Observações</label><textarea id="serviceNotes" class="input"></textarea></div>
</div><div class="modal-foot"><button type="button" class="btn" data-close="serviceModal">Cancelar</button><button class="btn primary">Salvar serviço</button></div>
</form></div></div>

<!-- PAYMENT MODAL -->
<div class="modal" id="paymentModal"><div class="modal-box"><div class="modal-head"><div><b>Registrar pagamento</b><div id="paymentServiceName" class="smalltext muted"></div></div><button class="btn" data-close="paymentModal">✕</button></div>
<form id="paymentForm" class="modal-body"><input id="paymentServiceId" type="hidden"><div class="field"><label>Valor pago *</label><input id="paymentAmount" type="number" min="0.01" step=".01" class="input" required></div><div class="field"><label>Data *</label><input id="paymentDate" type="date" class="input" required></div><div class="field"><label>Forma de pagamento</label><select id="paymentMethod" class="input"><option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Boleto</option><option>Outro</option></select></div><div class="field"><label>Observação</label><input id="paymentNote" class="input"></div><div class="modal-foot"><button type="button" class="btn" data-close="paymentModal">Cancelar</button><button class="btn primary">Registrar</button></div></form>
</div></div>

<script>
(function(){
"use strict";

const KEY="fincontrol_pro_v4";
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

const defaults={
 folders:[
  {id:id(),name:"Casa",desc:"Despesas da casa",type:"expense"},
  {id:id(),name:"Trabalho",desc:"Receitas e custos profissionais",type:"both"},
  {id:id(),name:"Veículo",desc:"Carro e transporte",type:"expense"}
 ],
 accounts:[
  {id:id(),name:"Conta principal",type:"Banco",balance:0},
  {id:id(),name:"Dinheiro",type:"Caixa",balance:0}
 ],
 people:[{id:id(),name:"Cliente Exemplo",kind:"Cliente",phone:"",email:""}],
 cards:[{id:id(),name:"Cartão principal",limit:5000,used:0}],
 transactions:[
  {id:id(),type:"income",status:"paid",desc:"Serviço exemplo",amount:2500,date:today(),folder:"Trabalho",account:"Conta principal",person:"Cliente Exemplo",notes:""},
  {id:id(),type:"expense",status:"paid",desc:"Internet",amount:120,date:today(),folder:"Casa",account:"Conta principal",person:"",notes:""},
  {id:id(),type:"expense",status:"pending",desc:"Energia elétrica",amount:245,date:today(),folder:"Casa",account:"Conta principal",person:"",notes:""}
 ],
 services:[
  {id:id(),client:"Cliente Exemplo",name:"Consultoria mensal",start:today(),end:today(),total:6000,billing:"installments",n:12,v:500,folder:"Trabalho",notes:"",payments:[
   {id:id(),date:today(),amount:500,method:"PIX",note:"Parcela 1"},
   {id:id(),date:today(),amount:500,method:"PIX",note:"Parcela 2"},
   {id:id(),date:today(),amount:500,method:"PIX",note:"Parcela 3"}
  ]}
 ],
 goals:[{id:id(),name:"Reserva financeira",target:10000,current:3500,date:"2027-12-31"}],
 trash:[]
};

let db=load();
let currentPage="overview";
let txSearch="";
let serviceSearch="";

function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(!raw)return structuredClone(defaults);
  const x=JSON.parse(raw);
  return Object.assign(structuredClone(defaults),x,{trash:x.trash||[]});
 }catch(e){return structuredClone(defaults)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function sum(arr,fn){return arr.reduce((s,x)=>s+(fn?fn(x):Number(x.amount||0)),0)}
function periodTx(){
 const p=$("period").value,n=new Date();
 return db.transactions.filter(x=>{
  if(p==="all")return true;
  const d=new Date(x.date+"T12:00:00");
  return p==="year"?d.getFullYear()===n.getFullYear():d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
 });
}
function statusBadge(s){
 const m={paid:["Pago/Recebido","paid"],pending:["Pendente","pending"],overdue:["Vencido","overdue"],partial:["Parcial","partial"],cancelled:["Cancelado","cancelled"]};
 const z=m[s]||m.pending;return '<span class="badge '+z[1]+'">'+z[0]+"</span>";
}
function page(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 $(id).classList.add("active");
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===id));
 const names={
 overview:["Overview","Sua visão financeira"],transactions:["Movimentações","Entradas, saídas e pagamentos"],
 receivables:["A receber","Valores pendentes de recebimento"],payables:["A pagar","Contas e despesas pendentes"],
 folders:["Categorias / Pastas","Organize seus lançamentos"],services:["Serviços","Contratos, parcelas e recebimentos"],
 people:["Clientes / Fornecedores","Pessoas e empresas"],accounts:["Caixas & Contas","Bancos, caixas e saldos"],
 cards:["Cartões","Limites e utilização"],calendar:["Calendário","Visão por datas"],goals:["Metas","Objetivos financeiros"],
 reports:["Relatórios","Análises e indicadores"],settings:["Configurações","Dados locais e preparação para Supabase"]
 };
 $("pageTitle").textContent=names[id][0];$("pageSub").textContent=names[id][1];currentPage=id;renderAll();
 if(window.innerWidth<761)$("sidebar").classList.remove("open");
}
function kpi(label,value,cls){
 return '<div class="card kpi"><div class="label">'+label+'</div><div class="value '+(cls||"")+'">'+money(value)+"</div></div>";
}

function renderOverview(){
 const a=periodTx(),inc=sum(a,x=>x.type==="income"),out=sum(a,x=>x.type==="expense");
 const open=sum(a,x=>x.status!=="paid"&&x.status!=="cancelled");
 const servicesTotal=sum(db.services,x=>x.total),servicesPaid=sum(db.services,x=>servicePaid(x));
 const overdue=a.filter(x=>x.status==="overdue");
 $("overview").innerHTML=
 '<div class="grid g4">'+kpi("Saldo do período",inc-out,"blue")+kpi("Entradas",inc,"green")+kpi("Saídas",out,"red")+kpi("Em aberto",open,"amber")+'</div>'+
 '<div class="grid g2" style="margin-top:16px"><div class="card"><b>Fluxo dos últimos 6 meses</b><div class="smalltext muted">Entradas x saídas</div>'+simpleChart()+'</div>'+
 '<div class="card"><b>Resumo dos serviços</b><div class="list" style="margin-top:10px">'+
 '<div class="listrow"><span>Total contratado</span><b>'+money(servicesTotal)+'</b></div>'+
 '<div class="listrow"><span>Total recebido</span><b class="green">'+money(servicesPaid)+'</b></div>'+
 '<div class="listrow"><span>Restante</span><b class="amber">'+money(Math.max(0,servicesTotal-servicesPaid))+'</b></div>'+
 '<div class="listrow"><span>Vencidos</span><b class="red">'+overdue.length+'</b></div></div></div></div>'+
 '<div class="card" style="margin-top:16px"><div class="toolbar"><div><b>Últimos lançamentos</b><div class="smalltext muted">Período selecionado</div></div><button class="btn primary small" data-action="new-tx">+ Adicionar</button></div>'+txTable(a.slice().reverse().slice(0,8))+"</div>";
}
function simpleChart(){
 const n=new Date(),arr=[];
 for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const z=db.transactions.filter(x=>{const q=new Date(x.date+"T12:00:00");return q.getMonth()===d.getMonth()&&q.getFullYear()===d.getFullYear()});arr.push({l:d.toLocaleDateString("pt-BR",{month:"short"}),i:sum(z,x=>x.type==="income"),o:sum(z,x=>x.type==="expense")})}
 const max=Math.max(1,...arr.flatMap(x=>[x.i,x.o]));
 return '<div class="chart">'+arr.map(x=>'<div class="barcol"><div style="width:100%;display:flex;align-items:end;justify-content:center;height:100%;gap:3px"><div class="bar" title="Entrada '+money(x.i)+'" style="height:'+Math.max(2,x.i/max*90)+'%;background:#059669"></div><div class="bar" title="Saída '+money(x.o)+'" style="height:'+Math.max(2,x.o/max*90)+'%;background:#dc2626"></div></div><small>'+esc(x.l)+'</small></div>').join("")+"</div>";
}
function txTable(arr){
 if(!arr.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';
 return '<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+

function servicePaid(s){return sum(s.payments||[],p=>Number(p.amount||0))}
function expectedCount(s){
 if(s.billing==="installments")return Number(s.n||0);
 if(s.billing==="fixed"&&s.expected)return Number(s.expected);
 if(s.billing==="fixed"){
  const a=new Date(s.start+"T12:00:00"),b=new Date(s.end+"T12:00:00");
  if(s.freq==="weekly")return Math.floor((b-a)/604800000)+1;
  return Math.max(1,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1);
 }
 return 1;
}
function serviceCard(s){
 const p=servicePaid(s),r=Math.max(0,s.total-p),pct=s.total?Math.min(100,p/s.total*100):0,n=expectedCount(s),v=n?s.total/n:s.total,paidN=s.billing==="single"?(p>=s.total?1:0):Math.min(n,Math.floor(p/(v||1)+1e-7)),missing=Math.max(0,n-paidN);
 return '<div class="card service-card"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="smalltext muted">'+esc(s.client)+'</span><h3>'+esc(s.name)+'</h3></div><div class="actions"><button class="btn small" data-action="edit-service" data-id="'+s.id+'">Editar</button><button class="btn small danger" data-action="delete-service" data-id="'+s.id+'">Excluir</button></div></div>'+
 '<div class="service-meta"><div>Total<b>'+money(s.total)+'</b></div><div>Pago<b class="green">'+money(p)+'</b></div><div>Restante<b class="amber">'+money(r)+'</b></div></div><div class="progress"><span style="width:'+pct+'%"></span></div>'+
 '<div style="display:flex;justify-content:space-between;margin-top:7px;font-size:11px"><span>'+pct.toFixed(0)+'% recebido</span><b class="'+(missing?"red":"green")+'">'+(s.billing==="installments"?paidN+" de "+n+" parcelas pagas":s.billing==="fixed"?n+" datas • "+missing+" faltantes":p>=s.total?"Concluído":"Pendente")+'</b></div>'+
 '<div class="smalltext muted" style="margin-top:12px">'+dateBR(s.start)+' → '+dateBR(s.end)+'</div>'+
 '<div style="display:flex;gap:7px;margin-top:14px"><button class="btn" style="flex:1" data-action="payment" data-id="'+s.id+'">+ Registrar pagamento</button><button class="btn" data-action="history" data-id="'+s.id+'">Histórico</button></div></div>';
}

function restore(){const inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.transactions||!x.services)throw Error();db=x;save();renderAll();alert("Backup restaurado.");}catch(e){alert("Arquivo inválido.")}};r.readAsText(f)};inp.click()}

 const a=el.dataset.action,i=el.dataset.id;
 if(a==="new-tx")resetTx(el.dataset.type||"income");
 else if(a==="edit-tx")editTx(i);

 else if(a==="new-folder")openFolder();
 else if(a==="edit-folder")openFolder(i);
 else if(a==="delete-folder")deleteFolder(i);
 else if(a==="folder-detail")renderFolderDetail(i);
 else if(a==="back-folders")renderFolders();
 else if(a==="new-service")openService();
 else if(a==="edit-service")openService(i);
 else if(a==="delete-service")deleteService(i);
 else if(a==="payment")openPayment(i);
 else if(a==="history")historyService(i);
 else if(a==="new-person"){const n=prompt("Nome do cliente/fornecedor:");if(n){const k=prompt("Tipo: Cliente ou Fornecedor","Cliente")||"Cliente";db.people.push({id:id(),name:n,kind:k});save();renderAll()}}
 else if(a==="delete-person"){if(confirm("Excluir contato?")){db.people=db.people.filter(x=>x.id!==i);save();renderAll()}}
 else if(a==="new-account"){const n=prompt("Nome da conta/caixa:");if(n){db.accounts.push({id:id(),name:n,type:"Banco",balance:0});save();renderAll()}}
 else if(a==="delete-account"){if(confirm("Excluir conta?")){db.accounts=db.accounts.filter(x=>x.id!==i);save();renderAll()}}
 else if(a==="new-card"){const n=prompt("Nome do cartão:");if(n){const l=Number(prompt("Limite:")||0);db.cards.push({id:id(),name:n,limit:l,used:0});save();renderAll()}}
 else if(a==="delete-card"){if(confirm("Excluir cartão?")){db.cards=db.cards.filter(x=>x.id!==i);save();renderAll()}}
 else if(a==="new-goal"){const n=prompt("Nome da meta:");if(n){const t=Number(prompt("Valor objetivo:")||0);db.goals.push({id:id(),name:n,target:t,current:0,date:today()});save();renderAll()}}
 else if(a==="goal-add"){const g=db.goals.find(x=>x.id===i),v=Number(prompt("Valor a adicionar:")||0);if(g&&v>0){g.current+=v;save();renderAll()}}
 else if(a==="delete-goal"){if(confirm("Excluir meta?")){db.goals=db.goals.filter(x=>x.id!==i);save();renderAll()}}
 else if(a==="export-csv")exportCSV();
 else if(a==="backup")backup();
 else if(a==="restore")restore();
 else if(a==="reset")reset();
 else if(a==="empty-trash"){if(confirm("Esvaziar lixeira permanentemente?")){db.trash=[];save();renderAll()}}
});

$("quickAdd").onclick=()=>resetTx("income");
$("period").onchange=()=>renderAll();
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("serviceBilling").onchange=toggleBilling;

$("txForm").onsubmit=function(e){
 e.preventDefault();
 const o={id:$("txId").value||id(),type:$("txType").value,status:$("txStatus").value,desc:$("txDesc").value.trim(),amount:Number($("txAmount").value),date:$("txDate").value,folder:$("txFolder").value,account:$("txAccount").value,person:$("txPerson").value.trim(),notes:$("txNotes").value.trim()};
 const ix=db.transactions.findIndex(x=>x.id===o.id);if(ix>=0)db.transactions[ix]=o;else db.transactions.push(o);save();closeModal("txModal");renderAll();
};
$("folderForm").onsubmit=function(e){
 e.preventDefault();const o={id:$("folderId").value||id(),name:$("folderName").value.trim(),desc:$("folderDesc").value.trim(),type:$("folderType").value};
 const ix=db.folders.findIndex(x=>x.id===o.id);if(ix>=0)db.folders[ix]=o;else db.folders.push(o);save();closeModal("folderModal");renderAll();
};
$("serviceForm").onsubmit=function(e){
 e.preventDefault();const old=db.services.find(x=>x.id===$("serviceId").value);
 const o={id:$("serviceId").value||id(),client:$("serviceClient").value.trim(),name:$("serviceName").value.trim(),start:$("serviceStart").value,end:$("serviceEnd").value,total:Number($("serviceTotal").value),folder:$("serviceFolder").value,billing:$("serviceBilling").value,n:Number($("serviceN").value)||0,v:Number($("serviceV").value)||0,freq:$("serviceFreq").value,day:Number($("serviceDay").value)||0,expected:Number($("serviceExpected").value)||0,notes:$("serviceNotes").value.trim(),payments:old?old.payments||[]:[]};
 const ix=db.services.findIndex(x=>x.id===o.id);if(ix>=0)db.services[ix]=o;else db.services.push(o);save();closeModal("serviceModal");renderAll();
};
$("paymentForm").onsubmit=function(e){
 e.preventDefault();const s=db.services.find(x=>x.id===$("paymentServiceId").value),v=Number($("paymentAmount").value);if(!s||v<=0)return;
 s.payments=s.payments||[];s.payments.push({id:id(),date:$("paymentDate").value,amount:v,method:$("paymentMethod").value,note:$("paymentNote").value.trim()});
 save();closeModal("paymentModal");renderAll();
};

renderAll();
})();
</script>
</body>
