.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.statrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;background:#eef2f7}.badge.green{background:#dcfce7}.badge.red{background:#fee2e2}.badge.amber{background:#fef3c7}.badge.blue{background:#dbeafe}.badge.purple{background:#ede9fe}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.table tr:hover td{background:#fafcff}

.alert{padding:13px 15px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:12px}.alert.error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}.alert.success{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.empty{text-align:center;padding:45px;color:var(--muted)}.search{display:flex;gap:8px}.search input{min-width:240px}
#authModal{z-index:200}.authbox{width:min(470px,100%);padding:28px}.authlogo{width:48px;height:48px;border-radius:14px;background:#1d4ed8;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:16px}.authbox h2{margin:0 0 7px}.authbox p{color:#64748b;font-size:13px;line-height:1.55}.authnote{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:14px 0;font-size:12px;color:#475569}.authbox .btn{height:42px}.modal{position:fixed;inset:0;background:rgba(6,15,31,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0}.close{border:0;background:#f1f5f9;border-radius:9px;width:36px;height:36px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#475569}.field input,.field select,.field textarea{border:1px solid #d8e0eb;border-radius:10px;padding:10px 11px;outline:none;background:#fff}.field textarea{min-height:80px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #dbeafe}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.tab.active{background:#e8f0ff;border-color:#bfd3ff;color:#1d4ed8}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.top{padding:0 16px}.content{padding:18px}.g4,.g3,.g2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search input{min-width:0;width:100%}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">F</div><div><b>FinControl</b><small>PRO FINANCE</small></div></div>
  <div class="navgroup">
    <div class="navlabel">Principal</div>
    <button class="navbtn active" data-view="overview"><span>⌂</span>Overview</button>
    <button class="navbtn" data-view="transactions"><span>↔</span>Movimentações</button>
    <button class="navbtn" data-view="receivable"><span>↓</span>A receber</button>
    <button class="navbtn" data-view="payable"><span>↑</span>A pagar</button>
  </div>
  <div class="navgroup">
    <div class="navlabel">Organização</div>
    <button class="navbtn" data-view="folders"><span>▣</span>Categorias / Pastas</button>
    <button class="navbtn" data-view="services"><span>◆</span>Serviços</button>
    <button class="navbtn" data-view="people"><span>♙</span>Clientes / Fornecedores</button>
    <button class="navbtn" data-view="recurring"><span>⟳</span>Recorrências</button>
  </div>
  <div class="navgroup">
    <div class="navlabel">Contas</div>
    <button class="navbtn" data-view="accounts"><span>▤</span>Caixas & Contas</button>
    <button class="navbtn" data-view="cards"><span>▱</span>Cartões</button>
    <button class="navbtn" data-view="transfers"><span>⇄</span>Transferências</button>
  </div>
  <div class="navgroup">
    <div class="navlabel">Planejamento</div>
    <button class="navbtn" data-view="calendar"><span>▦</span>Calendário</button>
    <button class="navbtn" data-view="goals"><span>◎</span>Metas</button>
    <button class="navbtn" data-view="budgets"><span>◫</span>Orçamentos</button>
    <button class="navbtn" data-view="reports"><span>▥</span>Relatórios</button>
  </div>
  <div class="navgroup">
    <div class="navlabel">Sistema</div>
    <button class="navbtn" data-view="settings"><span>⚙</span>Configurações</button>
  </div>
</aside>

<main class="main">
<header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile" id="menuBtn">☰</button><div><h1 id="pageTitle">Overview</h1><small id="pageSub">Sua visão financeira</small></div></div><div class="actions"><span class="badge blue" id="sessionBadge">Conectando…</span><button class="btn primary" data-action="new-tx">+ Novo lançamento</button></div></header>
<div class="content" id="content"><div class="card"><div class="empty">Carregando FinControl…</div></div></div>
</main>
</div>

<div class="modal" id="authModal"><div class="modalbox authbox" id="authBox"></div></div>
<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://rvgcniaowzmsudzliozf.supabase.co";
const SUPABASE_KEY="sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,currentView="overview",data={transactions:[],folders:[],services:[],payments:[],installments:[],people:[],accounts:[],cards:[],goals:[],budgets:[],recurring:[],transfers:[]};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const num=v=>{
 if(typeof v==="number") return Number.isFinite(v)?v:0;
 let s=String(v??"").trim().replace(/[^0-9,.-]/g,"");
 if(!s)return 0;
 const commas=(s.match(/,/g)||[]).length, dots=(s.match(/\./g)||[]).length;
 if(commas&&dots){
   const lastComma=s.lastIndexOf(","), lastDot=s.lastIndexOf(".");
   if(lastComma>lastDot) s=s.replace(/\./g,"").replace(",",".");
   else s=s.replace(/,/g,"");
 }else if(commas){
   s=s.replace(/\./g,"").replace(",",".");
 }else if(dots>1){
   // Aceita também 150.000.00: último ponto é decimal.
   const last=s.lastIndexOf(".");
   s=s.slice(0,last).replace(/\./g,"")+"."+s.slice(last+1);
 }
 return Number(s)||0;
};
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
const dateBR=d=>d?new Date(d+"T00:00:00").toLocaleDateString("pt-BR"):"—";
const today=()=>new Date().toISOString().slice(0,10);
const sum=(arr,fn=x=>x)=>arr.reduce((a,x)=>a+num(fn(x)),0);
const labelType=t=>t==="income"?"Entrada":"Saída";
const statusLabel=s=>({paid:"Pago",pending:"Pendente",cancelled:"Cancelado",overdue:"Vencido"})[s]||s||"—";
const statusBadge=s=>{let c=s==="paid"?"green":s==="pending"||s==="overdue"?"amber":s==="cancelled"?"red":"blue";return `<span class="badge ${c}">${esc(statusLabel(s))}</span>`};
const APPROVAL_MARK='[[approval:';
function approvalOf(x){
  const n=String(x?.notes||'');
  const m=n.match(/\[\[approval:(pending|approved|rejected|cancelled)(?::([^\]]*))?\]\]/i);
  return (m?.[1]||'approved').toLowerCase();
}
function approvalLabel(s){return ({pending:'Aguardando aprovação',approved:'Aprovado pelo admin',rejected:'Rejeitado',cancelled:'Cancelado'}[s]||'Aprovado pelo admin')}
function approvalBadge(s){const c=s==='pending'?'approval-pending':s==='rejected'?'approval-rejected':'approval-approved';return `<span class="badge ${c}">${esc(approvalLabel(s))}</span>`}
function stripApproval(n){return String(n||'').replace(/\[\[approval:(pending|approved|rejected|cancelled)(?::[^\]]*)?\]\]\s*/ig,'').trim()}
function withApproval(note,status){return `[[approval:${status}]]${note?` ${note}`:''}`}
function isApproved(x){return approvalOf(x)==='approved'}

function toast(msg,error=false){$("toast").innerHTML=`<div class="alert ${error?"error":"success"}">${esc(msg)}</div>`;setTimeout(()=>{$("toast").innerHTML=""},4000)}
function formatMoneyInputValue(v){
 const raw=String(v??"").trim();
 if(!raw)return "";
 const n=num(raw);
 return Number.isFinite(n)?n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";
}
function installMoneyInputs(){
 document.querySelectorAll("#modalBox input[data-money]").forEach(el=>{
   if(el.dataset.moneyReady==="1")return;
   el.dataset.moneyReady="1";
   el.inputMode="decimal";
   el.placeholder="0,00";
   const normalize=()=>{if(el.value.trim())el.value=formatMoneyInputValue(el.value)};
   el.addEventListener("blur",normalize);
   el.addEventListener("change",normalize);
 });
}
function openModal(html){$("modalBox").innerHTML=html;$("modal").classList.add("open");installMoneyInputs()}
function closeModal(){$("modal").classList.remove("open")}
function kpi(title,value,cls="blue",sub=""){
 const countKpi=/^(lançamentos|quantidade|vencidos|parcelas|contatos|aguardando aprovação)$/i.test(String(title).trim());
 const shown=countKpi && typeof value==="number" ? Number(value).toLocaleString("pt-BR") : (typeof value==="number" ? money(value) : value);
 return `<div class="card kpi"><small>${esc(title)}</small><strong class="${cls}">${shown}</strong>${sub?`<div class="muted" style="font-size:11px;margin-top:5px">${esc(sub)}</div>`:""}</div>`;
}
function activeRows(a){return (a||[]).filter(x=>!x.deleted_at)}

async function ensureSession(){
  let {data:s,error}=await sb.auth.getSession();
  if(error)throw error;
  if(!s.session){
    await showLoginModal(true);
    const after=await sb.auth.getSession();
    if(!after.data.session)throw new Error("É necessário entrar na conta para acessar seus dados.");
    s=after.data;
  }
  user=s.session.user;
  updateSessionUI();
}

function updateSessionUI(){
  const anonymous=!!user?.is_anonymous;
  $("sessionBadge").textContent=anonymous?"Acesso temporário":"Conta protegida";
  $("sessionBadge").className=anonymous?"badge amber":"badge green";
}

function closeAuthModal(){
  $("authModal").classList.remove("open");
  $("authBox").innerHTML="";
}

function authErrorMessage(msg){
  const m=String(msg||"");
  if(/manual linking|identity.*link|linking/i.test(m)) return "A vinculação manual de identidades ainda não está habilitada no Supabase. Ative essa opção em Authentication → Settings → User Signups/Identity Linking e tente novamente.";
  if(/already registered|already exists|duplicate|unique/i.test(m)) return "Este e-mail já está associado a outra conta. Use outro e-mail ou entre com a conta existente.";
  if(/invalid.*email/i.test(m)) return "Digite um e-mail válido.";
  if(/password/i.test(m)&&/short|characters|length|weak/i.test(m)) return "A senha precisa atender aos requisitos de segurança configurados no Supabase.";
  return m;
}

function showLoginModal(firstLoad=false){
  return new Promise(resolve=>{
    $("authBox").innerHTML=`
      <div class="authlogo">F</div>
      <h2>Acessar o FinControl</h2>
      <p>Entre com seu e-mail e senha para acessar os mesmos dados em computador e celular.</p>
      <div class="authnote"><b>Importante:</b> não criaremos outra conta automaticamente. Isso evita que o celular fique com dados zerados.</div>
      <form id="loginForm">
        <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="voce@email.com"></div>
        <div class="field" style="margin-top:12px"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Sua senha"></div>
        <div id="loginMsg" style="margin-top:12px"></div>
        <div class="modalfoot"><button type="submit" class="btn primary">Entrar</button></div>
      </form>`;
    $("authModal").classList.add("open");
    $("loginForm").onsubmit=async e=>{
      e.preventDefault();
      const msg=$("loginMsg"); msg.innerHTML="";
      const email=$("loginEmail").value.trim(),password=$("loginPassword").value;
      const r=await sb.auth.signInWithPassword({email,password});
      if(r.error){msg.innerHTML=`<div class="alert error">${esc(authErrorMessage(r.error.message))}</div>`;return}
      user=r.data.user; updateSessionUI(); closeAuthModal(); resolve(true);
    };
  });
}

function showProtectAnonymousModal(){
  return new Promise(resolve=>{
    $("authBox").innerHTML=`
      <div class="authlogo">F</div>
      <h2>Proteja seus dados financeiros</h2>
      <p>Este navegador está usando um acesso temporário. Seus lançamentos atuais estão vinculados a ele. Vamos transformar <b>esta mesma conta</b> em uma conta permanente para que os dados também apareçam no celular.</p>
      <div class="authnote"><b>Seus dados não serão recriados.</b> O mesmo usuário do Supabase será mantido, portanto os registros existentes continuam vinculados à conta.</div>
      <form id="protectForm">
        <div class="field"><label>E-mail da conta</label><input id="protectEmail" type="email" autocomplete="email" required placeholder="voce@email.com"></div>
        <div class="field" style="margin-top:12px"><label>Crie uma senha</label><input id="protectPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Mínimo conforme a configuração do projeto"></div>
        <div class="field" style="margin-top:12px"><label>Confirme a senha</label><input id="protectPassword2" type="password" autocomplete="new-password" required placeholder="Repita a senha"></div>
        <div id="protectMsg" style="margin-top:12px"></div>
        <div class="modalfoot"><button type="submit" class="btn primary">Proteger minha conta</button></div>
      </form>`;
    $("authModal").classList.add("open");
    $("protectForm").onsubmit=async e=>{
      e.preventDefault();
      const msg=$("protectMsg");msg.innerHTML="";
      const email=$("protectEmail").value.trim(),password=$("protectPassword").value,password2=$("protectPassword2").value;
      if(password!==password2){msg.innerHTML='<div class="alert error">As senhas não coincidem.</div>';return}
      const btn=e.submitter; if(btn)btn.disabled=true;
      try{
        // Converte a conta anônima mantendo o MESMO user.id.
        // Fazemos em duas etapas para evitar que a atualização de e-mail/senha falhe em conjunto.
        const er=await sb.auth.updateUser({email});
        if(er.error)throw er.error;
        const pr=await sb.auth.updateUser({password});
        if(pr.error)throw pr.error;
        user=pr.data.user||er.data.user||user;
        updateSessionUI();
        closeAuthModal();
        toast("Conta protegida. Seus dados continuam vinculados à mesma conta.");
        setTimeout(()=>toast("Se a confirmação de e-mail estiver ativa, confirme o e-mail antes de entrar no celular."),900);
        resolve(true);
      }catch(err){
        msg.innerHTML=`<div class="alert error">${esc(authErrorMessage(err.message))}</div>`;
        if(btn)btn.disabled=false;
      }
    };
  });
}

async function loadTable(table,select="*"){
  const r=await sb.from(table).select(select).is("deleted_at",null);
  if(r.error){console.warn(table,r.error);return []}
  return r.data||[];
}
async function load(){
  const names=["transactions","folders","services","payments","installments","people","accounts","cards","goals","budgets","recurring","transfers"];

 const calcFirstDue=(startValue,day,freq)=>{
   const start=new Date(startValue+"T00:00:00");
   if(!day) return new Date(start);
   let d=new Date(start);
   d.setDate(1);
   d.setDate(Math.min(Number(day),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
   if(d<start){
     if(freq==="weekly") d.setDate(d.getDate()+7);
     else if(freq==="yearly") d.setFullYear(d.getFullYear()+1);
     else d.setMonth(d.getMonth()+1);
   }
   return d;
 };
 const dateForInstallment=(startValue,index,day,freq)=>{
   const first=calcFirstDue(startValue,day,freq);
   let d=new Date(first);
   if(index>1){
     if(freq==="weekly") d.setDate(d.getDate()+7*(index-1));
     else if(freq==="yearly") d.setFullYear(d.getFullYear()+(index-1));
     else d.setMonth(d.getMonth()+(index-1));
   }
   if(day && freq!=="weekly"){
     d.setDate(Math.min(Number(day),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
   }
   return d.toISOString().slice(0,10);
 };
 const calcService=()=>{

   if((billing==="installments"||billing==="fixed")&&total>0&&n>0){
     $("ss_v").value=(total/n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
   }
   if(startVal&&n>0&&(billing==="installments"||billing==="fixed")){
     const first=dateForInstallment(startVal,1,day,freq);
     const last=dateForInstallment(startVal,n,day,freq);
     $("ss_end").value=last;
     $("ss_preview").innerHTML=`<b>Calendário automático:</b> 1ª parcela <b>${dateBR(first)}</b> • última parcela <b>${dateBR(last)}</b> • ${n} parcela(s) de <b>${money(total/n)}</b>.`;
   }else if($("ss_preview")){
     $("ss_preview").innerHTML="Informe total, número de parcelas e data inicial para visualizar o calendário.";
   }
 };
 ["ss_total","ss_n","ss_start","ss_day"].forEach(id=>$(id).addEventListener("input",calcService));
 ["ss_billing","ss_start","ss_freq"].forEach(id=>$(id).addEventListener("change",calcService));
 calcService();

 $("serviceForm").onsubmit=async e=>{
   e.preventDefault();
   const billing=({single:"single",installments:"installments",fixed:"fixed",recurring:"fixed",recorrente:"fixed"}[$("ss_billing").value]||"single");
   const total=num($("ss_total").value), n=$("ss_n").value?Number($("ss_n").value):null;
   const installmentAmount=(billing!=="single"&&n&&total)?total/n:($("ss_v").value?num($("ss_v").value):null);
   const o={user_id:user.id,client_id:$("ss_client").value||null,folder_id:$("ss_folder").value||null,name:$("ss_name").value.trim(),description:$("ss_desc").value.trim()||null,start_date:$("ss_start").value,end_date:$("ss_end").value,total_amount:total,billing_type:billing,installment_count:n,installment_amount:installmentAmount,frequency:$("ss_freq").value,fixed_day:$("ss_day").value?Number($("ss_day").value):null,status:x?.status||"active",notes:$("ss_notes").value.trim()||null};
   if(total<=0){toast("Informe um total contratado válido.",true);return}
   if(billing!=="single"&&(!n||n<1)){toast("Informe o número de parcelas.",true);return}
   const editing=Boolean($("ss_id").value);
   const serviceId=$("ss_id").value;
   const q=editing?await sb.from("fin_services").update(o).eq("id",serviceId).eq("user_id",user.id):await sb.from("fin_services").insert(o).select("id").single();
   if(q.error){toast(q.error.message,true);return}
   const savedId=editing?serviceId:q.data.id;

   // Ao editar: recalcula as datas das parcelas existentes, mantendo pagamentos/status.
   if(editing && billing!=="single" && n){
     const existing=installmentRowsFor(savedId);
     if(existing.length){
       const limit=Math.min(existing.length,n);
       for(let idx=0;idx<limit;idx++){
         const inst=existing[idx];
         const due=dateForInstallment(o.start_date,idx+1,o.fixed_day,o.frequency);
         const amount=installmentAmount!==null?installmentAmount:num(inst.amount);
         const r=await sb.from("fin_service_installments").update({due_date:due,amount}).eq("id",inst.id).eq("user_id",user.id);
         if(r.error){toast("Serviço salvo, mas houve erro ao atualizar as parcelas: "+r.error.message,true);return}
       }
       // Se aumentou o número de parcelas, cria somente as novas.
       if(n>existing.length){
         const rows=[];
         for(let idx=existing.length+1;idx<=n;idx++){
           rows.push({user_id:user.id,service_id:savedId,installment_number:idx,due_date:dateForInstallment(o.start_date,idx,o.fixed_day,o.frequency),amount:installmentAmount,paid_amount:0,status:"pending"});
         }
         if(rows.length){
           const rr=await sb.from("fin_service_installments").insert(rows);
           if(rr.error){toast("Serviço salvo, mas não foi possível criar as novas parcelas: "+rr.error.message,true);return}
         }
       }
       // Se reduziu o número, só exclui as últimas parcelas que ainda não receberam pagamento.
       if(n<existing.length){
         const extras=existing.filter(i=>Number(i.installment_number)>n);
         for(const inst of extras){
           if(num(inst.paid_amount)>0){
             toast("Serviço salvo. Parcelas já pagas além do novo limite foram preservadas.",false);
             continue;
           }
           const rr=await sb.from("fin_service_installments").update({deleted_at:new Date().toISOString()}).eq("id",inst.id).eq("user_id",user.id);
           if(rr.error){toast("Serviço salvo, mas não foi possível remover uma parcela excedente: "+rr.error.message,true);return}
         }
       }
     }else{
       await generateInstallments(savedId,o);
     }
   }
   if(!editing&&billing!=="single"&&n&&installmentAmount)await generateInstallments(savedId,o);
   closeModal();await load();toast("Serviço salvo e calendário das parcelas atualizado automaticamente.");
 };
}
async function generateInstallments(serviceId,o){
 const n=Number(o.installment_count),v=num(o.installment_amount),rows=[];
 if(!n||v<=0)return;
 for(let i=1;i<=n;i++){
   const due=(()=>{ 
     const start=new Date(o.start_date+"T00:00:00"), day=Number(o.fixed_day||0), freq=o.frequency||"monthly";
     let first=new Date(start);
     if(day>=1){
       first.setDate(1);
       first.setDate(Math.min(day,new Date(first.getFullYear(),first.getMonth()+1,0).getDate()));
       if(first<start){
         if(freq==="weekly")first.setDate(first.getDate()+7);
         else if(freq==="yearly")first.setFullYear(first.getFullYear()+1);
         else first.setMonth(first.getMonth()+1);
       }
     }
     let d=new Date(first);
     if(i>1){
       if(freq==="weekly")d.setDate(d.getDate()+7*(i-1));
       else if(freq==="yearly")d.setFullYear(d.getFullYear()+(i-1));
       else d.setMonth(d.getMonth()+(i-1));
     }
     if(day>=1&&freq!=="weekly")d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));
     return d.toISOString().slice(0,10);
   })();
   rows.push({user_id:user.id,service_id:serviceId,installment_number:i,due_date:due,amount:v,paid_amount:0,status:"pending"});
 }
 const r=await sb.from("fin_service_installments").insert(rows);
 if(r.error)console.warn(r.error);
}

function installmentRowsFor(serviceId){
 return activeRows(data.installments).filter(x=>x.service_id===serviceId).sort((a,b)=>Number(a.installment_number)-Number(b.installment_number));
}
function paymentsFor(serviceId){
 return activeRows(data.payments).filter(x=>x.service_id===serviceId).sort((a,b)=>String(b.payment_date).localeCompare(String(a.payment_date)));
}
function installmentStatus(inst,payments=[]){
 const amount=num(inst?.amount);
 const paid=num(inst?.paid_amount);
 const due=inst?.due_date?new Date(inst.due_date+"T23:59:59"):null;
 if(amount>0 && paid>=amount-0.005) return "paid";
 if(paid>0) return "partial";
 const todayDate=new Date(); todayDate.setHours(23,59,59,999);
 if(due && due<todayDate) return "overdue";
 return "pending";
}
function installmentStatusLabel(status){
 return ({paid:"Pago",partial:"Parcial",overdue:"Vencido",pending:"A pagar"}[status]||"A pagar");
}

 const r=await sb.from("fin_service_installments").update(patch).eq("id",installmentId).eq("user_id",user.id);

function transferModal(){
 openModal(`<div class="modalhead"><h3>Nova transferência</h3><button class="close" data-close>×</button></div><form id="trForm"><div class="formgrid"><div class="field"><label>Conta origem *</label><select id="tr_from" required>${options(data.accounts)}</select></div><div class="field"><label>Conta destino *</label><select id="tr_to" required>${options(data.accounts)}</select></div><div class="field"><label>Valor *</label><input id="tr_amount" data-money inputmode="decimal" required></div><div class="field"><label>Data *</label><input id="tr_date" type="date" required value="${today()}"></div><div class="field full"><label>Descrição</label><input id="tr_desc"></div><div class="field full"><label>Observações</label><textarea id="tr_notes"></textarea></div></div><div class="modalfoot"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary">Salvar</button></div></form>`);
 $("trForm").onsubmit=async e=>{e.preventDefault();if($("tr_from").value===$("tr_to").value){toast("Escolha contas diferentes.",true);return}const o={user_id:user.id,from_account_id:$("tr_from").value,to_account_id:$("tr_to").value,amount:num($("tr_amount").value),transfer_date:$("tr_date").value,description:$("tr_desc").value.trim()||null,notes:$("tr_notes").value.trim()||null};const r=await sb.from("fin_transfers").insert(o);if(r.error){toast(r.error.message,true);return}closeModal();await load();toast("Transferência salva.")};
}
async function softDelete(table,id){const r=await sb.from(table).update({deleted_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(r.error){toast(r.error.message,true);return false}await load();return true}
async function duplicateTx(id){const x=data.transactions.find(a=>a.id===id);if(!x)return;const o={user_id:user.id,type:x.type,status:"pending",description:x.description+" (cópia)",amount:x.amount,transaction_date:today(),due_date:x.due_date,folder_id:x.folder_id,account_id:x.account_id,person_id:x.person_id,service_id:x.service_id,card_id:x.card_id,payment_method:x.payment_method,reference:x.reference,notes:x.notes,is_recurring:false};const r=await sb.from("fin_transactions").insert(o);if(r.error){toast(r.error.message,true);return}await load();toast("Lançamento duplicado.")}
function exportCSV(){const rows=activeRows(data.transactions),head=["data","descricao","tipo","status","valor","categoria","conta","contato","observacoes"],lines=[head.join(";")];rows.forEach(x=>lines.push([x.transaction_date,x.description,labelType(x.type),statusLabel(x.status),String(x.amount).replace(".",","),folderName(x.folder_id),accountName(x.account_id),personName(x.person_id),x.notes||""].map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")));const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fincontrol-lancamentos.csv";a.click();URL.revokeObjectURL(a.href)}
function backup(){const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),user_id:user.id,data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fincontrol-backup.json";a.click();URL.revokeObjectURL(a.href)}

document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.close!==undefined){closeModal();return}
 if(b.dataset.view){setView(b.dataset.view);return}
 if(b.dataset.viewJump){setView(b.dataset.viewJump);return}
 if(b.dataset.txFilter){document.querySelectorAll("[data-tx-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderTxList(b.dataset.txFilter);return}
 const a=b.dataset.action,id=b.dataset.id;
 try{
  if(a==="new-tx")txModal("",b.dataset.type||"income");
  else if(a==="edit-tx")txModal(id);
  else if(a==="duplicate-tx")duplicateTx(id);
  else if(a==="delete-tx"){if(confirm("Excluir este lançamento?"))softDelete("fin_transactions",id)}
  else if(a==="new-folder")folderModal();
  else if(a==="edit-folder")folderModal(id);
  else if(a==="delete-folder"){if(confirm("Excluir esta pasta?"))softDelete("fin_folders",id)}
  else if(a==="open-folder")renderFolderDetail(id);
  else if(a==="new-service")serviceModal();
  else if(a==="edit-service")serviceModal(id);
  else if(a==="delete-service"){if(confirm("Excluir este serviço?"))softDelete("fin_services",id)}
  else if(a==="payment")paymentModal(id);
  else if(a==="view-installments")viewInstallments(id);
  else if(a==="recalc-service"){
    const ev=new Event("input");
    ["ss_total","ss_n","ss_start","ss_day"].forEach(k=>$(k)?.dispatchEvent(ev));
    ["ss_billing","ss_start","ss_freq"].forEach(k=>$(k)?.dispatchEvent(new Event("change")));
    toast("Calendário recalculado. Confira as datas antes de salvar.");
  }
  else if(a==="payment-installment")paymentModal(b.dataset.service,id);
  else if(a==="edit-installment")installmentModal(id);
  else if(a==="delete-installment"){if(confirm("Excluir esta parcela?")){const r=await sb.from("fin_service_installments").update({deleted_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(r.error)toast(r.error.message,true);else{await load();toast("Parcela excluída.")}}}
  else if(a==="edit-payment")paymentEditModal(id);
  else if(a==="delete-payment"){const p=data.payments.find(x=>x.id===id);if(confirm("Excluir este pagamento?")){const r=await sb.from("fin_service_payments").update({deleted_at:new Date().toISOString()}).eq("id",id).eq("user_id",user.id);if(r.error)toast(r.error.message,true);else{if(p?.installment_id)await refreshInstallment(p.installment_id);await load();toast("Pagamento excluído.")}}}
  else if(a==="new-person")personModal();
  else if(a==="delete-person"){if(confirm("Excluir este contato?"))softDelete("fin_people",id)}
  else if(a==="new-account")accountModal();
  else if(a==="delete-account"){if(confirm("Excluir esta conta?"))softDelete("fin_accounts",id)}
  else if(a==="new-card")cardModal();
  else if(a==="delete-card"){if(confirm("Excluir este cartão?"))softDelete("fin_cards",id)}
  else if(a==="new-goal")goalModal();
  else if(a==="delete-goal"){if(confirm("Excluir esta meta?"))softDelete("fin_goals",id)}
  else if(a==="goal-add"){const g=data.goals.find(x=>x.id===id),v=prompt("Quanto deseja adicionar?", "0");if(v!==null){const r=await sb.from("fin_goals").update({current_amount:num(g.current_amount)+num(v)}).eq("id",id).eq("user_id",user.id);if(r.error)toast(r.error.message,true);else{await load();toast("Meta atualizada.")}}}
  else if(a==="new-budget")budgetModal();
  else if(a==="delete-budget"){if(confirm("Excluir orçamento?"))softDelete("fin_budgets",id)}
  else if(a==="new-recurring")recurringModal();
  else if(a==="edit-recurring")recurringModal(id);
  else if(a==="delete-recurring"){if(confirm("Excluir recorrência?"))softDelete("fin_recurring",id)}
  else if(a==="new-transfer")transferModal();
  else if(a==="delete-transfer"){if(confirm("Excluir transferência?"))softDelete("fin_transfers",id)}
  else if(a==="csv")exportCSV();
  else if(a==="backup")backup();
 }catch(err){console.error(err);toast(err.message||"Erro inesperado.",true)}
});
document.addEventListener("input",e=>{if(e.target.id==="txSearch")renderTxList("all")});
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
(async()=>{try{await ensureSession();await load();await protectIfAnonymous();}catch(e){console.error(e);$("sessionBadge").textContent="Erro";$("sessionBadge").className="badge red";$("content").innerHTML=`<div class="alert error"><b>Não foi possível abrir o FinControl:</b> ${esc(e.message)}<br><br>Se este for um novo dispositivo, entre com o e-mail e senha da sua conta. Não crie um novo acesso temporário, pois ele começará vazio.</div>`}})();
</script>
</body>
</html>
