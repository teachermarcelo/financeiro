<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FinControl Pro</title>
<style>
:root{
 --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e4eaf2;
 --nav:#0b1220;--nav2:#172338;--blue:#2563eb;--green:#059669;--red:#dc2626;
 --amber:#d97706;--purple:#7c3aed;--shadow:0 7px 25px rgba(15,23,42,.06)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{display:flex;min-height:100vh}.sidebar{width:258px;position:fixed;left:0;top:0;bottom:0;background:var(--nav);padding:17px 13px;color:#cbd5e1;z-index:50;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 24px}.logo{width:43px;height:43px;background:#2563eb;color:#fff;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{color:#fff;font-size:18px}.brand small{display:block;font-size:9px;letter-spacing:1.4px;margin-top:2px}
.navtitle{font-size:9px;text-transform:uppercase;color:#64748b;margin:14px 10px 5px}.nav{width:100%;border:0;background:transparent;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:var(--nav2);color:#fff}
.main{margin-left:258px;flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:40}.top h1{font-size:20px;margin:0}.top p{font-size:12px;color:var(--muted);margin:3px 0}.topright{display:flex;gap:8px;align-items:center}.content{max-width:1500px;margin:auto;padding:27px}.page{display:none}.page.active{display:block}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow)}
.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:25px;font-weight:850;margin-top:7px;letter-spacing:-.4px}
.green{color:var(--green)!important}.red{color:var(--red)!important}.amber{color:var(--amber)!important}.blue{color:var(--blue)!important}.purple{color:var(--purple)!important}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.toolbar h2{font-size:23px;margin:0}.toolbar p{font-size:13px;color:var(--muted);margin:4px 0}.buttons{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 13px;background:#edf2f7;color:#334155;font-weight:750}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.green{background:#dcfce7;color:#047857}.btn.small{padding:7px 9px;font-size:11px}
.input{width:100%;border:1px solid #d7e0ea;background:#fff;border-radius:10px;padding:10px 11px;color:var(--text);outline:0}.input:focus{border-color:#7b9bff;box-shadow:0 0 0 3px #dbe5ff}
.filters{display:flex;gap:9px;flex-wrap:wrap}.filters .input{width:auto;min-width:145px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{padding:11px;background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;text-align:left;white-space:nowrap}.table td{padding:12px 11px;border-top:1px solid #edf1f5;font-size:13px;white-space:nowrap}.table .actions{white-space:nowrap}
.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800}.paid{background:#dcfce7;color:#047857}.pending{background:#fef3c7;color:#a16207}.overdue{background:#fee2e2;color:#b91c1c}.partial{background:#dbeafe;color:#1d4ed8}.cancelled{background:#e5e7eb;color:#4b5563}
.foldergrid,.servicegrid,.peoplegrid,.accountgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.iconbox{width:44px;height:44px;border-radius:12px;background:#eff6ff;color:#2563eb;display:grid;place-items:center;font-size:19px}.progress{height:8px;background:#e9eef5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;border-radius:20px;background:var(--green)}
.service-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.service-meta small{font-size:10px;color:var(--muted)}.service-meta b{display:block;font-size:14px;margin-top:3px}.empty{text-align:center;color:#94a3b8;padding:42px 15px}
.modal{position:fixed;inset:0;background:rgba(2,8,23,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;width:min(720px,100%);max-height:94vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line)}.modalbody{padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{font-size:12px;font-weight:750;display:block;margin-bottom:5px}.field{margin-bottom:2px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.alert{padding:11px 13px;border-radius:11px;font-size:12px;background:#eff6ff;color:#1d4ed8;margin-bottom:14px}.alert.error{background:#fee2e2;color:#991b1b}
.chart{height:220px;display:flex;align-items:end;gap:10px;padding:15px 5px 0}.barcol{flex:1;height:100%;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:5px}.bars{height:100%;display:flex;align-items:end;gap:3px}.bar{width:18px;min-height:2px;border-radius:5px 5px 0 0}.bar.in{background:#059669}.bar.out{background:#dc2626}.barcol small{font-size:9px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}.day b{font-size:11px}.event{font-size:9px;margin-top:5px;padding:4px;border-radius:5px;overflow:hidden}.event.in{background:#dcfce7;color:#047857}.event.out{background:#fee2e2;color:#b91c1c}
.mobile{display:none}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.foldergrid,.servicegrid,.peoplegrid,.accountgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.top{padding:0 14px}.topright .period{display:none}.content{padding:17px}.g4,.g3,.g2,.foldergrid,.servicegrid,.peoplegrid,.accountgrid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.calendar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">F</div><div><b>FinControl</b><small>PRO FINANCE</small></div></div>
 <div class="navtitle">Principal</div>
 <button class="nav active" data-page="overview">⌂ &nbsp; Overview</button>
 <button class="nav" data-page="transactions">↔ &nbsp; Movimentações</button>
 <button class="nav" data-page="receivables">↓ &nbsp; A receber</button>
 <button class="nav" data-page="payables">↑ &nbsp; A pagar</button>
 <div class="navtitle">Organização</div>
 <button class="nav" data-page="folders">▣ &nbsp; Categorias / Pastas</button>
 <button class="nav" data-page="services">◆ &nbsp; Serviços</button>
 <button class="nav" data-page="people">♙ &nbsp; Clientes / Fornecedores</button>
 <div class="navtitle">Contas</div>
 <button class="nav" data-page="accounts">▤ &nbsp; Caixas & Contas</button>
 <button class="nav" data-page="cards">▱ &nbsp; Cartões</button>
 <div class="navtitle">Planejamento</div>
 <button class="nav" data-page="calendar">□ &nbsp; Calendário</button>
 <button class="nav" data-page="goals">◎ &nbsp; Metas</button>
 <button class="nav" data-page="reports">▥ &nbsp; Relatórios</button>
 <button class="nav" data-page="settings">⚙ &nbsp; Configurações</button>
</aside>

<main class="main">
<header class="top">
 <div style="display:flex;gap:10px;align-items:center"><button id="menu" class="btn mobile">☰</button><div><h1 id="title">Overview</h1><p id="subtitle">Sua visão financeira</p></div></div>
 <div class="topright"><select id="period" class="input period" style="width:auto"><option value="month">Este mês</option><option value="year">Este ano</option><option value="all">Todos</option></select><button id="quick" class="btn primary">+ Novo lançamento</button></div>
</header>
<div class="content">
<section id="overview" class="page active"></section><section id="transactions" class="page"></section><section id="receivables" class="page"></section><section id="payables" class="page"></section><section id="folders" class="page"></section><section id="services" class="page"></section><section id="people" class="page"></section><section id="accounts" class="page"></section><section id="cards" class="page"></section><section id="calendar" class="page"></section><section id="goals" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section>
</div></main></div>

<div class="modal" id="txModal"><div class="modalbox"><div class="modalhead"><div><b id="txTitle">Novo lançamento</b><div style="font-size:11px;color:#718096">Entrada ou saída</div></div><button class="btn" data-close="txModal">✕</button></div>
<form id="txForm" class="modalbody"><input id="txId" type="hidden"><div class="formgrid">
<div class="field"><label>Tipo</label><select id="txType" class="input"><option value="income">Entrada</option><option value="expense">Saída</option></select></div>
<div class="field"><label>Status</label><select id="txStatus" class="input"><option value="paid">Pago / Recebido</option><option value="pending">Pendente</option><option value="overdue">Vencido</option><option value="partial">Parcial</option><option value="cancelled">Cancelado</option></select></div>
<div class="field full"><label>Descrição *</label><input id="txDesc" class="input" required></div>
<div class="field"><label>Valor *</label><input id="txAmount" class="input" type="number" min="0" step="0.01" required></div>
<div class="field"><label>Data *</label><input id="txDate" class="input" type="date" required></div>
<div class="field"><label>Categoria / Pasta</label><select id="txFolder" class="input"></select></div>
<div class="field"><label>Conta / Caixa</label><select id="txAccount" class="input"></select></div>
<div class="field full"><label>Cliente / Fornecedor</label><input id="txPerson" class="input"></div>
<div class="field full"><label>Observações</label><textarea id="txNotes" class="input" rows="3"></textarea></div>
</div><div class="modalfoot"><button type="button" class="btn" data-close="txModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="folderModal"><div class="modalbox"><div class="modalhead"><b id="folderTitle">Nova pasta</b><button class="btn" data-close="folderModal">✕</button></div><form id="folderForm" class="modalbody"><input id="folderId" type="hidden"><div class="field"><label>Nome *</label><input id="folderName" class="input" required></div><div class="field"><label>Descrição</label><textarea id="folderDesc" class="input"></textarea></div><div class="field"><label>Tipo</label><select id="folderType" class="input"><option value="both">Entradas e saídas</option><option value="income">Receitas</option><option value="expense">Despesas</option></select></div><div class="modalfoot"><button type="button" class="btn" data-close="folderModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="serviceModal"><div class="modalbox"><div class="modalhead"><div><b id="serviceTitle">Novo serviço</b><div style="font-size:11px;color:#718096">Contrato, parcelas e recebimentos</div></div><button class="btn" data-close="serviceModal">✕</button></div><form id="serviceForm" class="modalbody"><input id="serviceId" type="hidden"><div class="formgrid">
<div class="field"><label>Cliente *</label><input id="serviceClient" class="input" required></div><div class="field"><label>Serviço *</label><input id="serviceName" class="input" required></div>
<div class="field"><label>Data inicial *</label><input id="serviceStart" class="input" type="date" required></div><div class="field"><label>Data final *</label><input id="serviceEnd" class="input" type="date" required></div>
<div class="field"><label>Valor total *</label><input id="serviceTotal" class="input" type="number" min="0" step="0.01" required></div><div class="field"><label>Categoria / Pasta</label><select id="serviceFolder" class="input"></select></div>
<div class="field"><label>Modelo de cobrança</label><select id="serviceBilling" class="input"><option value="single">Pagamento único</option><option value="installments">Parcelado</option><option value="fixed">Datas fixas</option></select></div>
<div class="field"><label>Nº de parcelas / datas</label><input id="serviceN" class="input" type="number" min="1"></div>
<div class="field"><label>Valor da parcela</label><input id="serviceV" class="input" type="number" min="0" step="0.01"></div>
<div class="field"><label>Periodicidade</label><select id="serviceFreq" class="input"><option value="monthly">Mensal</option><option value="weekly">Semanal</option></select></div>
<div class="field"><label>Dia fixo</label><input id="serviceDay" class="input" type="number" min="1" max="31"></div>
<div class="field full"><label>Observações</label><textarea id="serviceNotes" class="input"></textarea></div>
</div><div class="modalfoot"><button type="button" class="btn" data-close="serviceModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="paymentModal"><div class="modalbox"><div class="modalhead"><div><b>Registrar pagamento</b><div id="paymentName" style="font-size:11px;color:#718096"></div></div><button class="btn" data-close="paymentModal">✕</button></div><form id="paymentForm" class="modalbody"><input id="paymentServiceId" type="hidden"><div class="field"><label>Valor *</label><input id="paymentAmount" class="input" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data *</label><input id="paymentDate" class="input" type="date" required></div><div class="field"><label>Forma de pagamento</label><select id="paymentMethod" class="input"><option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Boleto</option><option>Outro</option></select></div><div class="field"><label>Observação</label><input id="paymentNote" class="input"></div><div class="modalfoot"><button type="button" class="btn" data-close="paymentModal">Cancelar</button><button class="btn primary">Registrar</button></div></form></div></div>

<script>
"use strict";
const KEY="fincontrol_complete_v6";
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);

/* UMA ÚNICA FUNÇÃO DE MOEDA PARA O SISTEMA INTEIRO.
   1000 => R$ 1.000,00
   1500.5 => R$ 1.500,50
*/
const money=n=>{
 const v=Number(String(n??0).replace(",","."));
 return (Number.isFinite(v)?v:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
};
const num=v=>{const n=Number(String(v??0).replace(",", "."));return Number.isFinite(n)?n:0};
const dateBR=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

const demo={
 folders:[
  {id:uid(),name:"Casa",description:"Despesas da casa",type:"expense"},
  {id:uid(),name:"Trabalho",description:"Receitas e custos profissionais",type:"both"},
  {id:uid(),name:"Veículo",description:"Carro e transporte",type:"expense"}
 ],
 accounts:[
  {id:uid(),name:"Conta principal",type:"Banco",initial:0},
  {id:uid(),name:"Dinheiro",type:"Caixa",initial:0}
 ],
 people:[{id:uid(),name:"Cliente Exemplo",type:"Cliente",phone:"",email:""}],
 cards:[{id:uid(),name:"Cartão principal",limit:5000,used:0}],
 transactions:[
  {id:uid(),type:"income",status:"paid",description:"Serviço exemplo",amount:2500,date:today(),folder:"Trabalho",account:"Conta principal",person:"Cliente Exemplo",notes:""},
  {id:uid(),type:"expense",status:"paid",description:"Internet",amount:120,date:today(),folder:"Casa",account:"Conta principal",person:"",notes:""},
  {id:uid(),type:"expense",status:"pending",description:"Energia elétrica",amount:245,date:today(),folder:"Casa",account:"Conta principal",person:"",notes:""}
 ],
 services:[{id:uid(),client:"Cliente Exemplo",name:"Consultoria mensal",start:today(),end:today(),total:6000,billing:"installments",n:12,v:500,folder:"Trabalho",notes:"",payments:[
  {id:uid(),date:today(),amount:500,method:"PIX",note:"Parcela 1"},
  {id:uid(),date:today(),amount:500,method:"PIX",note:"Parcela 2"}
 ]}],
 goals:[{id:uid(),name:"Reserva financeira",target:10000,current:3500,date:"2027-12-31"}],
 trash:[]
};
let db=load();

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x)return Object.assign(structuredClone(demo),x);
 }catch(e){}
 return structuredClone(demo);
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function openModal(id){$(id).classList.add("open")}
function closeModal(id){$(id).classList.remove("open")}
function sum(a,fn){return a.reduce((s,x)=>s+num(fn?fn(x):x.amount),0)}
function txDate(x){return x.date||x.transaction_date||today()}
function txDesc(x){return x.description||x.desc||"Lançamento"}
function txType(x){return x.type||"expense"}
function txAmount(x){return num(x.amount)}
function statusBadge(s){const m={paid:["Pago/Recebido","paid"],pending:["Pendente","pending"],overdue:["Vencido","overdue"],partial:["Parcial","partial"],cancelled:["Cancelado","cancelled"]};const z=m[s]||m.pending;return '<span class="badge '+z[1]+'">'+z[0]+"</span>"}
function periodTx(){
 const p=$("period").value,n=new Date();
 return db.transactions.filter(x=>{if(p==="all")return true;const d=new Date(txDate(x)+"T12:00:00");return p==="year"?d.getFullYear()===n.getFullYear():d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()});
}
function kpi(label,value,cls){return '<div class="card kpi"><div class="label">'+label+'</div><div class="value '+cls+'">'+money(value)+'</div></div>'}

function txTable(arr){
 if(!arr.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';
 return '<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Conta</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
 arr.map(x=>'<tr><td>'+dateBR(txDate(x))+'</td><td><b>'+esc(txDesc(x))+'</b>'+(x.person?'<div style="font-size:11px;color:#718096">'+esc(x.person)+'</div>':"")+'</td><td>'+ (txType(x)==="income"?"Entrada":"Saída")+'</td><td>'+esc(x.folder||"—")+'</td><td>'+esc(x.account||"—")+'</td><td class="'+(txType(x)==="income"?"green":"red")+'"><b>'+(txType(x)==="income"?"+":"−")+money(txAmount(x))+'</b></td><td>'+statusBadge(x.status)+'</td><td class="actions"><button class="btn small" data-action="edit-tx" data-id="'+x.id+'">Editar</button> <button class="btn small" data-action="duplicate-tx" data-id="'+x.id+'">Duplicar</button> <button class="btn small danger" data-action="delete-tx" data-id="'+x.id+'">Excluir</button></td></tr>').join("")+
 "</tbody></table></div>";
}

function renderOverview(){
 const a=periodTx(),income=sum(a,x=>txType(x)==="income"?txAmount(x):0),expense=sum(a,x=>txType(x)==="expense"?txAmount(x):0),open=sum(a,x=>!["paid","cancelled"].includes(x.status)?txAmount(x):0);
 $("overview").innerHTML='<div class="grid g4">'+kpi("Saldo do período",income-expense,"blue")+kpi("Entradas",income,"green")+kpi("Saídas",expense,"red")+kpi("Em aberto",open,"amber")+'</div>'+
 '<div class="grid g2" style="margin-top:16px"><div class="card"><b>Fluxo dos últimos 6 meses</b><div style="font-size:11px;color:#718096">Entradas em verde • saídas em vermelho</div>'+chart()+'</div>'+
 '<div class="card"><b>Resumo financeiro</b><div style="margin-top:12px">'+
 row("Serviços ativos",db.services.length)+row("Clientes / fornecedores",db.people.length)+row("Contas / caixas",db.accounts.length)+row("Cartões",db.cards.length)+
 '</div></div></div><div class="card" style="margin-top:16px"><div class="toolbar"><div><b>Últimos lançamentos</b><p>Todos os valores seguem o mesmo formato monetário.</p></div><button class="btn primary" data-action="new-tx">+ Novo</button></div>'+txTable(a.slice().reverse().slice(0,8))+'</div>';
}
function row(a,b){return '<div style="padding:11px 0;border-bottom:1px solid #edf1f5;font-size:13px">'+a+'<b style="float:right">'+b+"</b></div>"}
function chart(){
 const n=new Date(),arr=[];
 for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),z=db.transactions.filter(x=>{const q=new Date(txDate(x)+"T12:00:00");return q.getFullYear()===d.getFullYear()&&q.getMonth()===d.getMonth()});arr.push({l:d.toLocaleDateString("pt-BR",{month:"short"}),i:sum(z,x=>txType(x)==="income"?txAmount(x):0),o:sum(z,x=>txType(x)==="expense"?txAmount(x):0)})}
 const mx=Math.max(1,...arr.flatMap(x=>[x.i,x.o]));
 return '<div class="chart">'+arr.map(x=>'<div class="barcol"><div class="bars"><div class="bar in" title="'+money(x.i)+'" style="height:'+Math.max(2,x.i/mx*170)+'px"></div><div class="bar out" title="'+money(x.o)+'" style="height:'+Math.max(2,x.o/mx*170)+'px"></div></div><small>'+x.l+'</small></div>').join("")+"</div>";
}
function renderTransactions(){$("transactions").innerHTML='<div class="toolbar"><div><h2>Movimentações</h2><p>Adicionar, editar, duplicar e excluir.</p></div><button class="btn primary" data-action="new-tx">+ Novo lançamento</button></div><div class="card">'+txTable(periodTx().slice().reverse())+'</div>'}
function renderOpen(type){
 const a=db.transactions.filter(x=>txType(x)===type&&!["paid","cancelled"].includes(x.status)),root=$(type==="income"?"receivables":"payables"),title=type==="income"?"A receber":"A pagar";
 root.innerHTML='<div class="toolbar"><div><h2>'+title+'</h2><p>Valores que ainda não foram concluídos.</p></div><button class="btn primary" data-action="new-tx" data-type="'+type+'">+ Adicionar</button></div><div class="grid g3">'+kpi("Total em aberto",sum(a,x=>txAmount(x)),type==="income"?"green":"red")+kpi("Vencido",sum(a,x=>x.status==="overdue"?txAmount(x):0),"red")+kpi("Quantidade",a.length,"blue")+'</div><div class="card" style="margin-top:16px">'+txTable(a)+'</div>';
}
function renderFolders(){
 $("folders").innerHTML='<div class="toolbar"><div><h2>Categorias / Pastas</h2><p>Crie pastas e acompanhe os lançamentos dentro de cada uma.</p></div><button class="btn primary" data-action="new-folder">+ Nova pasta</button></div><div class="foldergrid">'+db.folders.map(f=>{const a=db.transactions.filter(x=>x.folder===f.name);return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="iconbox">▣</div><div><button class="btn small" data-action="edit-folder" data-id="'+f.id+'">Editar</button> <button class="btn small danger" data-action="delete-folder" data-id="'+f.id+'">Excluir</button></div></div><h3>'+esc(f.name)+'</h3><p style="font-size:12px;color:#718096">'+esc(f.description||"")+'</p><div class="grid g2" style="margin-top:14px">'+
 '<div><small class="muted">Entradas</small><b class="green" style="display:block">'+money(sum(a,x=>txType(x)==="income"?txAmount(x):0))+'</b></div><div><small class="muted">Saídas</small><b class="red" style="display:block">'+money(sum(a,x=>txType(x)==="expense"?txAmount(x):0))+'</b></div></div><div style="font-size:11px;color:#718096;margin-top:12px">'+a.length+' lançamento(s)</div><button class="btn" style="width:100%;margin-top:12px" data-action="open-folder" data-id="'+f.id+'">Abrir pasta</button></div>'}).join("")+'</div>';
}
function renderFolderDetail(i){
 const f=db.folders.find(x=>x.id===i);if(!f)return;
 const a=db.transactions.filter(x=>x.folder===f.name);
 $("folders").innerHTML='<div class="toolbar"><div><h2>'+esc(f.name)+'</h2><p>'+esc(f.description||"")+'</p></div><div class="buttons"><button class="btn" data-action="back-folders">← Voltar</button><button class="btn primary" data-action="new-tx">+ Inserir</button></div></div><div class="grid g4">'+kpi("Entradas",sum(a,x=>txType(x)==="income"?txAmount(x):0),"green")+kpi("Saídas",sum(a,x=>txType(x)==="expense"?txAmount(x):0),"red")+kpi("Em aberto",sum(a,x=>!["paid","cancelled"].includes(x.status)?txAmount(x):0),"amber")+kpi("Lançamentos",a.length,"purple")+'</div><div class="card" style="margin-top:16px"><b>Lançamentos da pasta</b>'+txTable(a.slice().reverse())+'</div>';
}
function servicePaid(s){return sum(s.payments||[],x=>num(x.amount))}
function expected(s){if(s.billing==="installments")return num(s.n);if(s.billing==="fixed"&&s.n)return num(s.n);return 1}
function renderServices(){
 const total=sum(db.services,x=>num(x.total)),paid=sum(db.services,x=>servicePaid(x));
 $("services").innerHTML='<div class="toolbar"><div><h2>Serviços</h2><p>Controle total, pago, restante, parcelas e datas.</p></div><button class="btn primary" data-action="new-service">+ Novo serviço</button></div><div class="grid g3">'+kpi("Total contratado",total,"blue")+kpi("Total recebido",paid,"green")+kpi("Total restante",Math.max(0,total-paid),"amber")+'</div><div class="servicegrid" style="margin-top:16px">'+db.services.map(serviceCard).join("")+'</div>';
}
function serviceCard(s){
 const total=num(s.total),paid=servicePaid(s),remaining=Math.max(0,total-paid),pct=total?Math.min(100,paid/total*100):0,n=expected(s),pv=s.billing==="installments"?num(s.v):total,paidN=s.billing==="single"?(paid>=total?1:0):Math.min(n,pv?Math.floor(paid/pv+1e-8):0),missing=Math.max(0,n-paidN);
 return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><span style="font-size:11px;color:#718096">'+esc(s.client)+'</span><h3 style="margin:5px 0">'+esc(s.name)+'</h3></div><div class="buttons"><button class="btn small" data-action="edit-service" data-id="'+s.id+'">Editar</button><button class="btn small danger" data-action="delete-service" data-id="'+s.id+'">Excluir</button></div></div>'+
 '<div class="service-meta"><div><small>Total</small><b>'+money(total)+'</b></div><div><small>Pago</small><b class="green">'+money(paid)+'</b></div><div><small>Restante</small><b class="amber">'+money(remaining)+'</b></div></div><div class="progress"><span style="width:'+pct+'%"></span></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px"><span>'+pct.toFixed(0)+'% recebido</span><b class="'+(missing?"red":"green")+'">'+(s.billing==="installments"?paidN+" de "+n+" parcelas":s.billing==="fixed"?n+" datas • "+missing+" faltantes":paid>=total?"Concluído":"Pendente")+'</b></div><div style="font-size:11px;color:#718096;margin-top:10px">'+dateBR(s.start)+' → '+dateBR(s.end)+'</div><div class="buttons" style="margin-top:13px"><button class="btn" style="flex:1" data-action="payment" data-id="'+s.id+'">+ Registrar pagamento</button><button class="btn" data-action="history" data-id="'+s.id+'">Histórico</button></div></div>';
}
function renderPeople(){$("people").innerHTML='<div class="toolbar"><div><h2>Clientes / Fornecedores</h2><p>Cadastros vinculáveis aos lançamentos.</p></div><button class="btn primary" data-action="new-person">+ Novo contato</button></div><div class="peoplegrid">'+db.people.map(p=>'<div class="card"><div style="display:flex;justify-content:space-between"><div class="iconbox">♙</div><button class="btn small danger" data-action="delete-person" data-id="'+p.id+'">Excluir</button></div><h3>'+esc(p.name)+'</h3><span class="badge partial">'+esc(p.type)+'</span><p style="font-size:12px;color:#718096">'+esc(p.phone||"Sem telefone")+'<br>'+esc(p.email||"Sem e-mail")+'</p></div>').join("")+'</div>'}
function renderAccounts(){$("accounts").innerHTML='<div class="toolbar"><div><h2>Caixas & Contas</h2><p>Contas bancárias e dinheiro em caixa.</p></div><button class="btn primary" data-action="new-account">+ Nova conta</button></div><div class="accountgrid">'+db.accounts.map(a=>{const tx=db.transactions.filter(x=>x.account===a.name&&x.status==="paid"),bal=num(a.initial)+sum(tx,x=>txType(x)==="income"?txAmount(x):-txAmount(x));return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="iconbox">▤</div><button class="btn small danger" data-action="delete-account" data-id="'+a.id+'">Excluir</button></div><h3>'+esc(a.name)+'</h3><div style="font-size:23px;font-weight:850">'+money(bal)+'</div><p style="font-size:11px;color:#718096">'+esc(a.type)+'</p></div>'}).join("")+'</div>'}
function renderCards(){$("cards").innerHTML='<div class="toolbar"><div><h2>Cartões</h2><p>Limite, utilizado e disponível.</p></div><button class="btn primary" data-action="new-card">+ Novo cartão</button></div><div class="accountgrid">'+db.cards.map(c=>{const l=num(c.limit),u=num(c.used),p=l?u/l*100:0;return '<div class="card"><div style="display:flex;justify-content:space-between"><b>▱</b><button class="btn small danger" data-action="delete-card" data-id="'+c.id+'">Excluir</button></div><h3>'+esc(c.name)+'</h3><div style="font-size:11px;color:#718096">Limite</div><b style="font-size:19px">'+money(l)+'</b><div style="font-size:11px;color:#718096;margin-top:8px">Utilizado</div><b class="red">'+money(u)+'</b><div class="progress" style="margin-top:10px"><span style="width:'+Math.min(100,p)+'%;background:#2563eb"></span></div><div style="font-size:11px;color:#718096;margin-top:5px">Disponível '+money(Math.max(0,l-u))+'</div></div>'}).join("")+'</div>'}
function renderCalendar(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();let h="";for(let i=0;i<first;i++)h+="<div></div>";for(let d=1;d<=days;d++){const ds=new Date(y,m,d).toISOString().slice(0,10),a=db.transactions.filter(x=>txDate(x)===ds);h+='<div class="day"><b>'+d+'</b>'+a.map(x=>'<div class="event '+(txType(x)==="income"?"in":"out")+'">'+(txType(x)==="income"?"+":"−")+money(txAmount(x))+'</div>').join("")+"</div>"}$("calendar").innerHTML='<div class="toolbar"><div><h2>Calendário financeiro</h2><p>'+n.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</p></div></div><div class="calendar">'+h+"</div>"}
function renderGoals(){$("goals").innerHTML='<div class="toolbar"><div><h2>Metas financeiras</h2><p>Objetivos e progresso.</p></div><button class="btn primary" data-action="new-goal">+ Nova meta</button></div><div class="grid g2">'+db.goals.map(g=>{const t=num(g.target),c=num(g.current),p=t?Math.min(100,c/t*100):0;return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+esc(g.name)+'</b><button class="btn small danger" data-action="delete-goal" data-id="'+g.id+'">Excluir</button></div><div style="font-size:20px;font-weight:800;margin-top:13px">'+money(c)+' <span style="font-size:12px;color:#718096">de '+money(t)+'</span></div><div class="progress" style="margin-top:10px"><span style="width:'+p+'%"></span></div><div style="font-size:11px;color:#718096;margin-top:6px">'+p.toFixed(0)+'% • prazo '+dateBR(g.date)+'</div><button class="btn" style="margin-top:12px;width:100%" data-action="goal-add" data-id="'+g.id+'">+ Adicionar valor</button></div>'}).join("")+'</div>'}
function renderReports(){const a=periodTx(),i=sum(a,x=>txType(x)==="income"?txAmount(x):0),o=sum(a,x=>txType(x)==="expense"?txAmount(x):0);$("reports").innerHTML='<div class="toolbar"><div><h2>Relatórios</h2><p>Resumo do período selecionado.</p></div><button class="btn" data-action="csv">Exportar CSV</button></div><div class="grid g4">'+kpi("Entradas",i,"green")+kpi("Saídas",o,"red")+kpi("Resultado",i-o,"blue")+kpi("Lançamentos",a.length,"purple")+'</div><div class="card" style="margin-top:16px">'+txTable(a.slice().reverse())+'</div>'}
function renderSettings(){$("settings").innerHTML='<div class="toolbar"><div><h2>Configurações</h2><p>Controle dos dados desta instalação.</p></div></div><div class="grid g2"><div class="card"><h3>Modo atual</h3><p style="font-size:12px;color:#718096">Sem tela de login. Esta versão funciona imediatamente no navegador e mantém os dados no armazenamento local.</p><div class="alert">A conexão com Supabase pode ser ativada depois sem alterar o visual.</div></div><div class="card"><h3>Backup</h3><p style="font-size:12px;color:#718096">Faça uma cópia antes de qualquer alteração importante.</p><div class="buttons"><button class="btn primary" data-action="backup">Baixar JSON</button><button class="btn" data-action="restore">Restaurar JSON</button><button class="btn danger" data-action="reset">Restaurar demonstração</button></div></div><div class="card"><h3>Lixeira</h3><p style="font-size:12px;color:#718096">'+db.trash.length+' registro(s) arquivado(s).</p><button class="btn danger" data-action="empty-trash">Esvaziar lixeira</button></div></div>'}
function renderAll(){renderOverview();renderTransactions();renderOpen("income");renderOpen("expense");renderFolders();renderServices();renderPeople();renderAccounts();renderCards();renderCalendar();renderGoals();renderReports();renderSettings()}
function fillSelects(){$("txFolder").innerHTML='<option value="">Sem categoria</option>'+db.folders.map(x=>'<option>'+esc(x.name)+'</option>').join("");$("txAccount").innerHTML='<option value="">Sem conta</option>'+db.accounts.map(x=>'<option>'+esc(x.name)+'</option>').join("");$("serviceFolder").innerHTML='<option value="">Sem categoria</option>'+db.folders.map(x=>'<option>'+esc(x.name)+'</option>').join("")}
function newTx(type){fillSelects();$("txForm").reset();$("txId").value="";$("txDate").value=today();$("txType").value=type||"income";$("txStatus").value="paid";$("txTitle").textContent="Novo lançamento";openModal("txModal")}
function editTx(i){const x=db.transactions.find(a=>a.id===i);if(!x)return;fillSelects();$("txId").value=x.id;$("txType").value=txType(x);$("txStatus").value=x.status;$("txDesc").value=txDesc(x);$("txAmount").value=txAmount(x);$("txDate").value=txDate(x);$("txFolder").value=x.folder||"";$("txAccount").value=x.account||"";$("txPerson").value=x.person||"";$("txNotes").value=x.notes||"";$("txTitle").textContent="Editar lançamento";openModal("txModal")}
function deleteTx(i){const x=db.transactions.find(a=>a.id===i);if(!x||!confirm("Excluir este lançamento?"))return;db.transactions=db.transactions.filter(a=>a.id!==i);db.trash.push({kind:"transaction",data:x,date:today()});save();renderAll()}
function duplicateTx(i){const x=db.transactions.find(a=>a.id===i);if(x){db.transactions.push({...x,id:uid(),description:txDesc(x)+" (cópia)"});save();renderAll()}}
function openFolderForm(i){$("folderForm").reset();$("folderId").value=i||"";if(i){const f=db.folders.find(x=>x.id===i);$("folderName").value=f.name;$("folderDesc").value=f.description||"";$("folderType").value=f.type||"both";$("folderTitle").textContent="Editar pasta"}else $("folderTitle").textContent="Nova pasta";openModal("folderModal")}
function deleteFolder(i){const f=db.folders.find(x=>x.id===i);if(f&&confirm("Excluir a pasta? Os lançamentos existentes serão preservados.")){db.folders=db.folders.filter(x=>x.id!==i);save();renderAll()}}
function openService(i){fillSelects();$("serviceForm").reset();$("serviceId").value=i||"";$("serviceStart").value=today();$("serviceEnd").value=today();if(i){const s=db.services.find(x=>x.id===i);$("serviceClient").value=s.client;$("serviceName").value=s.name;$("serviceStart").value=s.start;$("serviceEnd").value=s.end;$("serviceTotal").value=s.total;$("serviceFolder").value=s.folder||"";$("serviceBilling").value=s.billing;$("serviceN").value=s.n||"";$("serviceV").value=s.v||"";$("serviceFreq").value=s.freq||"monthly";$("serviceDay").value=s.day||"";$("serviceNotes").value=s.notes||"";$("serviceTitle").textContent="Editar serviço"}else $("serviceTitle").textContent="Novo serviço";openModal("serviceModal")}
function deleteService(i){const s=db.services.find(x=>x.id===i);if(s&&confirm("Excluir este serviço?")){db.services=db.services.filter(x=>x.id!==i);db.trash.push({kind:"service",data:s,date:today()});save();renderAll()}}
function payment(i){const s=db.services.find(x=>x.id===i);$("paymentForm").reset();$("paymentServiceId").value=i;$("paymentDate").value=today();$("paymentAmount").value=s&&s.billing==="installments"?num(s.v):"";$("paymentName").textContent=s?s.client+" • "+s.name:"";openModal("paymentModal")}
function history(i){const s=db.services.find(x=>x.id===i),p=s?.payments||[];alert((s?.name||"Serviço")+"\n\n"+(p.length?p.map((x,n)=>(n+1)+" — "+dateBR(x.date)+" — "+money(x.amount)+" — "+(x.method||"Pagamento")).join("\n"):"Nenhum pagamento registrado."))}
function addPerson(){const n=prompt("Nome do cliente/fornecedor:");if(!n)return;db.people.push({id:uid(),name:n,type:prompt("Tipo: Cliente ou Fornecedor","Cliente")||"Cliente",phone:prompt("Telefone (opcional):")||"",email:prompt("E-mail (opcional):")||""});save();renderAll()}
function addAccount(){const n=prompt("Nome da conta/caixa:");if(!n)return;db.accounts.push({id:uid(),name:n,type:"Banco",initial:num(prompt("Saldo inicial:","0"))});save();renderAll()}
function addCard(){const n=prompt("Nome do cartão:");if(!n)return;db.cards.push({id:uid(),name:n,limit:num(prompt("Limite:","0")),used:0});save();renderAll()}
function addGoal(){const n=prompt("Nome da meta:");if(!n)return;db.goals.push({id:uid(),name:n,target:num(prompt("Valor objetivo:","0")),current:0,date:prompt("Prazo (AAAA-MM-DD):",today())||today()});save();renderAll()}
function delGeneric(type,i){if(!confirm("Excluir este registro?"))return;db[type]=db[type].filter(x=>x.id!==i);save();renderAll()}
function csv(){const rows=[["Data","Tipo","Descrição","Categoria","Conta","Valor","Status"],...db.transactions.map(x=>[txDate(x),txType(x),txDesc(x),x.folder||"",x.account||"",txAmount(x).toFixed(2).replace(".",","),x.status])];const blob=new Blob(["\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="fincontrol.csv";a.click();URL.revokeObjectURL(u)}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="fincontrol_backup.json";a.click();URL.revokeObjectURL(u)}
function restore(){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();renderAll();alert("Backup restaurado.")}catch(e){alert("Arquivo inválido.")}};r.readAsText(f)};i.click()}
function reset(){if(confirm("Restaurar os dados de demonstração?")){db=structuredClone(demo);save();renderAll()}}
function emptyTrash(){if(confirm("Esvaziar a lixeira permanentemente?")){db.trash=[];save();renderAll()}}

document.addEventListener("click",e=>{
 const n=e.target.closest(".nav");if(n){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(n.dataset.page).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x===n));const names={overview:["Overview","Sua visão financeira"],transactions:["Movimentações","Entradas, saídas e pagamentos"],receivables:["A receber","Valores pendentes de recebimento"],payables:["A pagar","Contas e despesas pendentes"],folders:["Categorias / Pastas","Organize seus lançamentos"],services:["Serviços","Contratos, parcelas e recebimentos"],people:["Clientes / Fornecedores","Cadastros"],accounts:["Caixas & Contas","Bancos e dinheiro"],cards:["Cartões","Limites e utilização"],calendar:["Calendário","Visão por datas"],goals:["Metas","Objetivos financeiros"],reports:["Relatórios","Análises"],settings:["Configurações","Dados do sistema"]};$("title").textContent=names[n.dataset.page][0];$("subtitle").textContent=names[n.dataset.page][1];if(n.dataset.page==="folders")renderFolders();return}
 const c=e.target.closest("[data-close]");if(c){closeModal(c.dataset.close);return}
 const a=e.target.closest("[data-action]");if(!a)return;const ac=a.dataset.action,i=a.dataset.id;
 if(ac==="new-tx")newTx(a.dataset.type||"income");else if(ac==="edit-tx")editTx(i);else if(ac==="delete-tx")deleteTx(i);else if(ac==="duplicate-tx")duplicateTx(i);
 else if(ac==="new-folder")openFolderForm();else if(ac==="edit-folder")openFolderForm(i);else if(ac==="delete-folder")deleteFolder(i);else if(ac==="open-folder")renderFolderDetail(i);else if(ac==="back-folders")renderFolders();
 else if(ac==="new-service")openService();else if(ac==="edit-service")openService(i);else if(ac==="delete-service")deleteService(i);else if(ac==="payment")payment(i);else if(ac==="history")history(i);
 else if(ac==="new-person")addPerson();else if(ac==="delete-person")delGeneric("people",i);else if(ac==="new-account")addAccount();else if(ac==="delete-account")delGeneric("accounts",i);else if(ac==="new-card")addCard();else if(ac==="delete-card")delGeneric("cards",i);
 else if(ac==="new-goal")addGoal();else if(ac==="delete-goal")delGeneric("goals",i);else if(ac==="goal-add"){const g=db.goals.find(x=>x.id===i),v=num(prompt("Valor a adicionar:","0"));if(g&&v>0){g.current+=v;save();renderAll()}}
 else if(ac==="csv")csv();else if(ac==="backup")backup();else if(ac==="restore")restore();else if(ac==="reset")reset();else if(ac==="empty-trash")emptyTrash();
});
$("quick").onclick=()=>newTx("income");$("period").onchange=renderAll;$("menu").onclick=()=>$("sidebar").classList.toggle("open");
$("txForm").onsubmit=e=>{e.preventDefault();const o={id:$("txId").value||uid(),type:$("txType").value,status:$("txStatus").value,description:$("txDesc").value.trim(),amount:num($("txAmount").value),date:$("txDate").value,folder:$("txFolder").value,account:$("txAccount").value,person:$("txPerson").value.trim(),notes:$("txNotes").value.trim()};const ix=db.transactions.findIndex(x=>x.id===o.id);if(ix>=0)db.transactions[ix]=o;else db.transactions.push(o);save();closeModal("txModal");renderAll()};
$("folderForm").onsubmit=e=>{e.preventDefault();const o={id:$("folderId").value||uid(),name:$("folderName").value.trim(),description:$("folderDesc").value.trim(),type:$("folderType").value},ix=db.folders.findIndex(x=>x.id===o.id);if(ix>=0)db.folders[ix]=o;else db.folders.push(o);save();closeModal("folderModal");renderAll()};
$("serviceForm").onsubmit=e=>{e.preventDefault();const old=db.services.find(x=>x.id===$("serviceId").value),o={id:$("serviceId").value||uid(),client:$("serviceClient").value.trim(),name:$("serviceName").value.trim(),start:$("serviceStart").value,end:$("serviceEnd").value,total:num($("serviceTotal").value),folder:$("serviceFolder").value,billing:$("serviceBilling").value,n:num($("serviceN").value),v:num($("serviceV").value),freq:$("serviceFreq").value,day:num($("serviceDay").value),notes:$("serviceNotes").value.trim(),payments:old?old.payments||[]:[]};const ix=db.services.findIndex(x=>x.id===o.id);if(ix>=0)db.services[ix]=o;else db.services.push(o);save();closeModal("serviceModal");renderAll()};
$("paymentForm").onsubmit=e=>{e.preventDefault();const s=db.services.find(x=>x.id===$("paymentServiceId").value),v=num($("paymentAmount").value);if(!s||v<=0)return;s.payments=s.payments||[];s.payments.push({id:uid(),date:$("paymentDate").value,amount:v,method:$("paymentMethod").value,note:$("paymentNote").value.trim()});save();closeModal("paymentModal");renderAll()};
renderAll();
</script>
