<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinControl Pro — Gestão Financeira</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}.side{background:#0b1220}.nav.active,.nav:hover{background:#19263c;color:#fff}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 5px 20px #0f172a08}.input{width:100%;border:1px solid #dce2ea;border-radius:11px;padding:10px 12px;outline:0}.input:focus{border-color:#5680ff;box-shadow:0 0 0 3px #dbe5ff}.btn{padding:10px 14px;border-radius:11px;font-weight:700;font-size:14px}.primary{background:#2563eb;color:white}.primary:hover{background:#1d4ed8}.tab{display:none}.tab.active{display:block}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.table th{font-size:11px;text-transform:uppercase;color:#718096;text-align:left;background:#f8fafc;padding:12px}.table td{padding:12px;border-top:1px solid #edf0f4;font-size:13px}.bar{height:8px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}.modalbg{background:#02081799;backdrop-filter:blur(5px)}@media(max-width:900px){.side{width:72px}.brandtext,.navtext,.sidefoot{display:none}.main{margin-left:72px}}@media(max-width:650px){.side{display:none}.main{margin-left:0}}
</style>
</head>
<body>
<aside class="side fixed left-0 top-0 bottom-0 w-64 z-40 text-slate-300 p-4">
 <div class="flex items-center gap-3 h-14 mb-5 px-2"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black">F</div><div class="brandtext"><b class="text-white text-lg">FinControl</b><div class="text-[10px] tracking-widest">PRO FINANCE</div></div></div>
 <nav id="nav" class="space-y-1"></nav>
 <div class="sidefoot absolute bottom-4 left-4 right-4 p-3 rounded-xl bg-white/5"><div class="text-[10px] text-slate-500">VERSÃO</div><div class="text-sm text-white">Completa • Local</div></div>
</aside>
<main class="main ml-64 min-h-screen">
<header class="sticky top-0 z-30 h-16 bg-white/90 backdrop-blur border-b px-5 md:px-8 flex justify-between items-center">
 <div><h1 id="title" class="font-bold text-xl">Overview</h1><p id="sub" class="text-xs text-slate-500">Sua visão financeira</p></div>
 <div class="flex gap-2"><select id="period" class="input !w-auto"><option value="month">Este mês</option><option value="year">Este ano</option><option value="all">Todos</option></select><button onclick="openTx()" class="btn primary">+ Novo lançamento</button></div>
</header>
<section class="p-5 md:p-8">
<div id="overview" class="tab active"></div><div id="folders" class="tab"></div><div id="folderDetail" class="tab"></div><div id="services" class="tab"></div><div id="transactions" class="tab"></div><div id="receivables" class="tab"></div><div id="payables" class="tab"></div><div id="accounts" class="tab"></div><div id="people" class="tab"></div><div id="cards" class="tab"></div><div id="calendar" class="tab"></div><div id="goals" class="tab"></div><div id="reports" class="tab"></div><div id="settings" class="tab"></div>
</section></main>

<!-- lançamento -->
<div id="txModal" class="modalbg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-xl max-h-[94vh] overflow-auto">
<div class="p-5 border-b flex justify-between"><div><b id="txTitle">Novo lançamento</b><p class="text-xs text-slate-500">Registre entradas, saídas ou pagamentos</p></div><button onclick="closeM('txModal')"><i data-lucide="x"></i></button></div>
<form id="txForm" class="p-5 space-y-4"><input id="txId" type="hidden">
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Tipo<select id="txType" class="input mt-1"><option value="income">Entrada</option><option value="expense">Saída</option></select></label><label class="text-sm">Status<select id="txStatus" class="input mt-1"><option value="paid">Pago / Recebido</option><option value="pending">Pendente</option><option value="overdue">Vencido</option><option value="partial">Parcial</option><option value="cancelled">Cancelado</option></select></label></div>
<label class="text-sm">Descrição<input id="txDesc" required class="input mt-1" placeholder="Ex.: Parcela 03"></label>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Valor<input id="txAmount" required type="number" min="0" step=".01" class="input mt-1"></label><label class="text-sm">Data<input id="txDate" required type="date" class="input mt-1"></label></div>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Pasta / categoria<select id="txFolder" class="input mt-1"></select></label><label class="text-sm">Conta / caixa<select id="txAccount" class="input mt-1"></select></label></div>
<label class="text-sm">Cliente / fornecedor<input id="txPerson" class="input mt-1"></label><label class="text-sm">Observações<textarea id="txNotes" class="input mt-1" rows="2"></textarea></label>
<div class="flex justify-end gap-2"><button type="button" onclick="closeM('txModal')" class="btn bg-slate-100">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<!-- pasta -->
<div id="folderModal" class="modalbg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md">
<div class="p-5 border-b flex justify-between"><b>Nova categoria / pasta</b><button onclick="closeM('folderModal')"><i data-lucide="x"></i></button></div>
<form id="folderForm" class="p-5 space-y-4"><label class="text-sm">Nome<input id="fdName" required class="input mt-1" placeholder="Ex.: Reforma"></label><label class="text-sm">Descrição<textarea id="fdDesc" class="input mt-1"></textarea></label><label class="text-sm">Tipo<select id="fdType" class="input mt-1"><option value="both">Entradas e saídas</option><option value="income">Receitas</option><option value="expense">Despesas</option></select></label><button class="btn primary w-full">Criar pasta</button></form></div></div>

<!-- serviço -->
<div id="serviceModal" class="modalbg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-2xl max-h-[94vh] overflow-auto">
<div class="p-5 border-b flex justify-between"><div><b id="svTitle">Novo serviço</b><p class="text-xs text-slate-500">Contrato, parcelas, datas fixas e acompanhamento</p></div><button onclick="closeM('serviceModal')"><i data-lucide="x"></i></button></div>
<form id="serviceForm" class="p-5 space-y-4"><input id="svId" type="hidden">
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Cliente<input id="svClient" required class="input mt-1"></label><label class="text-sm">Serviço<input id="svName" required class="input mt-1"></label></div>
<div class="grid grid-cols-3 gap-3"><label class="text-sm">Início<input id="svStart" required type="date" class="input mt-1"></label><label class="text-sm">Final<input id="svEnd" required type="date" class="input mt-1"></label><label class="text-sm">Valor total<input id="svTotal" required type="number" min="0" step=".01" class="input mt-1"></label></div>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Cobrança<select id="svBilling" class="input mt-1" onchange="billingUI()"><option value="single">Única</option><option value="installments">Parcelas</option><option value="fixed">Datas fixas</option></select></label><label class="text-sm">Pasta<select id="svFolder" class="input mt-1"></select></label></div>
<div id="inst" class="hidden grid grid-cols-2 gap-3"><label class="text-sm">Nº parcelas<input id="svN" type="number" min="1" class="input mt-1"></label><label class="text-sm">Valor parcela<input id="svV" type="number" min="0" step=".01" class="input mt-1"></label></div>
<div id="fixed" class="hidden grid grid-cols-3 gap-3"><label class="text-sm">Periodicidade<select id="svFreq" class="input mt-1"><option value="monthly">Mensal</option><option value="weekly">Semanal</option></select></label><label class="text-sm">Dia fixo<input id="svDay" type="number" min="1" max="31" class="input mt-1"></label><label class="text-sm">Meta de datas<input id="svExpected" type="number" min="0" class="input mt-1" placeholder="Automático"></label></div>
<label class="text-sm">Observações<textarea id="svNotes" class="input mt-1"></textarea></label><div class="flex justify-end gap-2"><button type="button" onclick="closeM('serviceModal')" class="btn bg-slate-100">Cancelar</button><button class="btn primary">Salvar serviço</button></div></form></div></div>

<!-- pagamento -->
<div id="payModal" class="modalbg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md"><div class="p-5 border-b flex justify-between"><b>Registrar pagamento</b><button onclick="closeM('payModal')"><i data-lucide="x"></i></button></div>
<form id="payForm" class="p-5 space-y-4"><input id="payService" type="hidden"><label class="text-sm">Valor pago<input id="payAmount" required type="number" min="0" step=".01" class="input mt-1"></label><label class="text-sm">Data<input id="payDate" required type="date" class="input mt-1"></label><label class="text-sm">Forma<select id="payMethod" class="input mt-1"><option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Outro</option></select></label><label class="text-sm">Observação<input id="payNote" class="input mt-1"></label><button class="btn primary w-full">Registrar pagamento</button></form></div></div>

<script>
const KEY='fincontrol_complete_v3', uid=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10);
let D=JSON.parse(localStorage.getItem(KEY)||'null')||{
 folders:[{id:uid(),name:'Casa',desc:'Despesas da casa',type:'expense'},{id:uid(),name:'Trabalho',desc:'Serviços e receitas',type:'income'},{id:uid(),name:'Veículo',desc:'Carro e transporte',type:'expense'}],
 accounts:[{id:uid(),name:'Conta principal',type:'Banco',balance:0},{id:uid(),name:'Dinheiro',type:'Caixa',balance:0}],
 people:[{id:uid(),name:'Cliente Exemplo',kind:'Cliente',phone:'',email:''}],
 cards:[{id:uid(),name:'Cartão principal',limit:5000,used:0}],
 transactions:[
  {id:uid(),type:'income',status:'paid',desc:'Serviço exemplo',amount:2500,date:today(),folder:'Trabalho',account:'Conta principal',person:'Cliente Exemplo',notes:''},
  {id:uid(),type:'expense',status:'paid',desc:'Internet',amount:120,date:today(),folder:'Casa',account:'Conta principal',person:'',notes:''},
  {id:uid(),type:'expense',status:'pending',desc:'Energia',amount:245,date:today(),folder:'Casa',account:'Conta principal',person:'',notes:''}],
 services:[{id:uid(),client:'Cliente Exemplo',name:'Consultoria mensal',start:today(),end:today(),total:6000,billing:'installments',n:12,v:500,paid:1500,folder:'Trabalho',payments:[{date:today(),amount:500},{date:today(),amount:500},{date:today(),amount:500}]}],
 goals:[{id:uid(),name:'Reserva financeira',target:10000,current:3500,date:'2027-12-31'}]
};
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):''}
function txFiltered(){let p=period.value;return D.transactions.filter(x=>{let d=new Date(x.date),n=new Date();return p==='all'||(p==='year'?d.getFullYear()===n.getFullYear():d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear())})}
function sum(a,fn){return a.filter(fn||(()=>true)).reduce((s,x)=>s+Number(x.amount||0),0)}
const nav=[['overview','layout-dashboard','Overview'],['folders','folder-kanban','Categorias / Pastas'],['services','briefcase-business','Serviços'],['transactions','arrow-left-right','Movimentações'],['receivables','circle-dollar-sign','A receber'],['payables','receipt-text','A pagar'],['accounts','wallet-cards','Caixas & Contas'],['people','users-round','Clientes / Fornecedores'],['cards','credit-card','Cartões'],['calendar','calendar-days','Calendário'],['goals','target','Metas'],['reports','chart-no-axes-combined','Relatórios'],['settings','settings','Configurações']];
function navRender(){navEl.innerHTML=nav.map((x,i)=>`<button class="nav w-full flex gap-3 items-center px-3 py-3 rounded-xl text-sm ${i?'':'active'}" data-tab="${x[0]}" onclick="show('${x[0]}')"><i data-lucide="${x[1]}" class="w-5"></i><span class="navtext">${x[2]}</span></button>`).join('')}
function show(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));let n=nav.find(x=>x[0]===t);title.textContent=n?.[2]||'Detalhes';sub.textContent=t==='folders'?'Organize tudo por pastas':t==='services'?'Contratos, pagamentos e parcelas':'Gestão financeira';render();if(t==='overview')setTimeout(chart,30)}
function kpi(t,v,ic,cl=''){return `<div class="card p-5"><div class="flex justify-between"><div><span class="text-sm text-slate-500">${t}</span><div class="text-2xl font-bold mt-2 money ${cl}">${brl(v)}</div></div><div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center"><i data-lucide="${ic}" class="w-5"></i></div></div></div>`}
function badge(x){let map={paid:['Pago/Recebido','bg-emerald-50 text-emerald-700'],pending:['Pendente','bg-amber-50 text-amber-700'],overdue:['Vencido','bg-red-50 text-red-700'],partial:['Parcial','bg-blue-50 text-blue-700'],cancelled:['Cancelado','bg-slate-100 text-slate-600']};let z=map[x.status]||map.pending;return `<span class="badge ${z[1]}">${z[0]}</span>`}
function txTable(a){return `<div class="overflow-x-auto"><table class="table w-full"><thead><tr><th>Data</th><th>Descrição</th><th>Pasta</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td>${fmt(x.date)}</td><td><b>${esc(x.desc)}</b>${x.person?`<div class="text-[11px] text-slate-400">${esc(x.person)}</div>`:''}</td><td>${esc(x.folder||'Outros')}</td><td class="font-bold ${x.type==='income'?'text-emerald-600':'text-red-600'}">${x.type==='income'?'+':'−'} ${brl(x.amount)}</td><td>${badge(x)}</td><td class="text-right whitespace-nowrap"><button onclick="editTx('${x.id}')" class="p-2 text-slate-500"><i data-lucide="pencil" class="w-4"></i></button><button onclick="duplicateTx('${x.id}')" class="p-2 text-slate-500"><i data-lucide="copy" class="w-4"></i></button><button onclick="delTx('${x.id}')" class="p-2 text-slate-500 hover:text-red-600"><i data-lucide="trash-2" class="w-4"></i></button></td></tr>`).join(''):`<tr><td colspan="6" class="text-center py-8 text-slate-400">Nenhum registro.</td></tr>`}</tbody></table></div>`}
function renderOverview(){let a=txFiltered(),i=sum(a,x=>x.type==='income'),e=sum(a,x=>x.type==='expense'),p=sum(a,x=>x.status!=='paid'),sv=D.services.reduce((s,x)=>s+x.total,0),sp=D.services.reduce((s,x)=>s+paid(x),0);overview.innerHTML=`<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Saldo do período',i-e,'wallet')}${kpi('Entradas',i,'trending-up','text-emerald-600')}${kpi('Saídas',e,'trending-down','text-red-600')}${kpi('Pendente / vencido',p,'clock','text-amber-600')}</div><div class="grid xl:grid-cols-3 gap-5 mt-5"><div class="card p-5 xl:col-span-2"><b>Fluxo financeiro</b><p class="text-xs text-slate-500">Evolução dos últimos 6 meses</p><canvas id="chartEl" height="110"></canvas></div><div class="card p-5"><b>Serviços</b><div class="mt-5 space-y-4"><div><span class="text-xs text-slate-500">Contratado</span><div class="text-xl font-bold">${brl(sv)}</div></div><div><span class="text-xs text-slate-500">Pago</span><div class="text-xl font-bold text-emerald-600">${brl(sp)}</div></div><div><span class="text-xs text-slate-500">Restante</span><div class="text-xl font-bold text-amber-600">${brl(sv-sp)}</div></div></div></div></div><div class="card mt-5 overflow-hidden"><div class="p-5"><b>Últimos lançamentos</b></div>${txTable(a.slice().reverse().slice(0,8))}</div>`}
function renderFolders(){folders.innerHTML=`<div class="flex justify-between mb-6"><div><h2 class="text-2xl font-bold">Categorias / Pastas</h2><p class="text-slate-500">Cada pasta pode reunir pagamentos, despesas, receitas e serviços.</p></div><button onclick="openFolder()" class="btn primary">+ Nova pasta</button></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${D.folders.map(f=>{let a=D.transactions.filter(x=>x.folder===f.name),i=sum(a,x=>x.type==='income'),e=sum(a,x=>x.type==='expense'),sv=D.services.filter(x=>x.folder===f.name);return `<div class="card p-5 hover:-translate-y-1 transition cursor-pointer" onclick="folderDetail('${f.id}')"><div class="flex justify-between"><div class="w-11 h-11 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="folder"></i></div><button onclick="event.stopPropagation();delFolder('${f.id}')" class="p-2 text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><h3 class="font-bold text-lg mt-4">${esc(f.name)}</h3><p class="text-xs text-slate-500">${esc(f.desc||'')}</p><div class="grid grid-cols-2 gap-3 mt-5"><div><span class="text-xs text-slate-400">Entradas</span><b class="block text-emerald-600">${brl(i)}</b></div><div><span class="text-xs text-slate-400">Saídas</span><b class="block text-red-600">${brl(e)}</b></div></div><div class="text-xs text-slate-400 mt-4 pt-4 border-t">${a.length} lançamentos • ${sv.length} serviços</div></div>`}).join('')}</div>`}
function folderDetail(id){let f=D.folders.find(x=>x.id===id);document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));folderDetailEl.classList.add('active');title.textContent=f.name;let a=D.transactions.filter(x=>x.folder===f.name),sv=D.services.filter(x=>x.folder===f.name);folderDetailEl.innerHTML=`<button onclick="show('folders')" class="text-blue-600 text-sm mb-4">← Voltar</button><div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">${esc(f.name)}</h2><p class="text-slate-500">${esc(f.desc||'')}</p></div><button onclick="openTx()" class="btn primary">+ Inserir pagamento</button></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Entradas',sum(a,x=>x.type==='income'),'trending-up','text-emerald-600')}${kpi('Saídas',sum(a,x=>x.type==='expense'),'trending-down','text-red-600')}${kpi('Pendentes',sum(a,x=>x.status!=='paid'),'clock','text-amber-600')}${kpi('Lançamentos',a.length,'list-check')}</div><div class="card mt-5 overflow-hidden"><div class="p-5"><b>Pagamentos da pasta</b></div>${txTable(a.slice().reverse())}</div><div class="card p-5 mt-5"><b>Serviços</b><div class="grid md:grid-cols-2 gap-4 mt-4">${sv.map(serviceCard).join('')||'<span class="text-sm text-slate-400">Nenhum serviço.</span>'}</div></div>`;lucide.createIcons()}
function paid(s){return Number(s.paid||0)+D.transactions.filter(x=>x.serviceId===s.id&&x.status==='paid').reduce((a,x)=>a+x.amount,0)}
function serviceInfo(s){let p=paid(s),r=Math.max(0,s.total-p);if(s.billing==='installments'){let n=+s.n||0,v=+s.v||s.total/n||0,c=v?Math.min(n,Math.floor(p/v+1e-6)):0;return `${c} de ${n} parcelas pagas • ${Math.max(0,n-c)} restantes`}if(s.billing==='fixed'){let start=new Date(s.start),end=new Date(s.end),expected=+s.expected|| (s.freq==='weekly'?Math.floor((end-start)/6048e5)+1:Math.max(1,(end.getFullYear()-start.getFullYear())*12+end.getMonth()-start.getMonth()+1)),v=s.total/expected,c=v?Math.min(expected,Math.floor(p/v+1e-6)):0;return `${expected} datas previstas • ${c} pagas • ${Math.max(0,expected-c)} faltantes`}return p>=s.total?'Pagamento concluído':'Pagamento único'}
function serviceCard(s){let p=paid(s),r=Math.max(0,s.total-p),pct=Math.min(100,p/s.total*100||0);return `<div class="border rounded-2xl p-5"><div class="flex justify-between"><div><span class="text-xs text-slate-500">${esc(s.client)}</span><h3 class="font-bold">${esc(s.name)}</h3></div><div><button onclick="editService('${s.id}')" class="p-2"><i data-lucide="pencil" class="w-4"></i></button><button onclick="delService('${s.id}')" class="p-2 text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div></div><div class="grid grid-cols-3 gap-3 mt-5 text-xs"><div>Total<b class="block text-sm">${brl(s.total)}</b></div><div>Pago<b class="block text-sm text-emerald-600">${brl(p)}</b></div><div>Restante<b class="block text-sm text-amber-600">${brl(r)}</b></div></div><div class="bar mt-4"><i style="width:${pct}%;background:#10b981"></i></div><div class="flex justify-between text-xs mt-2"><span>${pct.toFixed(0)}% concluído</span><b>${serviceInfo(s)}</b></div><div class="bg-slate-50 rounded-xl p-3 mt-4 text-xs"><div class="flex justify-between"><span>${s.billing==='installments'?'Prestação / parcelas':s.billing==='fixed'?'Datas fixas':'Pagamento único'}</span><span>${fmt(s.start)} → ${fmt(s.end)}</span></div>${s.billing!=='single'?`<div class="mt-2 font-semibold ${missing(s)>0?'text-red-600':'text-emerald-600'}">${missing(s)>0?'⚠ '+missing(s)+' falta(s)':'✓ Sem faltas registradas'}</div>`:''}</div><button onclick="openPayment('${s.id}')" class="btn soft w-full mt-4">+ Registrar pagamento</button><button onclick="serviceHistory('${s.id}')" class="w-full text-xs text-blue-600 font-semibold mt-3">Ver histórico de pagamentos</button></div>`}
function missing(s){if(s.billing==='single')return 0;let start=new Date(s.start),end=new Date(s.end),n=+s.expected|| (s.freq==='weekly'?Math.floor((end-start)/6048e5)+1:Math.max(1,(end.getFullYear()-start.getFullYear())*12+end.getMonth()-start.getMonth()+1)),v=s.total/n,c=v?Math.min(n,Math.floor(paid(s)/v+1e-6)):0;return Math.max(0,n-c)}
function renderServices(){services.innerHTML=`<div class="flex justify-between mb-6"><div><h2 class="text-2xl font-bold">Serviços</h2><p class="text-slate-500">Controle valor total, pago, restante, parcelas e datas.</p></div><button onclick="openService()" class="btn primary">+ Novo serviço</button></div><div class="grid sm:grid-cols-3 gap-4">${kpi('Total contratado',D.services.reduce((a,x)=>a+x.total,0),'briefcase')}${kpi('Total pago',D.services.reduce((a,x)=>a+paid(x),0),'badge-check','text-emerald-600')}${kpi('Total restante',D.services.reduce((a,x)=>a+Math.max(0,x.total-paid(x)),0),'hourglass','text-amber-600')}</div><div class="grid xl:grid-cols-2 gap-4 mt-5">${D.services.map(serviceCard).join('')}</div>`}
function serviceHistory(id){let s=D.services.find(x=>x.id===id),p=(s.payments||[]).concat(D.transactions.filter(x=>x.serviceId===id).map(x=>({date:x.date,amount:x.amount,method:x.method||'Lançamento'})));alert('HISTÓRICO — '+s.name+'\\n\\n'+(p.length?p.map((x,i)=>`${i+1}. ${fmt(x.date)} — ${brl(x.amount)} — ${x.method||'Pagamento'}`).join('\\n'):'Nenhum pagamento registrado.'))}
function renderTransactions(){transactions.innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Movimentações</h2><p class="text-slate-500">Adicionar, editar, duplicar, excluir e filtrar.</p></div><button onclick="openTx()" class="btn primary">+ Novo</button></div><div class="card overflow-hidden">${txTable(txFiltered().slice().reverse())}</div>`}
function renderReceivables(){let a=D.transactions.filter(x=>x.type==='income'&&x.status!=='paid');receivables.innerHTML=sectionPage('A receber','Entradas pendentes, parciais e vencidas.',a,'income')}
function renderPayables(){let a=D.transactions.filter(x=>x.type==='expense'&&x.status!=='paid');payables.innerHTML=sectionPage('A pagar','Despesas pendentes, parciais e vencidas.',a,'expense')}
function sectionPage(t,d,a,type){return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">${t}</h2><p class="text-slate-500">${d}</p></div><button onclick="openTx('${type}')" class="btn primary">+ Adicionar</button></div><div class="grid sm:grid-cols-3 gap-4 mb-5">${kpi('Em aberto',sum(a),'circle-dollar-sign',type==='income'?'text-emerald-600':'text-red-600')}${kpi('Vencido',sum(a,x=>x.status==='overdue'),'triangle-alert','text-red-600')}${kpi('Quantidade',a.length,'list-check')}</div><div class="card overflow-hidden">${txTable(a.slice().reverse())}</div>`}
function renderAccounts(){accounts.innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Caixas & Contas</h2><p class="text-slate-500">Bancos, caixas e saldos.</p></div><button onclick="addAccount()" class="btn primary">+ Nova conta</button></div><div class="grid md:grid-cols-3 gap-4">${D.accounts.map(a=>`<div class="card p-5"><div class="flex justify-between"><div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="wallet"></i></div><button onclick="delAccount('${a.id}')" class="text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><span class="text-xs text-slate-500 block mt-4">${a.type}</span><b class="text-lg">${esc(a.name)}</b><div class="text-2xl font-bold mt-2">${brl(a.balance)}</div></div>`).join('')}</div>`}
function renderPeople(){people.innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Clientes / Fornecedores</h2><p class="text-slate-500">Cadastre pessoas e empresas para vincular aos lançamentos.</p></div><button onclick="addPerson()" class="btn primary">+ Novo contato</button></div><div class="grid md:grid-cols-3 gap-4">${D.people.map(p=>`<div class="card p-5"><div class="flex justify-between"><div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center"><i data-lucide="user-round"></i></div><button onclick="delPerson('${p.id}')" class="text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><b class="block mt-4">${esc(p.name)}</b><span class="text-xs text-slate-500">${p.kind}</span><div class="text-xs text-slate-400 mt-3">${esc(p.phone||'Sem telefone')} • ${esc(p.email||'Sem e-mail')}</div></div>`).join('')}</div>`}
function renderCards(){cards.innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Cartões</h2><p class="text-slate-500">Limite, utilização e disponível.</p></div><button onclick="addCard()" class="btn primary">+ Novo cartão</button></div><div class="grid md:grid-cols-3 gap-4">${D.cards.map(c=>`<div class="card p-5"><div class="flex justify-between"><i data-lucide="credit-card"></i><button onclick="delCard('${c.id}')" class="text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><b class="block mt-5">${esc(c.name)}</b><span class="text-xs text-slate-500">Limite ${brl(c.limit)}</span><div class="text-2xl font-bold mt-2">${brl(c.used)}</div><div class="bar mt-3"><i style="width:${Math.min(100,c.used/c.limit*100||0)}%;background:#2563eb"></i></div><div class="text-xs text-slate-500 mt-2">Disponível ${brl(Math.max(0,c.limit-c.used))}</div></div>`).join('')}</div>`}
function renderGoals(){goals.innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Metas financeiras</h2><p class="text-slate-500">Acompanhe objetivos e evolução.</p></div><button onclick="addGoal()" class="btn primary">+ Nova meta</button></div><div class="grid md:grid-cols-2 gap-4">${D.goals.map(g=>{let p=Math.min(100,g.current/g.target*100);return `<div class="card p-5"><div class="flex justify-between"><b>${esc(g.name)}</b><button onclick="delGoal('${g.id}')" class="text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><div class="grid grid-cols-3 mt-5 text-sm"><div>Objetivo<b class="block">${brl(g.target)}</b></div><div>Atual<b class="block text-emerald-600">${brl(g.current)}</b></div><div>Restante<b class="block text-amber-600">${brl(Math.max(0,g.target-g.current))}</b></div></div><div class="bar mt-5"><i style="width:${p}%;background:#10b981"></i></div><div class="text-xs text-slate-500 mt-2">${p.toFixed(0)}% • prazo ${fmt(g.date)}</div><button onclick="addToGoal('${g.id}')" class="btn soft mt-4 w-full">+ Adicionar valor</button></div>`}).join('')}</div>`}
function renderCalendar(){let n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate();let cells='';for(let d=1;d<=days;d++){let ds=new Date(y,m,d).toISOString().slice(0,10),a=D.transactions.filter(x=>x.date===ds);cells+=`<div class="border rounded-xl min-h-24 p-2"><b class="text-xs">${d}</b>${a.slice(0,3).map(x=>`<div class="text-[10px] mt-1 rounded px-1 ${x.type==='income'?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'}">${x.type==='income'?'+':'−'}${brl(x.amount)}</div>`).join('')}</div>`}calendar.innerHTML=`<div class="mb-5"><h2 class="text-2xl font-bold">Calendário financeiro</h2><p class="text-slate-500">${n.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</p></div><div class="grid grid-cols-4 sm:grid-cols-7 gap-2">${cells}</div>`}
function renderReports(){let a=txFiltered(),i=sum(a,x=>x.type==='income'),e=sum(a,x=>x.type==='expense');reports.innerHTML=`<div class="mb-5"><h2 class="text-2xl font-bold">Relatórios</h2><p class="text-slate-500">Análise por período.</p></div><div class="grid md:grid-cols-3 gap-4">${kpi('Entradas',i,'trending-up','text-emerald-600')}${kpi('Saídas',e,'trending-down','text-red-600')}${kpi('Resultado',i-e,'sigma')}</div><div class="card p-5 mt-5"><b>Despesas por pasta</b>${D.folders.map(f=>{let v=sum(a,x=>x.type==='expense'&&x.folder===f.name);return `<div class="mt-4"><div class="flex justify-between text-sm"><span>${esc(f.name)}</span><b>${brl(v)}</b></div><div class="bar mt-2"><i style="width:${Math.min(100,v/(e||1)*100)}%;background:#64748b"></i></div></div>`}).join('')}</div>`}
function renderSettings(){settings.innerHTML=`<div class="mb-5"><h2 class="text-2xl font-bold">Configurações</h2><p class="text-slate-500">Base preparada para a conexão com Supabase.</p></div><div class="card p-6 max-w-2xl"><b>Arquitetura futura</b><div class="grid md:grid-cols-2 gap-3 mt-5 text-sm"><div class="p-3 bg-slate-50 rounded-xl"><b>Banco</b><br>Supabase / PostgreSQL</div><div class="p-3 bg-slate-50 rounded-xl"><b>Identificação</b><br>UUID + user_id</div><div class="p-3 bg-slate-50 rounded-xl"><b>Tabelas</b><br>Prefixo fin_</div><div class="p-3 bg-slate-50 rounded-xl"><b>Segurança</b><br>RLS por usuário</div></div></div>`}
function render(){renderOverview();renderFolders();renderServices();renderTransactions();renderReceivables();renderPayables();renderAccounts();renderPeople();renderCards();renderCalendar();renderGoals();renderReports();renderSettings();lucide.createIcons()}
function openTx(type){fill();txForm.reset();txId.value='';txDate.value=today();txType.value=type||'income';txStatus.value='paid';txTitle.textContent=type==='expense'?'Nova saída':'Novo lançamento';openM('txModal')}
function editTx(id){let x=D.transactions.find(a=>a.id===id);openTx(x.type);setTimeout(()=>{txId.value=x.id;txStatus.value=x.status;txDesc.value=x.desc;txAmount.value=x.amount;txDate.value=x.date;txFolder.value=x.folder;txAccount.value=x.account;txPerson.value=x.person||'';txNotes.value=x.notes||'';txTitle.textContent='Editar lançamento'},20)}
txForm.onsubmit=e=>{e.preventDefault();let o={id:txId.value||uid(),type:txType.value,status:txStatus.value,desc:txDesc.value,amount:+txAmount.value,date:txDate.value,folder:txFolder.value,account:txAccount.value,person:txPerson.value,notes:txNotes.value};let i=D.transactions.findIndex(x=>x.id===o.id);i>=0?D.transactions[i]=o:D.transactions.push(o);save();closeM('txModal');render()}
function delTx(id){if(confirm('Excluir este lançamento?')){D.transactions=D.transactions.filter(x=>x.id!==id);save();render()}}
function duplicateTx(id){let x=D.transactions.find(a=>a.id===id);D.transactions.push({...x,id:uid(),desc:x.desc+' (cópia)'});save();render()}
function fill(){txFolder.innerHTML=D.folders.map(x=>`<option>${esc(x.name)}</option>`).join('');txAccount.innerHTML=D.accounts.map(x=>`<option>${esc(x.name)}</option>`).join('');svFolder.innerHTML=D.folders.map(x=>`<option>${esc(x.name)}</option>`).join('')}
function openFolder(){folderForm.reset();openM('folderModal')}folderForm.onsubmit=e=>{e.preventDefault();D.folders.push({id:uid(),name:fdName.value,desc:fdDesc.value,type:fdType.value});save();closeM('folderModal');render()}
function delFolder(id){let f=D.folders.find(x=>x.id===id);if(confirm('Excluir a pasta '+f.name+'? Os lançamentos serão preservados.')){D.folders=D.folders.filter(x=>x.id!==id);save();render()}}
function addAccount(){let n=prompt('Nome da conta/caixa:');if(n){D.accounts.push({id:uid(),name:n,type:'Banco',balance:0});save();render()}}
function delAccount(id){if(confirm('Excluir conta?')){D.accounts=D.accounts.filter(x=>x.id!==id);save();render()}}
function addPerson(){let n=prompt('Nome do cliente/fornecedor:');if(n){let k=prompt('Tipo: Cliente ou Fornecedor','Cliente')||'Cliente';D.people.push({id:uid(),name:n,kind:k});save();render()}}
function delPerson(id){if(confirm('Excluir contato?')){D.people=D.people.filter(x=>x.id!==id);save();render()}}
function addCard(){let n=prompt('Nome do cartão:'),l=Number(prompt('Limite:')||0);if(n){D.cards.push({id:uid(),name:n,limit:l,used:0});save();render()}}
function delCard(id){if(confirm('Excluir cartão?')){D.cards=D.cards.filter(x=>x.id!==id);save();render()}}
function openService(){fill();serviceForm.reset();svId.value='';svStart.value=today();svEnd.value=today();svTitle.textContent='Novo serviço';billingUI();openM('serviceModal')}
function billingUI(){inst.classList.toggle('hidden',svBilling.value!=='installments');fixed.classList.toggle('hidden',svBilling.value!=='fixed')}
serviceForm.onsubmit=e=>{e.preventDefault();let old=D.services.find(x=>x.id===svId.value);let o={id:svId.value||uid(),client:svClient.value,name:svName.value,start:svStart.value,end:svEnd.value,total:+svTotal.value,billing:svBilling.value,n:+svN.value||0,v:+svV.value||0,freq:svFreq.value,day:+svDay.value||0,expected:+svExpected.value||0,folder:svFolder.value,notes:svNotes.value,paid:old?.paid||0,payments:old?.payments||[]};let i=D.services.findIndex(x=>x.id===o.id);i>=0?D.services[i]=o:D.services.push(o);save();closeM('serviceModal');render()}
function editService(id){let s=D.services.find(x=>x.id===id);openService();setTimeout(()=>{svId.value=s.id;svClient.value=s.client;svName.value=s.name;svStart.value=s.start;svEnd.value=s.end;svTotal.value=s.total;svBilling.value=s.billing;svN.value=s.n||'';svV.value=s.v||'';svFreq.value=s.freq||'monthly';svDay.value=s.day||'';svExpected.value=s.expected||'';svFolder.value=s.folder;svNotes.value=s.notes||'';billingUI();svTitle.textContent='Editar serviço'},20)}
function delService(id){if(confirm('Excluir serviço?')){D.services=D.services.filter(x=>x.id!==id);save();render()}}
function openPayment(id){payService.value=id;payDate.value=today();payAmount.value='';openM('payModal')}
payForm.onsubmit=e=>{e.preventDefault();let s=D.services.find(x=>x.id===payService.value),v=+payAmount.value;if(v<=0)return;let p=s.payments||[];p.push({date:payDate.value,amount:v,method:payMethod.value,note:payNote.value});s.payments=p;s.paid=Number(s.paid||0)+v;save();closeM('payModal');render()}
function addGoal(){let n=prompt('Nome da meta:'),t=Number(prompt('Valor objetivo:')||0);if(n&&t)D.goals.push({id:uid(),name:n,target:t,current:0,date:today()});save();render()}
function addToGoal(id){let g=D.goals.find(x=>x.id===id),v=Number(prompt('Valor a adicionar:')||0);if(v>0){g.current+=v;save();render()}}
function delGoal(id){if(confirm('Excluir meta?')){D.goals=D.goals.filter(x=>x.id!==id);save();render()}}
function closeM(id){document.getElementById(id).classList.add('hidden');document.getElementById(id).classList.remove('flex')}
function openM(id){document.getElementById(id).classList.remove('hidden');document.getElementById(id).classList.add('flex');lucide.createIcons()}
function chart(){let c=document.getElementById('chartEl');if(!c)return;if(window.ch)ch.destroy();let labs=[],a=[],b=[],n=new Date();for(let i=5;i>=0;i--){let d=new Date(n.getFullYear(),n.getMonth()-i,1);labs.push(d.toLocaleDateString('pt-BR',{month:'short'}));let z=D.transactions.filter(x=>{let q=new Date(x.date);return q.getMonth()===d.getMonth()&&q.getFullYear()===d.getFullYear()});a.push(sum(z,x=>x.type==='income'));b.push(sum(z,x=>x.type==='expense'))}ch=new Chart(c,{type:'line',data:{labels:labs,datasets:[{label:'Entradas',data:a,tension:.35,borderWidth:3},{label:'Saídas',data:b,tension:.35,borderWidth:3}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}})}
period.onchange=render;navRender();render();
</script></body></html>
