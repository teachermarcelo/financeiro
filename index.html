<head>

<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e4eaf2;--nav:#0b1220;--nav2:#18263d;--blue:#2563eb;--green:#059669;--red:#dc2626;--amber:#d97706;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:258px;position:fixed;inset:0 auto 0 0;background:var(--nav);padding:16px 13px;color:#cbd5e1;z-index:30;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 23px}.logo{width:43px;height:43px;border-radius:13px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px}.brand b{color:#fff;font-size:18px}.brand small{display:block;font-size:9px;letter-spacing:1.5px}.navtitle{font-size:9px;color:#64748b;text-transform:uppercase;margin:14px 10px 5px}.nav{display:block;width:100%;background:transparent;border:0;color:#aebbd0;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:var(--nav2);color:#fff}.main{margin-left:258px;flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}.top h1{font-size:20px;margin:0}.top p{font-size:12px;color:var(--muted);margin:3px 0}.content{padding:27px;max-width:1500px;margin:auto}.page{display:none}.page.active{display:block}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 7px 25px #0f172a0a}.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:25px;font-weight:850;margin-top:7px}.green{color:var(--green)!important}.red{color:var(--red)!important}.amber{color:var(--amber)!important}.blue{color:var(--blue)!important}.purple{color:var(--purple)!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.toolbar h2{margin:0;font-size:23px}.toolbar p{margin:4px 0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#edf2f7;color:#334155;font-weight:750}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.small{padding:7px 9px;font-size:11px}.buttons{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{padding:11px;background:#f8fafc;color:#64748b;font-size:10px;text-transform:uppercase;text-align:left;white-space:nowrap}.table td{padding:12px 11px;border-top:1px solid #edf1f5;font-size:13px;white-space:nowrap}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800}.paid{background:#dcfce7;color:#047857}.pending{background:#fef3c7;color:#a16207}.overdue{background:#fee2e2;color:#b91c1c}.partial{background:#dbeafe;color:#1d4ed8}.cancelled{background:#e5e7eb;color:#4b5563}.foldergrid,.servicegrid,.peoplegrid,.accountgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.icon{width:44px;height:44px;border-radius:12px;background:#eff6ff;color:#2563eb;display:grid;place-items:center}.progress{height:8px;background:#e9eef5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.service-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.service-meta small{color:var(--muted);font-size:10px}.service-meta b{display:block;margin-top:3px;font-size:14px}.empty{text-align:center;padding:40px;color:#94a3b8}.alert{padding:11px 13px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:12px;margin-bottom:14px}.alert.error{background:#fee2e2;color:#991b1b}.modal{display:none;position:fixed;inset:0;background:#02081799;z-index:100;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;width:min(720px,100%);max-height:94vh;overflow:auto}.modalhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modalbody{padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.input{width:100%;padding:10px 11px;border:1px solid #d7e0ea;border-radius:10px;background:#fff;outline:0}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.chart{height:220px;display:flex;align-items:end;gap:10px}.barcol{flex:1;height:100%;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:5px}.bars{height:100%;display:flex;align-items:end;gap:3px}.bar{width:17px;border-radius:5px 5px 0 0;min-height:2px}.bar.in{background:#059669}.bar.out{background:#dc2626}.barcol small{font-size:9px;color:var(--muted)}.mobile{display:none}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.foldergrid,.servicegrid,.peoplegrid,.accountgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.top{padding:0 14px}.content{padding:17px}.g4,.g3,.g2,.foldergrid,.servicegrid,.peoplegrid,.accountgrid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand"><div class="logo">F</div><div><b>FinControl</b><small>PRO FINANCE</small></div></div>
<div class="navtitle">Principal</div>
<button class="nav active" data-page="overview">⌂ &nbsp; Overview</button>
<button class="nav" data-page="transactions">↔ &nbsp; Movimentações</button>
<button class="nav" data-page="receivables">↓ &nbsp; A receber</button>
<button class="nav" data-page="payables">↑ &nbsp; A pagar</button>
<div class="navtitle">Organização</div><button class="nav" data-page="folders">▣ &nbsp; Categorias / Pastas</button><button class="nav" data-page="services">◆ &nbsp; Serviços</button><button class="nav" data-page="people">♙ &nbsp; Clientes / Fornecedores</button>
<div class="navtitle">Contas</div><button class="nav" data-page="accounts">▤ &nbsp; Caixas & Contas</button><button class="nav" data-page="cards">▱ &nbsp; Cartões</button>
<div class="navtitle">Planejamento</div><button class="nav" data-page="calendar">□ &nbsp; Calendário</button><button class="nav" data-page="goals">◎ &nbsp; Metas</button><button class="nav" data-page="reports">▥ &nbsp; Relatórios</button><button class="nav" data-page="settings">⚙ &nbsp; Configurações</button></aside>
<main class="main"><header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobile" id="menu">☰</button><div><h1 id="title">Overview</h1><p id="subtitle">Sua visão financeira</p></div></div><div class="buttons"><select id="period" class="input" style="width:auto"><option value="month">Este mês</option><option value="year">Este ano</option><option value="all">Todos</option></select><button class="btn primary" id="quick">+ Novo lançamento</button></div></header>
<div class="content"><div id="notice" class="alert hidden"></div>
<section id="overview" class="page active"></section><section id="transactions" class="page"></section><section id="receivables" class="page"></section><section id="payables" class="page"></section><section id="folders" class="page"></section><section id="services" class="page"></section><section id="people" class="page"></section><section id="accounts" class="page"></section><section id="cards" class="page"></section><section id="calendar" class="page"></section><section id="goals" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section></div></main></div>

<div class="modal" id="txModal"><div class="modalbox"><div class="modalhead"><b id="txTitle">Novo lançamento</b><button class="btn" data-close="txModal">✕</button></div><form id="txForm" class="modalbody"><input id="txId" type="hidden"><div class="formgrid"><div class="field"><label>Tipo</label><select id="txType" class="input"><option value="income">Entrada</option><option value="expense">Saída</option></select></div><div class="field"><label>Status</label><select id="txStatus" class="input"><option value="paid">Pago / Recebido</option><option value="pending">Pendente</option><option value="overdue">Vencido</option><option value="partial">Parcial</option><option value="cancelled">Cancelado</option></select></div><div class="field full"><label>Descrição *</label><input id="txDesc" class="input" required></div><div class="field"><label>Valor *</label><input id="txAmount" class="input" type="number" min="0" step=".01" required></div><div class="field"><label>Data *</label><input id="txDate" class="input" type="date" required></div><div class="field"><label>Categoria / Pasta</label><select id="txFolder" class="input"></select></div><div class="field"><label>Conta / Caixa</label><select id="txAccount" class="input"></select></div><div class="field full"><label>Cliente / Fornecedor</label><input id="txPerson" class="input"></div><div class="field full"><label>Observações</label><textarea id="txNotes" class="input" rows="3"></textarea></div></div><div class="modalfoot"><button type="button" class="btn" data-close="txModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="folderModal"><div class="modalbox"><div class="modalhead"><b id="folderTitle">Nova pasta</b><button class="btn" data-close="folderModal">✕</button></div><form id="folderForm" class="modalbody"><input id="folderId" type="hidden"><div class="field"><label>Nome *</label><input id="folderName" class="input" required></div><div class="field"><label>Descrição</label><textarea id="folderDesc" class="input"></textarea></div><div class="field"><label>Tipo</label><select id="folderType" class="input"><option value="both">Entradas e saídas</option><option value="income">Receitas</option><option value="expense">Despesas</option></select></div><div class="modalfoot"><button type="button" class="btn" data-close="folderModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="serviceModal"><div class="modalbox"><div class="modalhead"><b id="serviceTitle">Novo serviço</b><button class="btn" data-close="serviceModal">✕</button></div><form id="serviceForm" class="modalbody"><input id="serviceId" type="hidden"><div class="formgrid"><div class="field"><label>Cliente *</label><input id="serviceClient" class="input" required></div><div class="field"><label>Serviço *</label><input id="serviceName" class="input" required></div><div class="field"><label>Data inicial *</label><input id="serviceStart" class="input" type="date" required></div><div class="field"><label>Data final *</label><input id="serviceEnd" class="input" type="date" required></div><div class="field"><label>Valor total *</label><input id="serviceTotal" class="input" type="number" min="0" step=".01" required></div><div class="field"><label>Categoria / Pasta</label><select id="serviceFolder" class="input"></select></div><div class="field"><label>Modelo de cobrança</label><select id="serviceBilling" class="input"><option value="single">Pagamento único</option><option value="installments">Parcelado</option><option value="fixed">Datas fixas</option></select></div><div class="field"><label>Nº parcelas / datas</label><input id="serviceN" class="input" type="number" min="1"></div><div class="field"><label>Valor da parcela</label><input id="serviceV" class="input" type="number" min="0" step=".01"></div><div class="field"><label>Periodicidade</label><select id="serviceFreq" class="input"><option value="monthly">Mensal</option><option value="weekly">Semanal</option></select></div><div class="field"><label>Dia fixo</label><input id="serviceDay" class="input" type="number" min="1" max="31"></div><div class="field full"><label>Observações</label><textarea id="serviceNotes" class="input"></textarea></div></div><div class="modalfoot"><button type="button" class="btn" data-close="serviceModal">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>

<div class="modal" id="paymentModal"><div class="modalbox"><div class="modalhead"><div><b>Registrar pagamento</b><div id="paymentName" style="font-size:11px;color:#718096"></div></div><button class="btn" data-close="paymentModal">✕</button></div><form id="paymentForm" class="modalbody"><input id="paymentServiceId" type="hidden"><div class="field"><label>Valor *</label><input id="paymentAmount" class="input" type="number" min=".01" step=".01" required></div><div class="field"><label>Data *</label><input id="paymentDate" class="input" type="date" required></div><div class="field"><label>Forma</label><select id="paymentMethod" class="input"><option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option><option>Boleto</option><option>Outro</option></select></div><div class="field"><label>Observação</label><input id="paymentNote" class="input"></div><div class="modalfoot"><button type="button" class="btn" data-close="paymentModal">Cancelar</button><button class="btn primary">Registrar</button></div></form></div></div>

<script>
"use strict";
const SUPABASE_URL="https://rvgcniaowzmsudzliozf.supabase.co";
const SUPABASE_KEY="sb_publishable_N_xCS0lbbTvG7qWTpAw0ag_vlg1lbHb";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>{let x=Number(String(n??0).replace(",", "."));return Number.isFinite(x)?x:0};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const dateBR=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
let user=null, data={folders:[],accounts:[],people:[],cards:[],transactions:[],services:[],goals:[],payments:[]};

function notice(t,error=false){$("notice").textContent=t;$("notice").className="alert"+(error?" error":"");}
function clearNotice(){$("notice").classList.add("hidden")}
function badge(s){const m={paid:["Pago/Recebido","paid"],pending:["Pendente","pending"],overdue:["Vencido","overdue"],partial:["Parcial","partial"],cancelled:["Cancelado","cancelled"]},z=m[s]||m.pending;return '<span class="badge '+z[1]+'">'+z[0]+"</span>"}
function sum(a,fn){return a.reduce((s,x)=>s+num(fn?fn(x):x.amount),0)}
function pick(o,...keys){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return null}
function txDate(x){return pick(x,"transaction_date","date","due_date")||today()}
function txType(x){return pick(x,"type","transaction_type")||"expense"}
function txDesc(x){return pick(x,"description","desc","title")||"Lançamento"}
function txAmount(x){return num(pick(x,"amount","value")||0)}
function folderOf(x){return pick(x,"folder_name","category_name","folder","category")||"—"}
function accountOf(x){return pick(x,"account_name","account")||"—"}

async function ensureSession(){
 // Não há tela de login. O Supabase Anonymous Auth cria uma sessão técnica
 // para que auth.uid() e as políticas RLS possam proteger os registros.
 let {data:s,error}=await sb.auth.getSession();
 if(error)throw error;
 if(!s.session){
  const r=await sb.auth.signInAnonymously();
  if(r.error)throw new Error("Ative o Anonymous Sign-Ins em Supabase > Authentication > Providers. Detalhe: "+r.error.message);
  s=r.data;
 }
 user=s.session.user;
}

async function get(table){
 const r=await sb.from(table).select("*").order("created_at",{ascending:false});
 if(r.error)throw new Error(table+": "+r.error.message);
 return r.data||[];
}
async function load(){
 clearNotice();
 try{
  await ensureSession();
  const [folders,accounts,people,cards,transactions,services,goals,payments]=await Promise.all([
   get("fin_folders"),get("fin_accounts"),get("fin_people"),get("fin_cards"),
   get("fin_transactions"),get("fin_services"),get("fin_goals"),get("fin_service_payments")
  ]);
  data={folders,accounts,people,cards,transactions,services,goals,payments};
  renderAll();
 }catch(e){notice(e.message,true)}
}
function periodTx(){const p=$("period").value,n=new Date();return data.transactions.filter(x=>{if(p==="all")return true;const d=new Date(txDate(x)+"T12:00:00");return p==="year"?d.getFullYear()===n.getFullYear():d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()})}
function kpi(t,v,c){return '<div class="card kpi"><div class="label">'+t+'</div><div class="value '+c+'">'+money(v)+'</div></div>'}
function txTable(a){
 if(!a.length)return '<div class="empty">Nenhum lançamento encontrado.</div>';
 return '<div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Conta</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+
 a.map(x=>'<tr><td>'+dateBR(txDate(x))+'</td><td><b>'+esc(txDesc(x))+'</b></td><td>'+ (txType(x)==="income"?"Entrada":"Saída")+'</td><td>'+esc(folderOf(x))+'</td><td>'+esc(accountOf(x))+'</td><td class="'+(txType(x)==="income"?"green":"red")+'"><b>'+(txType(x)==="income"?"+":"−")+money(txAmount(x))+'</b></td><td>'+badge(x.status)+'</td><td><button class="btn small" data-action="edit-tx" data-id="'+x.id+'">Editar</button> <button class="btn small" data-action="duplicate-tx" data-id="'+x.id+'">Duplicar</button> <button class="btn small danger" data-action="delete-tx" data-id="'+x.id+'">Excluir</button></td></tr>').join("")+"</tbody></table></div>";
}
function renderOverview(){const a=periodTx(),i=sum(a,x=>txType(x)==="income"?txAmount(x):0),o=sum(a,x=>txType(x)==="expense"?txAmount(x):0),open=sum(a,x=>!["paid","cancelled"].includes(x.status)?txAmount(x):0);$("overview").innerHTML='<div class="grid g4">'+kpi("Saldo do período",i-o,"blue")+kpi("Entradas",i,"green")+kpi("Saídas",o,"red")+kpi("Em aberto",open,"amber")+'</div><div class="grid g2" style="margin-top:16px"><div class="card"><b>Fluxo dos últimos 6 meses</b>'+chart()+'</div><div class="card"><b>Resumo</b>'+["Serviços|"+data.services.length,"Clientes / fornecedores|"+data.people.length,"Contas / caixas|"+data.accounts.length,"Cartões|"+data.cards.length].map(x=>{let q=x.split("|");return '<div style="padding:11px 0;border-bottom:1px solid #edf1f5;font-size:13px">'+q[0]+'<b style="float:right">'+q[1]+"</b></div>"}).join("")+'</div></div><div class="card" style="margin-top:16px"><div class="toolbar"><div><b>Últimos lançamentos</b><p>Dados reais do Supabase.</p></div><button class="btn primary" data-action="new-tx">+ Novo</button></div>'+txTable(a.slice().reverse().slice(0,8))+'</div>'}
function chart(){const n=new Date(),arr=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),z=data.transactions.filter(x=>{const q=new Date(txDate(x)+"T12:00:00");return q.getFullYear()===d.getFullYear()&&q.getMonth()===d.getMonth()});arr.push({l:d.toLocaleDateString("pt-BR",{month:"short"}),i:sum(z,x=>txType(x)==="income"?txAmount(x):0),o:sum(z,x=>txType(x)==="expense"?txAmount(x):0)})}const mx=Math.max(1,...arr.flatMap(x=>[x.i,x.o]));return '<div class="chart">'+arr.map(x=>'<div class="barcol"><div class="bars"><div class="bar in" style="height:'+Math.max(2,x.i/mx*170)+'px"></div><div class="bar out" style="height:'+Math.max(2,x.o/mx*170)+'px"></div></div><small>'+x.l+'</small></div>').join("")+"</div>"}
function renderTransactions(){$("transactions").innerHTML='<div class="toolbar"><div><h2>Movimentações</h2><p>CRUD completo no banco.</p></div><button class="btn primary" data-action="new-tx">+ Novo lançamento</button></div><div class="card">'+txTable(periodTx().slice().reverse())+"</div>"}
function renderOpen(type){const a=data.transactions.filter(x=>txType(x)===type&&!["paid","cancelled"].includes(x.status)),r=$(type==="income"?"receivables":"payables"),t=type==="income"?"A receber":"A pagar";r.innerHTML='<div class="toolbar"><div><h2>'+t+'</h2><p>Valores pendentes.</p></div><button class="btn primary" data-action="new-tx" data-type="'+type+'">+ Adicionar</button></div><div class="grid g3">'+kpi("Total em aberto",sum(a,x=>txAmount(x)),type==="income"?"green":"red")+kpi("Vencido",sum(a,x=>x.status==="overdue"?txAmount(x):0),"red")+kpi("Quantidade",a.length,"blue")+'</div><div class="card" style="margin-top:16px">'+txTable(a)+'</div>'}
function renderFolders(){$("folders").innerHTML='<div class="toolbar"><div><h2>Categorias / Pastas</h2><p>Organize suas finanças.</p></div><button class="btn primary" data-action="new-folder">+ Nova pasta</button></div><div class="foldergrid">'+data.folders.map(f=>{const a=data.transactions.filter(x=>folderOf(x)===f.name);return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="icon">▣</div><div><button class="btn small" data-action="edit-folder" data-id="'+f.id+'">Editar</button> <button class="btn small danger" data-action="delete-folder" data-id="'+f.id+'">Excluir</button></div></div><h3>'+esc(f.name)+'</h3><p style="font-size:12px;color:#718096">'+esc(f.description||"")+'</p><div class="grid g2"><div><small>Entradas</small><b class="green" style="display:block">'+money(sum(a,x=>txType(x)==="income"?txAmount(x):0))+'</b></div><div><small>Saídas</small><b class="red" style="display:block">'+money(sum(a,x=>txType(x)==="expense"?txAmount(x):0))+'</b></div></div><button class="btn" style="width:100%;margin-top:12px" data-action="open-folder" data-id="'+f.id+'">Abrir pasta</button></div>'}).join("")+'</div>'}
function folderDetail(i){const f=data.folders.find(x=>x.id===i);if(!f)return;const a=data.transactions.filter(x=>folderOf(x)===f.name);$("folders").innerHTML='<div class="toolbar"><div><h2>'+esc(f.name)+'</h2><p>'+esc(f.description||"")+'</p></div><div class="buttons"><button class="btn" data-action="back-folders">← Voltar</button><button class="btn primary" data-action="new-tx">+ Inserir</button></div></div><div class="grid g4">'+kpi("Entradas",sum(a,x=>txType(x)==="income"?txAmount(x):0),"green")+kpi("Saídas",sum(a,x=>txType(x)==="expense"?txAmount(x):0),"red")+kpi("Em aberto",sum(a,x=>!["paid","cancelled"].includes(x.status)?txAmount(x):0),"amber")+kpi("Lançamentos",a.length,"purple")+'</div><div class="card" style="margin-top:16px"><b>Lançamentos da pasta</b>'+txTable(a.slice().reverse())+'</div>'}
function paidFor(s){return sum(data.payments.filter(p=>p.service_id===s.id),x=>num(x.amount))}
function renderServices(){const total=sum(data.services,x=>num(pick(x,"total_amount","total","value")||0)),paid=sum(data.services,x=>paidFor(x));$("services").innerHTML='<div class="toolbar"><div><h2>Serviços</h2><p>Total, pago, restante, parcelas e recebimentos.</p></div><button class="btn primary" data-action="new-service">+ Novo serviço</button></div><div class="grid g3">'+kpi("Total contratado",total,"blue")+kpi("Total recebido",paid,"green")+kpi("Total restante",Math.max(0,total-paid),"amber")+'</div><div class="servicegrid" style="margin-top:16px">'+data.services.map(s=>{const total=num(pick(s,"total_amount","total","value")||0),p=paidFor(s),r=Math.max(0,total-p),pct=total?Math.min(100,p/total*100):0,n=num(pick(s,"installment_count","n")||0),v=num(pick(s,"installment_amount","v")||0),pn=n&&v?Math.min(n,Math.floor(p/v+1e-8)):p>=total?1:0;return '<div class="card"><div style="display:flex;justify-content:space-between"><div><span style="font-size:11px;color:#718096">'+esc(pick(s,"client_name","client")||"Cliente")+'</span><h3>'+esc(pick(s,"name","service_name")||"Serviço")+'</h3></div><div><button class="btn small" data-action="edit-service" data-id="'+s.id+'">Editar</button> <button class="btn small danger" data-action="delete-service" data-id="'+s.id+'">Excluir</button></div></div><div class="service-meta"><div><small>Total</small><b>'+money(total)+'</b></div><div><small>Pago</small><b class="green">'+money(p)+'</b></div><div><small>Restante</small><b class="amber">'+money(r)+'</b></div></div><div class="progress"><span style="width:'+pct+'%"></span></div><div style="display:flex;justify-content:space-between;font-size:10px;margin-top:6px"><span>'+pct.toFixed(0)+'% recebido</span><b class="'+(n&&pn<n?"red":"green")+'">'+(n?(pn+" de "+n+" parcelas"):p>=total?"Concluído":"Pendente")+'</b></div><div style="font-size:11px;color:#718096;margin-top:10px">'+dateBR(pick(s,"start_date","start"))+' → '+dateBR(pick(s,"end_date","end"))+'</div><button class="btn" style="width:100%;margin-top:13px" data-action="payment" data-id="'+s.id+'">+ Registrar pagamento</button></div>'}).join("")+'</div>'}
function renderPeople(){$("people").innerHTML='<div class="toolbar"><div><h2>Clientes / Fornecedores</h2><p>Cadastros.</p></div><button class="btn primary" data-action="new-person">+ Novo contato</button></div><div class="peoplegrid">'+data.people.map(p=>'<div class="card"><div style="display:flex;justify-content:space-between"><div class="icon">♙</div><button class="btn small danger" data-action="delete-person" data-id="'+p.id+'">Excluir</button></div><h3>'+esc(p.name||p.full_name||"Contato")+'</h3><span class="badge partial">'+esc(p.type||p.kind||"Cliente")+'</span><p style="font-size:12px;color:#718096">'+esc(p.phone||"Sem telefone")+'<br>'+esc(p.email||"Sem e-mail")+'</p></div>').join("")+'</div>'}
function renderAccounts(){$("accounts").innerHTML='<div class="toolbar"><div><h2>Caixas & Contas</h2><p>Saldo calculado pelos lançamentos pagos.</p></div><button class="btn primary" data-action="new-account">+ Nova conta</button></div><div class="accountgrid">'+data.accounts.map(a=>{const tx=data.transactions.filter(x=>accountOf(x)===(a.name||a.account_name)&&x.status==="paid"),bal=num(pick(a,"balance","initial_balance","initial")||0)+sum(tx,x=>txType(x)==="income"?txAmount(x):-txAmount(x));return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="icon">▤</div><button class="btn small danger" data-action="delete-account" data-id="'+a.id+'">Excluir</button></div><h3>'+esc(a.name||a.account_name)+'</h3><div style="font-size:23px;font-weight:850">'+money(bal)+'</div><p style="font-size:11px;color:#718096">'+esc(a.type||a.account_type||"Conta")+'</p></div>'}).join("")+'</div>'}
function renderCards(){$("cards").innerHTML='<div class="toolbar"><div><h2>Cartões</h2><p>Limite e utilização.</p></div><button class="btn primary" data-action="new-card">+ Novo cartão</button></div><div class="accountgrid">'+data.cards.map(c=>{const l=num(pick(c,"credit_limit","limit")||0),u=num(pick(c,"used_amount","used")||0),p=l?u/l*100:0;return '<div class="card"><div style="display:flex;justify-content:space-between"><div class="icon">▱</div><button class="btn small danger" data-action="delete-card" data-id="'+c.id+'">Excluir</button></div><h3>'+esc(c.name||c.card_name)+'</h3><p style="font-size:11px;color:#718096">Limite</p><b>'+money(l)+'</b><p style="font-size:11px;color:#718096;margin-bottom:3px">Utilizado</p><b class="red">'+money(u)+'</b><div class="progress" style="margin-top:10px"><span style="width:'+Math.min(100,p)+'%;background:#2563eb"></span></div><small>Disponível '+money(Math.max(0,l-u))+'</small></div>'}).join("")+'</div>'}
function renderCalendar(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();let h="";for(let i=0;i<first;i++)h+="<div></div>";for(let d=1;d<=days;d++){const ds=new Date(y,m,d).toISOString().slice(0,10),a=data.transactions.filter(x=>txDate(x)===ds);h+='<div class="card" style="min-height:95px;padding:8px"><b style="font-size:11px">'+d+'</b>'+a.map(x=>'<div style="font-size:9px;margin-top:5px;color:'+(txType(x)==="income"?"#059669":"#dc2626")+'">'+(txType(x)==="income"?"+":"−")+money(txAmount(x))+'</div>').join("")+"</div>"}$("calendar").innerHTML='<div class="toolbar"><div><h2>Calendário financeiro</h2><p>'+n.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</p></div></div><div class="grid" style="grid-template-columns:repeat(7,1fr)">'+h+"</div>"}
function renderGoals(){$("goals").innerHTML='<div class="toolbar"><div><h2>Metas financeiras</h2><p>Objetivos e progresso.</p></div><button class="btn primary" data-action="new-goal">+ Nova meta</button></div><div class="grid g2">'+data.goals.map(g=>{const t=num(pick(g,"target_amount","target")||0),c=num(pick(g,"current_amount","current")||0),p=t?Math.min(100,c/t*100):0;return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+esc(g.name||g.title)+'</b><button class="btn small danger" data-action="delete-goal" data-id="'+g.id+'">Excluir</button></div><div style="font-size:20px;font-weight:800;margin-top:13px">'+money(c)+' <span style="font-size:12px;color:#718096">de '+money(t)+'</span></div><div class="progress" style="margin-top:10px"><span style="width:'+p+'%"></span></div><small>'+p.toFixed(0)+'% • prazo '+dateBR(pick(g,"target_date","date"))+'</small><button class="btn" style="width:100%;margin-top:12px" data-action="goal-add" data-id="'+g.id+'">+ Adicionar valor</button></div>'}).join("")+'</div>'}
function renderReports(){const a=periodTx(),i=sum(a,x=>txType(x)==="income"?txAmount(x):0),o=sum(a,x=>txType(x)==="expense"?txAmount(x):0);$("reports").innerHTML='<div class="toolbar"><div><h2>Relatórios</h2><p>Período selecionado.</p></div><button class="btn" data-action="csv">Exportar CSV</button></div><div class="grid g4">'+kpi("Entradas",i,"green")+kpi("Saídas",o,"red")+kpi("Resultado",i-o,"blue")+kpi("Lançamentos",a.length,"purple")+'</div><div class="card" style="margin-top:16px">'+txTable(a.slice().reverse())+'</div>'}
function renderSettings(){$("settings").innerHTML='<div class="toolbar"><div><h2>Configurações</h2><p>Conexão atual.</p></div></div><div class="grid g2"><div class="card"><h3>Banco de dados</h3><p style="font-size:12px;color:#718096">FinControl está usando Supabase como banco e Supabase Anonymous Auth para proteger os registros sem mostrar uma tela de login.</p><div class="alert">Sessão técnica ativa • RLS aplicado por usuário</div></div><div class="card"><h3>Backup</h3><p style="font-size:12px;color:#718096">Exporta os dados carregados.</p><button class="btn primary" data-action="backup">Baixar JSON</button></div></div>'}
function renderAll(){renderOverview();renderTransactions();renderOpen("income");renderOpen("expense");renderFolders();renderServices();renderPeople();renderAccounts();renderCards();renderCalendar();renderGoals();renderReports();renderSettings()}
function fill(){ $("txFolder").innerHTML='<option value="">Sem categoria</option>'+data.folders.map(f=>'<option>'+esc(f.name)+'</option>').join("");$("txAccount").innerHTML='<option value="">Sem conta</option>'+data.accounts.map(a=>'<option>'+esc(a.name||a.account_name)+'</option>').join("");$("serviceFolder").innerHTML='<option value="">Sem categoria</option>'+data.folders.map(f=>'<option>'+esc(f.name)+'</option>').join("")}
async function txModal(i,type){fill();$("txForm").reset();$("txId").value=i||"";$("txDate").value=today();$("txType").value=type||"income";$("txStatus").value="paid";if(i){const x=data.transactions.find(a=>a.id===i);$("txType").value=txType(x);$("txStatus").value=x.status;$("txDesc").value=txDesc(x);$("txAmount").value=txAmount(x);$("txDate").value=txDate(x);$("txFolder").value=folderOf(x)==="—"?"":folderOf(x);$("txAccount").value=accountOf(x)==="—"?"":accountOf(x);$("txPerson").value=pick(x,"person_name","person")||"";$("txNotes").value=x.notes||"";$("txTitle").textContent="Editar lançamento"}else $("txTitle").textContent="Novo lançamento";$("txModal").classList.add("open")}
async function saveTx(){const o={user_id:user.id,type:$("txType").value,status:$("txStatus").value,description:$("txDesc").value.trim(),amount:num($("txAmount").value),transaction_date:$("txDate").value,folder_name:$("txFolder").value||null,account_name:$("txAccount").value||null,person_name:$("txPerson").value.trim()||null,notes:$("txNotes").value.trim()};const id=$("txId").value;let r=id?await sb.from("fin_transactions").update(o).eq("id",id).eq("user_id",user.id):await sb.from("fin_transactions").insert(o);if(r.error){notice("Erro ao salvar: "+r.error.message,true);return}close("txModal");await load()}
async function saveFolder(){const o={user_id:user.id,name:$("folderName").value.trim(),description:$("folderDesc").value.trim(),type:$("folderType").value},id=$("folderId").value,r=id?await sb.from("fin_folders").update(o).eq("id",id).eq("user_id",user.id):await sb.from("fin_folders").insert(o);if(r.error)notice("Erro: "+r.error.message,true);else{close("folderModal");load()}}
async function serviceModal(i){fill();$("serviceForm").reset();$("serviceId").value=i||"";$("serviceStart").value=today();$("serviceEnd").value=today();if(i){const s=data.services.find(x=>x.id===i);$("serviceClient").value=pick(s,"client_name","client")||"";$("serviceName").value=pick(s,"name","service_name")||"";$("serviceStart").value=pick(s,"start_date","start")||today();$("serviceEnd").value=pick(s,"end_date","end")||today();$("serviceTotal").value=pick(s,"total_amount","total","value")||0;$("serviceBilling").value=pick(s,"billing_type","billing")||"single";$("serviceN").value=pick(s,"installment_count","n")||"";$("serviceV").value=pick(s,"installment_amount","v")||"";$("serviceFreq").value=pick(s,"frequency","freq")||"monthly";$("serviceDay").value=pick(s,"fixed_day","day")||"";$("serviceFolder").value=pick(s,"folder_name","folder")||"";$("serviceNotes").value=s.notes||"";$("serviceTitle").textContent="Editar serviço"}else $("serviceTitle").textContent="Novo serviço";$("serviceModal").classList.add("open")}
async function saveService(){const o={user_id:user.id,client_name:$("serviceClient").value.trim(),name:$("serviceName").value.trim(),start_date:$("serviceStart").value,end_date:$("serviceEnd").value,total_amount:num($("serviceTotal").value),billing_type:$("serviceBilling").value,installment_count:num($("serviceN").value)||null,installment_amount:num($("serviceV").value)||null,frequency:$("serviceFreq").value,fixed_day:num($("serviceDay").value)||null,folder_name:$("serviceFolder").value||null,notes:$("serviceNotes").value.trim()},id=$("serviceId").value,r=id?await sb.from("fin_services").update(o).eq("id",id).eq("user_id",user.id):await sb.from("fin_services").insert(o);if(r.error)notice("Erro no serviço: "+r.error.message,true);else{close("serviceModal");load()}}
async function paymentModal(i){const s=data.services.find(x=>x.id===i);$("paymentForm").reset();$("paymentServiceId").value=i;$("paymentDate").value=today();$("paymentAmount").value=s&&pick(s,"billing_type","billing")==="installments"?pick(s,"installment_amount","v")||"":"";$("paymentName").textContent=s?(pick(s,"client_name","client")||"")+" • "+(pick(s,"name","service_name")||""):"";$("paymentModal").classList.add("open")}
async function savePayment(){const o={user_id:user.id,service_id:$("paymentServiceId").value,amount:num($("paymentAmount").value),payment_date:$("paymentDate").value,payment_method:$("paymentMethod").value,notes:$("paymentNote").value.trim()},r=await sb.from("fin_service_payments").insert(o);if(r.error)notice("Erro no pagamento: "+r.error.message,true);else{close("paymentModal");load()}}
async function del(table,id){if(!confirm("Excluir este registro?"))return;const r=await sb.from(table).delete().eq("id",id).eq("user_id",user.id);if(r.error)notice("Erro: "+r.error.message,true);else load()}
function duplicate(i){const x=data.transactions.find(a=>a.id===i);if(!x)return;delete x.id; x.description=txDesc(x)+" (cópia)";x.user_id=user.id;delete x.created_at;sb.from("fin_transactions").insert(x).then(r=>{if(r.error)notice(r.error.message,true);else load()})}
function close(id){$(id).classList.remove("open")}
function csv(){const rows=[["Data","Tipo","Descrição","Categoria","Conta","Valor","Status"],...data.transactions.map(x=>[txDate(x),txType(x),txDesc(x),folderOf(x),accountOf(x),txAmount(x).toFixed(2).replace(".",","),x.status])];const b=new Blob(["\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n")],{type:"text/csv"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="fincontrol.csv";a.click();URL.revokeObjectURL(u)}
function backup(){const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="fincontrol_backup.json";a.click();URL.revokeObjectURL(u)}
function addSimple(kind){let table,o,n=prompt(kind==="person"?"Nome do cliente/fornecedor:":kind==="account"?"Nome da conta/caixa:":kind==="card"?"Nome do cartão:":"Nome da meta:");if(!n)return;if(kind==="person"){table="fin_people";o={user_id:user.id,name:n,type:prompt("Tipo","Cliente")||"Cliente"}}else if(kind==="account"){table="fin_accounts";o={user_id:user.id,name:n,type:"Banco",balance:num(prompt("Saldo inicial","0"))}}else if(kind==="card"){table="fin_cards";o={user_id:user.id,name:n,credit_limit:num(prompt("Limite","0")),used_amount:0}}else{table="fin_goals";o={user_id:user.id,name:n,target_amount:num(prompt("Valor objetivo","0")),current_amount:0,target_date:prompt("Prazo",today())||today()}}sb.from(table).insert(o).then(r=>{if(r.error)notice(r.error.message,true);else load()})}
document.addEventListener("click",e=>{const n=e.target.closest(".nav");if(n){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(n.dataset.page).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x===n));const names={overview:["Overview","Sua visão financeira"],transactions:["Movimentações","Entradas, saídas e pagamentos"],receivables:["A receber","Valores pendentes"],payables:["A pagar","Contas pendentes"],folders:["Categorias / Pastas","Organização"],services:["Serviços","Contratos e recebimentos"],people:["Clientes / Fornecedores","Cadastros"],accounts:["Caixas & Contas","Bancos e caixa"],cards:["Cartões","Limites"],calendar:["Calendário","Visão por datas"],goals:["Metas","Objetivos"],reports:["Relatórios","Análises"],settings:["Configurações","Sistema"]};$("title").textContent=names[n.dataset.page][0];$("subtitle").textContent=names[n.dataset.page][1];return}const c=e.target.closest("[data-close]");if(c){close(c.dataset.close);return}const a=e.target.closest("[data-action]");if(!a)return;const ac=a.dataset.action,i=a.dataset.id;if(ac==="new-tx")txModal("",a.dataset.type||"income");else if(ac==="edit-tx")txModal(i);else if(ac==="delete-tx")del("fin_transactions",i);else if(ac==="duplicate-tx")duplicate(i);else if(ac==="new-folder")openFolderForm();else if(ac==="edit-folder")openFolderForm(i);else if(ac==="delete-folder")del("fin_folders",i);else if(ac==="open-folder")folderDetail(i);else if(ac==="back-folders")renderFolders();else if(ac==="new-service")serviceModal();else if(ac==="edit-service")serviceModal(i);else if(ac==="delete-service")del("fin_services",i);else if(ac==="payment")paymentModal(i);else if(ac==="new-person")addSimple("person");else if(ac==="delete-person")del("fin_people",i);else if(ac==="new-account")addSimple("account");else if(ac==="delete-account")del("fin_accounts",i);else if(ac==="new-card")addSimple("card");else if(ac==="delete-card")del("fin_cards",i);else if(ac==="new-goal")addSimple("goal");else if(ac==="delete-goal")del("fin_goals",i);else if(ac==="goal-add"){let g=data.goals.find(x=>x.id===i),v=num(prompt("Valor a adicionar","0"));if(g&&v>0){let field=g.current_amount!==undefined?"current_amount":"current";let r={};r[field]=num(g[field])+v;sb.from("fin_goals").update(r).eq("id",i).eq("user_id",user.id).then(()=>load())}}else if(ac==="csv")csv();else if(ac==="backup")backup()});
function openFolderForm(i){$("folderForm").reset();$("folderId").value=i||"";if(i){const f=data.folders.find(x=>x.id===i);$("folderName").value=f.name;$("folderDesc").value=f.description||"";$("folderType").value=f.type||"both";$("folderTitle").textContent="Editar pasta"}else $("folderTitle").textContent="Nova pasta";$("folderModal").classList.add("open")}
$("txForm").onsubmit=e=>{e.preventDefault();saveTx()};$("folderForm").onsubmit=e=>{e.preventDefault();saveFolder()};$("serviceForm").onsubmit=e=>{e.preventDefault();saveService()};$("paymentForm").onsubmit=e=>{e.preventDefault();savePayment()};
$("quick").onclick=()=>txModal("","income");$("period").onchange=renderAll;$("menu").onclick=()=>$("side").classList.toggle("open");
load();
</script>
