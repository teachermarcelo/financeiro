<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinControl Pro — Gestão Financeira</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fc;color:#172033}
.sidebar{background:#0b1220}.nav{color:#aab5c7}.nav.active,.nav:hover{background:#18243a;color:#fff}.card{background:#fff;border:1px solid #e6eaf1;border-radius:18px;box-shadow:0 5px 22px rgba(15,23,42,.045)}
.btn{border-radius:11px;padding:.65rem .9rem;font-weight:650;font-size:.875rem}.primary{background:#2563eb;color:white}.primary:hover{background:#1d4ed8}.soft{background:#eef3ff;color:#2454c6}.danger{color:#dc3545}.input{width:100%;border:1px solid #dce2eb;border-radius:11px;padding:.7rem .8rem;background:white}.input:focus{border-color:#6b8cff;box-shadow:0 0 0 3px #dbe5ff}.modal-bg{background:rgba(2,8,23,.58);backdrop-filter:blur(5px)}.tab{display:none}.tab.active{display:block}.money{font-variant-numeric:tabular-nums}.badge{display:inline-flex;padding:.28rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700}.table th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:#718096;text-align:left;padding:.85rem 1rem;background:#f8fafc}.table td{padding:.9rem 1rem;border-top:1px solid #edf0f5;font-size:.86rem}.progress{height:8px;background:#edf1f7;border-radius:20px;overflow:hidden}.progress>div{height:100%;border-radius:20px}.folder{transition:.2s}.folder:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(15,23,42,.08)}@media(max-width:900px){.sidebar{width:76px}.brand,.navtext,.side-bottom{display:none}.main{margin-left:76px}}@media(max-width:650px){.sidebar{display:none}.main{margin-left:0}.mobile{display:flex}.desktop{display:none}}
</style>
</head>
<body>
<aside class="sidebar fixed left-0 top-0 bottom-0 w-64 z-40 text-white p-4">
  <div class="brand flex items-center gap-3 px-2 h-14 mb-5"><div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-black">F</div><div><b class="text-lg">FinControl</b><div class="text-[10px] text-slate-400 tracking-widest">PRO FINANCE</div></div></div>
  <nav id="nav" class="space-y-1"></nav>
  <div class="side-bottom absolute bottom-5 left-4 right-4 rounded-xl bg-white/5 p-3"><div class="text-[10px] text-slate-400">ARMAZENAMENTO</div><div class="text-sm mt-1">Demonstração local</div><div class="text-[10px] text-slate-500 mt-1">Estrutura pronta para Supabase</div></div>
</aside>
<main class="main ml-64 min-h-screen">
<header class="h-16 sticky top-0 z-30 bg-white/90 backdrop-blur border-b px-5 md:px-8 flex items-center justify-between">
  <div><h1 id="title" class="font-bold text-xl">Overview</h1><p id="subtitle" class="text-xs text-slate-500">Visão geral das suas finanças</p></div>
  <div class="flex gap-2 items-center"><select id="period" class="desktop input !w-auto !py-2"><option value="month">Este mês</option><option value="year">Este ano</option><option value="all">Todos</option></select><button onclick="openTx()" class="btn primary flex gap-2 items-center"><i data-lucide="plus" class="w-4"></i><span>Novo lançamento</span></button></div>
</header>
<section class="p-5 md:p-8">
<div id="overview" class="tab active"></div>
<div id="folders" class="tab"></div>
<div id="folderDetail" class="tab"></div>
<div id="services" class="tab"></div>
<div id="transactions" class="tab"></div>
<div id="receivables" class="tab"></div>
<div id="payables" class="tab"></div>
<div id="accounts" class="tab"></div>
<div id="reports" class="tab"></div>
</section>
</main>

<!-- Transaction modal -->
<div id="txModal" class="modal-bg fixed inset-0 z-50 hidden items-center justify-center p-4">
<div class="bg-white rounded-2xl w-full max-w-xl max-h-[92vh] overflow-auto">
<div class="p-5 border-b flex justify-between"><div><h2 id="txTitle" class="font-bold text-lg">Novo lançamento</h2><p class="text-xs text-slate-500">Entrada ou saída financeira</p></div><button onclick="closeModal('txModal')"><i data-lucide="x"></i></button></div>
<form id="txForm" class="p-5 space-y-4">
<input id="txId" type="hidden">
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Tipo<select id="txType" class="input mt-1"><option value="income">Entrada</option><option value="expense">Saída</option></select></label><label class="text-sm">Status<select id="txStatus" class="input mt-1"><option value="paid">Pago / Recebido</option><option value="pending">Pendente</option><option value="overdue">Vencido</option></select></label></div>
<label class="text-sm">Descrição<input id="txDesc" required class="input mt-1" placeholder="Ex.: Parcela 03 — Cliente"></label>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Valor<input id="txAmount" required type="number" min="0" step=".01" class="input mt-1"></label><label class="text-sm">Data<input id="txDate" required type="date" class="input mt-1"></label></div>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Categoria / Pasta<select id="txFolder" class="input mt-1"></select></label><label class="text-sm">Conta / Caixa<select id="txAccount" class="input mt-1"></select></label></div>
<label class="text-sm">Observações<textarea id="txNotes" class="input mt-1" rows="2"></textarea></label>
<div class="flex justify-end gap-2"><button type="button" onclick="closeModal('txModal')" class="btn bg-slate-100">Cancelar</button><button class="btn primary">Salvar lançamento</button></div>
</form></div></div>

<!-- Folder modal -->
<div id="folderModal" class="modal-bg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-md">
<div class="p-5 border-b flex justify-between"><h2 class="font-bold">Nova categoria / pasta</h2><button onclick="closeModal('folderModal')"><i data-lucide="x"></i></button></div>
<form id="folderForm" class="p-5 space-y-4"><label class="text-sm">Nome da pasta<input id="folderName" required class="input mt-1" placeholder="Ex.: Reforma da casa"></label><label class="text-sm">Objetivo / descrição<textarea id="folderDesc" class="input mt-1" rows="2"></textarea></label><div class="grid grid-cols-2 gap-3"><label class="text-sm">Tipo<select id="folderType" class="input mt-1"><option value="both">Entradas e saídas</option><option value="expense">Despesas</option><option value="income">Receitas</option></select></label><label class="text-sm">Ícone<select id="folderIcon" class="input mt-1"><option value="folder">Pasta</option><option value="home">Casa</option><option value="car">Carro</option><option value="briefcase">Trabalho</option><option value="heart">Pessoal</option><option value="graduation-cap">Educação</option></select></label></div><button class="btn primary w-full">Criar pasta</button></form></div></div>

<!-- Service modal -->
<div id="serviceModal" class="modal-bg fixed inset-0 z-50 hidden items-center justify-center p-4"><div class="bg-white rounded-2xl w-full max-w-2xl max-h-[94vh] overflow-auto">
<div class="p-5 border-b flex justify-between"><div><h2 id="serviceTitle" class="font-bold text-lg">Novo serviço</h2><p class="text-xs text-slate-500">Controle contrato, parcelas e datas fixas</p></div><button onclick="closeModal('serviceModal')"><i data-lucide="x"></i></button></div>
<form id="serviceForm" class="p-5 space-y-4">
<input id="serviceId" type="hidden">
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Cliente / contratante<input id="svClient" required class="input mt-1" placeholder="Nome do cliente"></label><label class="text-sm">Nome do serviço<input id="svName" required class="input mt-1" placeholder="Ex.: Consultoria"></label></div>
<div class="grid grid-cols-3 gap-3"><label class="text-sm">Data início<input id="svStart" required type="date" class="input mt-1"></label><label class="text-sm">Data final<input id="svEnd" required type="date" class="input mt-1"></label><label class="text-sm">Valor total<input id="svTotal" required type="number" min="0" step=".01" class="input mt-1"></label></div>
<div class="grid grid-cols-2 gap-3"><label class="text-sm">Modelo de cobrança<select id="svBilling" class="input mt-1" onchange="toggleBilling()"><option value="single">Pagamento único</option><option value="installments">Prestação / parcelas</option><option value="fixed">Datas fixas</option></select></label><label class="text-sm">Pasta / categoria<select id="svFolder" class="input mt-1"></select></label></div>
<div id="installmentFields" class="hidden grid grid-cols-2 gap-3"><label class="text-sm">Quantidade de parcelas<input id="svInstallments" type="number" min="1" class="input mt-1" placeholder="Ex.: 12"></label><label class="text-sm">Valor por parcela<input id="svInstallmentValue" type="number" min="0" step=".01" class="input mt-1"></label></div>
<div id="fixedFields" class="hidden grid grid-cols-2 gap-3"><label class="text-sm">Periodicidade<select id="svFrequency" class="input mt-1"><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="custom">Data fixa personalizada</option></select></label><label class="text-sm">Dia fixo<input id="svFixedDay" type="number" min="1" max="31" class="input mt-1" placeholder="Ex.: 10"></label></div>
<label class="text-sm">Descrição / observações<textarea id="svNotes" class="input mt-1" rows="2"></textarea></label>
<div class="flex justify-end gap-2"><button type="button" onclick="closeModal('serviceModal')" class="btn bg-slate-100">Cancelar</button><button class="btn primary">Salvar serviço</button></div>
</form></div></div>

<script>
const KEY='fincontrol_pro_v2';
const iso=()=>new Date().toISOString().slice(0,10);
const uid=()=>crypto.randomUUID();
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 folders:[
  {id:uid(),name:'Casa',desc:'Despesas e pagamentos da casa',type:'expense',icon:'home'},
  {id:uid(),name:'Trabalho / Serviços',desc:'Receitas de serviços',type:'income',icon:'briefcase'},
  {id:uid(),name:'Veículo',desc:'Despesas do carro',type:'expense',icon:'car'}
 ],
 accounts:[{id:uid(),name:'Conta principal',type:'Banco',balance:0},{id:uid(),name:'Dinheiro',type:'Caixa',balance:0}],
 transactions:[
  {id:uid(),type:'income',status:'paid',desc:'Serviço — exemplo',amount:2500,date:iso(),folder:'Trabalho / Serviços',account:'Conta principal',notes:''},
  {id:uid(),type:'expense',status:'paid',desc:'Internet',amount:120,date:iso(),folder:'Casa',account:'Conta principal',notes:''},
  {id:uid(),type:'expense',status:'pending',desc:'Energia elétrica',amount:245,date:iso(),folder:'Casa',account:'Conta principal',notes:''}
 ],
 services:[
  {id:uid(),client:'Cliente Exemplo',name:'Serviço mensal',start:iso(),end:iso(),total:2400,billing:'installments',installments:6,installmentValue:400,paid:800,folder:'Trabalho / Serviços',notes:''},
  {id:uid(),client:'Cliente Fixo',name:'Acompanhamento',start:iso(),end:iso(),total:1200,billing:'fixed',frequency:'monthly',fixedDay:10,paid:400,folder:'Trabalho / Serviços',notes:''}
 ]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function total(type,status){return db.transactions.filter(x=>(!type||x.type===type)&&(!status||[].concat(status).includes(x.status))).reduce((s,x)=>s+Number(x.amount),0)}
function periodTx(){let p=document.getElementById('period')?.value||'month';return db.transactions.filter(x=>{let d=new Date(x.date);return p==='all'||(p==='year'?d.getFullYear()===new Date().getFullYear():d.getMonth()===new Date().getMonth()&&d.getFullYear()===new Date().getFullYear())})}
const nav=[['overview','layout-dashboard','Overview'],['folders','folder-kanban','Categorias / Pastas'],['services','briefcase-business','Serviços'],['transactions','arrow-left-right','Entradas & Saídas'],['receivables','circle-dollar-sign','A receber'],['payables','receipt-text','A pagar'],['accounts','wallet-cards','Caixas & Contas'],['reports','chart-no-axes-combined','Relatórios']];
function renderNav(){document.getElementById('nav').innerHTML=nav.map((n,i)=>`<button data-tab="${n[0]}" onclick="showTab('${n[0]}')" class="nav w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm ${i?'':'active'}"><i data-lucide="${n[1]}" class="w-5"></i><span class="navtext">${n[2]}</span></button>`).join('')}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));let n=nav.find(x=>x[0]===t);document.getElementById('title').textContent=n?n[2]:'Detalhes';document.getElementById('subtitle').textContent=t==='overview'?'Visão geral das suas finanças':t==='folders'?'Organize pagamentos por projeto, objetivo ou categoria':t==='services'?'Contratos, parcelas, valores pagos e pendências':'Controle financeiro';renderAll()}
function kpi(t,v,icon,cls=''){return `<div class="card p-5"><div class="flex justify-between"><div><div class="text-sm text-slate-500">${t}</div><div class="money text-2xl font-bold mt-2 ${cls}">${brl(v)}</div></div><div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center"><i data-lucide="${icon}" class="w-5"></i></div></div></div>`}
function renderOverview(){
 let a=periodTx(),inc=a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),pend=a.filter(x=>x.status==='pending'||x.status==='overdue').reduce((s,x)=>s+x.amount,0);
 let serviceTotal=db.services.reduce((s,x)=>s+x.total,0),servicePaid=db.services.reduce((s,x)=>s+servicePaidValue(x),0);
 document.getElementById('overview').innerHTML=`<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Saldo do período',inc-exp,'wallet','')}${kpi('Entradas',inc,'trending-up','text-emerald-600')}${kpi('Saídas',exp,'trending-down','text-red-600')}${kpi('Pendente',pend,'clock','text-amber-600')}</div>
 <div class="grid grid-cols-1 xl:grid-cols-3 gap-5 mt-5"><div class="card p-5 xl:col-span-2"><div class="flex justify-between mb-3"><div><b>Fluxo financeiro</b><p class="text-xs text-slate-500">Últimos 6 meses</p></div></div><canvas id="chart" height="105"></canvas></div>
 <div class="card p-5"><b>Serviços em acompanhamento</b><div class="mt-5 space-y-5"><div><div class="text-xs text-slate-500">Valor contratado</div><div class="text-xl font-bold">${brl(serviceTotal)}</div></div><div><div class="text-xs text-slate-500">Valor pago</div><div class="text-xl font-bold text-emerald-600">${brl(servicePaid)}</div></div><div><div class="text-xs text-slate-500">Restante</div><div class="text-xl font-bold text-amber-600">${brl(serviceTotal-servicePaid)}</div></div></div></div></div>
 <div class="card mt-5 overflow-hidden"><div class="p-5"><b>Últimos lançamentos</b></div><div class="overflow-x-auto">${txTable(a.slice().reverse().slice(0,7))}</div></div>`;
 setTimeout(drawChart,20)
}
function txTable(arr){return `<table class="table w-full"><thead><tr><th>Data</th><th>Descrição</th><th>Pasta</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr><td>${fmt(x.date)}</td><td><b>${esc(x.desc)}</b></td><td>${esc(x.folder||'Outros')}</td><td class="money font-bold ${x.type==='income'?'text-emerald-600':'text-red-600'}">${x.type==='income'?'+':'−'} ${brl(x.amount)}</td><td>${statusBadge(x)}</td><td class="text-right whitespace-nowrap"><button onclick="editTx('${x.id}')" class="p-2 text-slate-500"><i data-lucide="pencil" class="w-4"></i></button><button onclick="deleteTx('${x.id}')" class="p-2 text-slate-500 hover:text-red-600"><i data-lucide="trash-2" class="w-4"></i></button></td></tr>`).join(''):`<tr><td colspan="6" class="text-center py-8 text-slate-400">Nenhum registro.</td></tr>`}</tbody></table>`}
function statusBadge(x){let c=x.status==='paid'?'bg-emerald-50 text-emerald-700':x.status==='overdue'?'bg-red-50 text-red-700':'bg-amber-50 text-amber-700';let s=x.status==='paid'?(x.type==='income'?'Recebido':'Pago'):x.status==='overdue'?'Vencido':'Pendente';return `<span class="badge ${c}">${s}</span>`}
function renderTransactions(){let a=periodTx();document.getElementById('transactions').innerHTML=`<div class="flex justify-between gap-3 mb-5"><div><h2 class="text-2xl font-bold">Entradas & Saídas</h2><p class="text-slate-500">Todos os movimentos financeiros.</p></div><button onclick="openTx()" class="btn primary">+ Novo lançamento</button></div><div class="card overflow-hidden">${txTable(a.slice().reverse())}</div>`}
function folderStats(f){let t=db.transactions.filter(x=>x.folder===f.name);let inc=t.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),exp=t.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),pend=t.filter(x=>x.status!=='paid').reduce((s,x)=>s+x.amount,0);let sv=db.services.filter(x=>x.folder===f.name);return {t,inc,exp,pend,sv}}
function renderFolders(){
 document.getElementById('folders').innerHTML=`<div class="flex justify-between gap-3 mb-6"><div><h2 class="text-2xl font-bold">Categorias / Pastas</h2><p class="text-slate-500">Crie uma pasta para acompanhar um projeto, objetivo, cliente ou conjunto de pagamentos.</p></div><button onclick="openFolder()" class="btn primary">+ Nova pasta</button></div>
 <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${db.folders.map(f=>{let s=folderStats(f);return `<div class="card folder p-5 cursor-pointer" onclick="openFolderDetail('${f.id}')"><div class="flex justify-between"><div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="${f.icon}"></i></div><div><button onclick="event.stopPropagation();deleteFolder('${f.id}')" class="p-2 text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4"></i></button></div></div><h3 class="font-bold text-lg mt-4">${esc(f.name)}</h3><p class="text-xs text-slate-500 mt-1">${esc(f.desc||'')}</p><div class="grid grid-cols-2 gap-3 mt-5"><div><div class="text-xs text-slate-400">Entradas</div><b class="text-emerald-600">${brl(s.inc)}</b></div><div><div class="text-xs text-slate-400">Saídas</div><b class="text-red-600">${brl(s.exp)}</b></div></div><div class="mt-4 pt-4 border-t flex justify-between text-xs"><span>${s.t.length} lançamentos</span><span>${s.sv.length} serviços</span></div></div>`}).join('')}</div>`
}
function openFolderDetail(id){let f=db.folders.find(x=>x.id===id);if(!f)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('folderDetail').classList.add('active');document.getElementById('title').textContent=f.name;let s=folderStats(f);let serviceValue=s.sv.reduce((a,x)=>a+x.total,0),servicePaid=s.sv.reduce((a,x)=>a+servicePaidValue(x),0);document.getElementById('folderDetail').innerHTML=`<button onclick="showTab('folders')" class="text-sm text-blue-600 mb-4">← Voltar para pastas</button><div class="flex justify-between gap-3 mb-5"><div><h2 class="text-2xl font-bold">${esc(f.name)}</h2><p class="text-slate-500">${esc(f.desc||'')}</p></div><button onclick="openTx()" class="btn primary">+ Inserir pagamento</button></div><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">${kpi('Entradas',s.inc,'trending-up','text-emerald-600')}${kpi('Saídas',s.exp,'trending-down','text-red-600')}${kpi('Pendente',s.pend,'clock','text-amber-600')}${kpi('Saldo',s.inc-s.exp,'wallet','')}</div><div class="card mt-5 overflow-hidden"><div class="p-5"><b>Pagamentos / lançamentos da pasta</b></div>${txTable(s.t.slice().reverse())}</div><div class="card mt-5 p-5"><b>Serviços vinculados</b><div class="grid md:grid-cols-3 gap-3 mt-4">${s.sv.length?s.sv.map(serviceMini).join(''):'<p class="text-sm text-slate-400">Nenhum serviço vinculado.</p>'}</div></div>`;lucide.createIcons()}
function servicePaidValue(s){if(s.paid!=null)return Number(s.paid);return db.transactions.filter(x=>x.serviceId===s.id&&x.status==='paid').reduce((a,x)=>a+x.amount,0)}
function serviceStatus(s){let paid=servicePaidValue(s),remaining=Math.max(0,s.total-paid);if(remaining<=0)return ['Concluído','bg-emerald-50 text-emerald-700'];if(new Date(s.end)<new Date()&&remaining>0)return ['Em atraso','bg-red-50 text-red-700'];return ['Em andamento','bg-blue-50 text-blue-700']}
function installmentsInfo(s){if(s.billing==='installments'){let n=Number(s.installments||0),v=Number(s.installmentValue||s.total/n||0),paid=servicePaidValue(s),count=v?Math.floor(paid/v+0.00001):0;return `${count} de ${n} parcelas pagas · ${Math.max(0,n-count)} restantes`}if(s.billing==='fixed'){let start=new Date(s.start),end=new Date(s.end),freq=s.frequency,expected=0; if(freq==='monthly'){expected=(end.getFullYear()-start.getFullYear())*12+(end.getMonth()-start.getMonth())+1}else if(freq==='weekly'){expected=Math.floor((end-start)/(7*864e5))+1}else expected=0;let paid=servicePaidValue(s),expectedValue=expected? s.total/expected:0,paidCount=expectedValue?Math.floor(paid/expectedValue+0.00001):0,missing=Math.max(0,expected-paidCount);return `${expected} datas previstas · ${paidCount} pagas · ${missing} faltantes`}return 'Pagamento único'}
function serviceMini(s){let p=servicePaidValue(s),r=Math.max(0,s.total-p),pct=Math.min(100,p/s.total*100||0);return `<div class="border rounded-xl p-4"><div class="flex justify-between"><b class="text-sm">${esc(s.name)}</b><span class="badge ${serviceStatus(s)[1]}">${serviceStatus(s)[0]}</span></div><div class="text-xs text-slate-500 mt-1">${esc(s.client)}</div><div class="progress mt-4"><div style="width:${pct}%;background:#10b981"></div></div><div class="grid grid-cols-3 gap-2 mt-3 text-xs"><div><span class="text-slate-400">Total</span><b class="block">${brl(s.total)}</b></div><div><span class="text-slate-400">Pago</span><b class="block text-emerald-600">${brl(p)}</b></div><div><span class="text-slate-400">Restante</span><b class="block text-amber-600">${brl(r)}</b></div></div></div>`}
function renderServices(){document.getElementById('services').innerHTML=`<div class="flex justify-between mb-6"><div><h2 class="text-2xl font-bold">Serviços</h2><p class="text-slate-500">Acompanhe contratos do início ao fim, com pagamento, parcelas e datas previstas.</p></div><button onclick="openService()" class="btn primary">+ Novo serviço</button></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${kpi('Valor contratado',db.services.reduce((a,x)=>a+x.total,0),'briefcase','')}${kpi('Valor pago',db.services.reduce((a,x)=>a+servicePaidValue(x),0),'badge-check','text-emerald-600')}${kpi('Restante',db.services.reduce((a,x)=>a+Math.max(0,x.total-servicePaidValue(x)),0),'hourglass','text-amber-600')}</div><div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-5">${db.services.map(serviceCard).join('')}</div>`}
function serviceCard(s){let p=servicePaidValue(s),r=Math.max(0,s.total-p),pct=Math.min(100,p/s.total*100||0),st=serviceStatus(s);return `<div class="card p-5"><div class="flex justify-between gap-3"><div><div class="text-xs text-slate-500">${esc(s.client)}</div><h3 class="font-bold text-lg">${esc(s.name)}</h3></div><div class="flex gap-1"><button onclick="editService('${s.id}')" class="p-2 text-slate-500"><i data-lucide="pencil" class="w-4"></i></button><button onclick="deleteService('${s.id}')" class="p-2 text-slate-500"><i data-lucide="trash-2" class="w-4"></i></button></div></div><div class="grid grid-cols-3 gap-3 mt-5"><div><div class="text-xs text-slate-400">Valor total</div><b>${brl(s.total)}</b></div><div><div class="text-xs text-slate-400">Valor pago</div><b class="text-emerald-600">${brl(p)}</b></div><div><div class="text-xs text-slate-400">Restante</div><b class="text-amber-600">${brl(r)}</b></div></div><div class="progress mt-4"><div style="width:${pct}%;background:#10b981"></div></div><div class="flex justify-between text-xs text-slate-500 mt-2"><span>${pct.toFixed(0)}% pago</span><span>${st[0]}</span></div><div class="mt-5 p-3 bg-slate-50 rounded-xl"><div class="flex justify-between text-sm"><span class="font-semibold">${billingLabel(s)}</span><span>${installmentsInfo(s)}</span></div>${s.billing==='fixed'?`<div class="text-xs mt-2 ${countMissing(s)>0?'text-red-600':'text-emerald-600'}">${countMissing(s)>0?'⚠ '+countMissing(s)+' data(s) sem pagamento':'✓ Todas as datas registradas estão cobertas'}</div>`:''}</div><div class="grid grid-cols-2 gap-3 mt-4 text-xs"><div><span class="text-slate-400">Início</span><b class="block">${fmt(s.start)}</b></div><div><span class="text-slate-400">Final</span><b class="block">${fmt(s.end)}</b></div></div></div>`}
function billingLabel(s){return s.billing==='installments'?'Prestação / parcelas':s.billing==='fixed'?'Datas fixas':'Pagamento único'}
function countMissing(s){if(s.billing!=='fixed')return 0;let start=new Date(s.start),end=new Date(s.end),expected=s.frequency==='monthly'?((end.getFullYear()-start.getFullYear())*12+end.getMonth()-start.getMonth()+1):s.frequency==='weekly'?Math.floor((end-start)/(7*864e5))+1:0;let v=expected?s.total/expected:0,paid=servicePaidValue(s),n=v?Math.floor(paid/v+0.00001):0;return Math.max(0,expected-n)}
function renderReceivables(){let a=db.transactions.filter(x=>x.type==='income'&&x.status!=='paid');document.getElementById('receivables').innerHTML=section('A receber','Entradas pendentes e vencidas.',a,'income')}
function renderPayables(){let a=db.transactions.filter(x=>x.type==='expense'&&x.status!=='paid');document.getElementById('payables').innerHTML=section('A pagar','Despesas pendentes e vencidas.',a,'expense')}
function section(title,desc,a,type){return `<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">${title}</h2><p class="text-slate-500">${desc}</p></div><button onclick="openTx('${type}')" class="btn primary">+ Adicionar</button></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5">${kpi('Em aberto',a.reduce((s,x)=>s+x.amount,0),'circle-dollar-sign',type==='income'?'text-emerald-600':'text-red-600')}${kpi('Vencido',a.filter(x=>x.status==='overdue').reduce((s,x)=>s+x.amount,0),'triangle-alert','text-red-600')}${kpi('Quantidade',a.length,'list-check','')}</div><div class="card overflow-hidden">${txTable(a.slice().reverse())}</div>`}
function renderAccounts(){document.getElementById('accounts').innerHTML=`<div class="flex justify-between mb-5"><div><h2 class="text-2xl font-bold">Caixas & Contas</h2><p class="text-slate-500">Onde seu dinheiro está.</p></div><button onclick="addAccount()" class="btn primary">+ Nova conta</button></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${db.accounts.map(a=>`<div class="card p-5"><div class="flex justify-between"><div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="wallet"></i></div><button onclick="deleteAccount('${a.id}')" class="text-slate-400"><i data-lucide="trash-2" class="w-4"></i></button></div><div class="text-xs text-slate-500 mt-4">${a.type}</div><b class="text-lg">${esc(a.name)}</b><div class="text-2xl font-bold mt-2">${brl(a.balance)}</div></div>`).join('')}</div>`}
function renderReports(){let e=total('income'),s=total('expense');let by=db.folders.map(f=>({name:f.name,v:folderStats(f).exp})).filter(x=>x.v>0);document.getElementById('reports').innerHTML=`<div class="mb-5"><h2 class="text-2xl font-bold">Relatórios</h2><p class="text-slate-500">Resumo financeiro por categoria e pasta.</p></div><div class="grid md:grid-cols-3 gap-4">${kpi('Entradas',e,'trending-up','text-emerald-600')}${kpi('Saídas',s,'trending-down','text-red-600')}${kpi('Resultado',e-s,'sigma','')}</div><div class="card p-5 mt-5"><b>Despesas por pasta</b><div class="mt-5">${by.length?by.map(x=>`<div class="mb-4"><div class="flex justify-between text-sm"><span>${esc(x.name)}</span><b>${brl(x.v)}</b></div><div class="progress mt-2"><div style="width:${Math.min(100,x.v/(s||1)*100)}%;background:#64748b"></div></div></div>`).join(''):'<div class="text-slate-400 text-sm mt-4">Sem despesas.</div>'}</div></div>`}
function renderAll(){renderOverview();renderFolders();renderServices();renderTransactions();renderReceivables();renderPayables();renderAccounts();renderReports();lucide.createIcons()}
function openModal(id){let x=document.getElementById(id);x.classList.remove('hidden');x.classList.add('flex')}
function closeModal(id){let x=document.getElementById(id);x.classList.add('hidden');x.classList.remove('flex')}
function fillOptions(){let f=document.getElementById('txFolder');f.innerHTML=db.folders.map(x=>`<option>${esc(x.name)}</option>`).join('');document.getElementById('txAccount').innerHTML=db.accounts.map(x=>`<option>${esc(x.name)}</option>`).join('');document.getElementById('svFolder').innerHTML=db.folders.map(x=>`<option>${esc(x.name)}</option>`).join('')}
function openTx(type){fillOptions();document.getElementById('txForm').reset();document.getElementById('txId').value='';document.getElementById('txDate').value=iso();document.getElementById('txType').value=type||'income';document.getElementById('txStatus').value='paid';document.getElementById('txTitle').textContent=type==='expense'?'Nova saída':'Novo lançamento';openModal('txModal')}
function editTx(id){let x=db.transactions.find(a=>a.id===id);if(!x)return;openTx(x.type);setTimeout(()=>{txId.value=x.id;txStatus.value=x.status;txDesc.value=x.desc;txAmount.value=x.amount;txDate.value=x.date;txFolder.value=x.folder;txAccount.value=x.account;txNotes.value=x.notes||'';txTitle.textContent='Editar lançamento'},10)}
document.getElementById('txForm').onsubmit=e=>{e.preventDefault();let id=txId.value,o={id:id||uid(),type:txType.value,status:txStatus.value,desc:txDesc.value,amount:+txAmount.value,date:txDate.value,folder:txFolder.value,account:txAccount.value,notes:txNotes.value};if(id)db.transactions[db.transactions.findIndex(x=>x.id===id)]=o;else db.transactions.push(o);save();closeModal('txModal');renderAll()}
function deleteTx(id){if(confirm('Excluir este lançamento?')){db.transactions=db.transactions.filter(x=>x.id!==id);save();renderAll()}}
function openFolder(){folderForm.reset();openModal('folderModal')}
document.getElementById('folderForm').onsubmit=e=>{e.preventDefault();db.folders.push({id:uid(),name:folderName.value,desc:folderDesc.value,type:folderType.value,icon:folderIcon.value});save();closeModal('folderModal');renderAll()}
function deleteFolder(id){let f=db.folders.find(x=>x.id===id);if(confirm('Excluir a pasta "'+f.name+'"? Os lançamentos não serão apagados.')){db.folders=db.folders.filter(x=>x.id!==id);save();renderAll()}}
function addAccount(){let name=prompt('Nome da conta/caixa:');if(!name)return;db.accounts.push({id:uid(),name,type:'Banco',balance:0});save();renderAll()}
function deleteAccount(id){if(confirm('Excluir esta conta?')){db.accounts=db.accounts.filter(x=>x.id!==id);save();renderAll()}}
function openService(){fillOptions();serviceForm.reset();serviceId.value='';svStart.value=iso();svEnd.value=iso();svBilling.value='single';toggleBilling();serviceTitle.textContent='Novo serviço';openModal('serviceModal')}
function toggleBilling(){installmentFields.classList.toggle('hidden',svBilling.value!=='installments');fixedFields.classList.toggle('hidden',svBilling.value!=='fixed')}
document.getElementById('serviceForm').onsubmit=e=>{e.preventDefault();let id=serviceId.value,o={id:id||uid(),client:svClient.value,name:svName.value,start:svStart.value,end:svEnd.value,total:+svTotal.value,billing:svBilling.value,installments:+svInstallments.value||0,installmentValue:+svInstallmentValue.value||0,frequency:svFrequency.value,fixedDay:+svFixedDay.value||0,folder:svFolder.value,notes:svNotes.value,paid:id?(db.services.find(x=>x.id===id)?.paid||0):0};if(id)db.services[db.services.findIndex(x=>x.id===id)]=o;else db.services.push(o);save();closeModal('serviceModal');renderAll()}
function editService(id){let s=db.services.find(x=>x.id===id);if(!s)return;openService();setTimeout(()=>{serviceId.value=s.id;svClient.value=s.client;svName.value=s.name;svStart.value=s.start;svEnd.value=s.end;svTotal.value=s.total;svBilling.value=s.billing;svInstallments.value=s.installments||'';svInstallmentValue.value=s.installmentValue||'';svFrequency.value=s.frequency||'monthly';svFixedDay.value=s.fixedDay||'';svFolder.value=s.folder||'';svNotes.value=s.notes||'';toggleBilling();serviceTitle.textContent='Editar serviço'},10)}
function deleteService(id){if(confirm('Excluir este serviço?')){db.services=db.services.filter(x=>x.id!==id);save();renderAll()}}
function drawChart(){let c=document.getElementById('chart');if(!c)return;if(window.cc)cc.destroy();let labels=[],ins=[],outs=[];for(let i=5;i>=0;i--){let d=new Date(new Date().getFullYear(),new Date().getMonth()-i,1);labels.push(d.toLocaleDateString('pt-BR',{month:'short'}));let a=db.transactions.filter(x=>{let z=new Date(x.date);return z.getMonth()===d.getMonth()&&z.getFullYear()===d.getFullYear()});ins.push(a.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0));outs.push(a.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0))}cc=new Chart(c,{type:'line',data:{labels,datasets:[{label:'Entradas',data:ins,tension:.35,borderWidth:3},{label:'Saídas',data:outs,tension:.35,borderWidth:3}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR')}}}}})}
function fmt(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('period').onchange=renderAll;renderNav();renderAll();
</script>
</body>
</html>
